;\n\n  let main = -1;\n  for (let i = 1; i \u003c data.length; i++) {\n    if (Number(data[i][0]) === e.seat && data[i][COL_KIND - 1] === ROW_KIND.MAIN) { main = i; break; }\n  }\n  if (main \u003c 0) {\n    const row = [e.seat].concat(GROUPS.map(() => ''), ['', ROW_KIND.MAIN]);\n    sh.appendRow(row);\n    main = sh.getLastRow() - 1;\n    data.push(row);\n    styleMainRow_(sh, main + 1);\n  }\n\n  let targetRow, value, bg;\n  if (!asRevision && data[main][col - 1] === '') {\n    targetRow = main + 1;\n    value = e.total;\n    bg = null;\n  } else {\n    let last = main, found = -1;\n    for (let i = main + 1; i \u003c data.length; i++) {\n      if (Number(data[i][0]) === e.seat && data[i][COL_KIND - 1] === ROW_KIND.REV) {\n        last = i;\n        if (found \u003c 0 && data[i][col - 1] === '') found = i;\n      } else break;\n    }\n    if (found \u003c 0) {\n      sh.insertRowAfter(last + 1);\n      found = last + 1;\n      const rng = sh.getRange(found + 1, 1, 1, MATRIX_HEADER.length);\n      rng.clearNote().setBackground(null).setFontWeight('normal').setFontColor('#6b7280')\n        .setValues([[e.seat].concat(GROUPS.map(() => ''), ['', ROW_KIND.REV])]);\n      sh.getRange(found + 1, 1).setNumberFormat('00');\n    }\n    targetRow = found + 1;\n    value = e.type === TYPE.DEL ? '🗑️撤回評分' : `⚠️修改分數：${e.total}分`;\n    bg = e.type === TYPE.DEL ? '#ffe4e6' : '#fef3c7';\n  }\n\n  sh.getRange(targetRow, col).setValue(value).setNote(buildNote_(e)).setBackground(bg)\n    .setFontColor(bg ? '#92400e' : '#111827').setFontWeight('bold');\n  sh.getRange(targetRow, COL_TIME).setValue(timeStr);\n  if (targetRow !== main + 1) sh.getRange(main + 1, COL_TIME).setValue(timeStr);\n}\n\nfunction buildNote_(e) {\n  const lines = [`繳交時間：${fmt_(e.time)}`, `紀錄類型：${e.type}`];\n  if (e.type !== TYPE.DEL) {\n    CRITERIA.forEach((c, i) => lines.push(`${c}：${e.scores[i]} 分`));\n    lines.push(`總分：${e.total} / ${MAX_TOTAL}`);\n  }\n  return lines.join('\\n');\n}\n\n/* =====================================================================\n *  自動偵測與建立分頁（含模擬資料）\n * ===================================================================== */\nfunction ensureSetup_() {\n  if (!SHEET_ORDER.some(n => !findSheet_(ss_(), n))) return [];\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(30000);\n  try {\n    // 取得鎖之後重新開啟試算表，避免讀到其他同時執行的請求建立前的舊狀態\n    SS_CACHE_ = null;\n    const ss = ss_();\n    const created = [];\n    const steps = [\n      [SHEET.README, createReadme_],\n      [SHEET.ROSTER, createRoster_],\n      [SHEET.LOG, createLog_],\n      [SHEET.MATRIX, createMatrix_]\n    ];\n    steps.forEach(([name, fn]) => {\n      if (!findSheet_(ss, name) && fn(ss)) created.push(name);\n    });\n\n    if (created.length) {\n      ss.getSheets().forEach(sh => {\n        const n = sh.getName();\n        if (SHEET_ORDER.indexOf(n) \u003c 0 && /^(工作表|Sheet)\\s?\\d+$/.test(n) && sh.getLastRow() === 0 && ss.getSheets().length > 1) {\n          ss.deleteSheet(sh);\n        }\n      });\n      SHEET_ORDER.forEach((n, i) => {\n        const sh = findSheet_(ss, n);\n        if (sh) { ss.setActiveSheet(sh); ss.moveActiveSheet(i + 1); }\n      });\n      SpreadsheetApp.flush();\n    }\n    return created;\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/** 依名稱找分頁（忽略前後空白，避免老師手動改名時多打空格） */\nfunction findSheet_(ss, name) {\n  const target = String(name).trim();\n  return ss.getSheets().find(sh => sh.getName().trim() === target) || null;\n}\n\n/**\n * 安全建立分頁：若同名分頁已被其他請求建立，回傳 null（不重複建立、不重填模擬資料）\n */\nfunction newSheet_(ss, name) {\n  try {\n    return ss.insertSheet(name);\n  } catch (e) {\n    SpreadsheetApp.flush();\n    if (findSheet_(ss, name)) return null;\n    throw e;\n  }\n}\n\nfunction createReadme_(ss) {\n  const sh = newSheet_(ss, SHEET.README);\n  if (!sh) return false;\n  const rows = [\n    ['🧭 圓規畫圓表現任務 ‧ 同儕評分系統 使用說明'],\n    [''],\n    ['【評分總表】第一欄為評分者座號，橫軸為第一組～第七組，儲存格為該同學給的總分（滿分 ' + MAX_TOTAL + '）。'],\n    ['　　　　　　 將滑鼠移到分數儲存格上，可看到繳交時間與四個面向的分項分數（儲存格附註）。'],\n    ['　　　　　　 同一座號重複評同一組時不覆寫，會在該座號下一列同一組標示「⚠️修改分數：X分」。'],\n    ['　　　　　　 撤回評分時，在下一列標示「🗑️撤回評分」，原始分數保留。'],\n    ['【評分紀錄】每一次送出（原始評分／修改分數／撤回評分）都會完整保留一列，含時間與分項分數。'],\n    ['【學生名單】可直接修改姓名與「身份碼」（四位數字，模擬資料預設皆為 1111），新增學生時匿名代碼可留白，系統會自動產生。'],\n    ['　　　　　　 身份碼連續輸錯 ' + MAX_FAIL + ' 次，該座號會暫停驗證 5 分鐘。'],\n    ['【即時看板】網頁上只顯示匿名代碼（如 R-7KQ3），不會顯示座號或姓名。'],\n    ['【雲端備份】每次送出或撤回後，「評分紀錄」會自動備份為 CSV，存放在指令碼屬性 FOLDER_ID 指定的資料夾（每天一個檔案）。'],\n    [''],\n    ['⚙️ 若要重新產生模擬資料：刪除任一分頁後重新整理網頁，系統會自動補建該分頁。'],\n    ['⚠️ 正式使用前，建議清空「評分紀錄」與「評分總表」的模擬內容（保留第一列標題），並更新「學生名單」。'],\n    ['　 清空「評分總表」時請保留每位學生的「原始評分列」，或整個刪除此分頁讓系統依名單重建。']\n  ];\n  sh.getRange(1, 1, rows.length, 1).setValues(rows);\n  sh.getRange(1, 1).setFontSize(16).setFontWeight('bold').setFontColor('#1e3a8a');\n  sh.setColumnWidth(1, 900);\n  sh.setHiddenGridlines(true);\n  return true;\n}\n\nfunction createRoster_(ss) {\n  const sh = newSheet_(ss, SHEET.ROSTER);\n  if (!sh) return false;\n  const used = new Set();\n  const rows = MOCK_NAMES.map((n, i) => [i + 1, n, '1111', newAnon_(used)]);\n  sh.getRange(1, 1, 1, ROSTER_HEADER.length).setValues([ROSTER_HEADER]);\n  sh.getRange(2, 3, rows.length, 1).setNumberFormat('@');\n  sh.getRange(2, 1, rows.length, 1).setNumberFormat('00');\n  sh.getRange(2, 1, rows.length, ROSTER_HEADER.length).setValues(rows);\n  styleHeader_(sh, ROSTER_HEADER.length);\n  sh.setColumnWidths(1, 4, 130);\n  return true;\n}\n\nfunction createLog_(ss) {\n  const sh = newSheet_(ss, SHEET.LOG);\n  if (!sh) return false;\n  sh.getRange(1, 1, 1, LOG_HEADER.length).setValues([LOG_HEADER]);\n  styleHeader_(sh, LOG_HEADER.length);\n  const entries = buildMockEntries_(readRoster_());\n  if (entries.length) {\n    sh.getRange(2, 1, entries.length, LOG_HEADER.length).setValues(entries.map(entryToRow_));\n    sh.getRange(2, 2, entries.length, 1).setNumberFormat('yyyy/MM/dd HH:mm:ss');\n    sh.getRange(2, 3, entries.length, 1).setNumberFormat('00');\n    entries.forEach((e, i) => {\n      if (e.type === TYPE.EDIT) sh.getRange(i + 2, 1, 1, LOG_HEADER.length).setBackground('#fffbeb');\n      if (e.type === TYPE.DEL) sh.getRange(i + 2, 1, 1, LOG_HEADER.length).setBackground('#ffe4e6');\n    });\n  }\n  sh.setColumnWidth(2, 160);\n  sh.setColumnWidths(7, CRITERIA.length, 150);\n  return true;\n}\n\nfunction createMatrix_(ss) {\n  const sh = newSheet_(ss, SHEET.MATRIX);\n  if (!sh) return false;\n  sh.getRange(1, 1, 1, MATRIX_HEADER.length).setValues([MATRIX_HEADER]);\n  styleHeader_(sh, MATRIX_HEADER.length);\n  const roster = readRoster_();\n  if (roster.length) {\n    const rows = roster.map(s => [s.seat].concat(GROUPS.map(() => ''), ['', ROW_KIND.MAIN]));\n    sh.getRange(2, 1, rows.length, MATRIX_HEADER.length).setValues(rows);\n    for (let r = 2; r \u003c rows.length + 2; r++) styleMainRow_(sh, r);\n  }\n  sh.setFrozenColumns(1);\n  sh.setColumnWidth(1, 100);\n  sh.setColumnWidths(2, GROUPS.length, 130);\n  sh.setColumnWidth(COL_TIME, 160);\n  sh.setColumnWidth(COL_KIND, 100);\n  sh.getRange(1, 2, sh.getMaxRows(), GROUPS.length).setHorizontalAlignment('center');\n\n  // 依「評分紀錄」重建總表內容（含模擬資料）\n  const seen = new Set();\n  readLog_().forEach(e => {\n    const k = e.seat + '|' + e.group;\n    writeMatrix_(e, seen.has(k));\n    seen.add(k);\n  });\n  return true;\n}\n\nfunction buildMockEntries_(roster) {\n  const rnd = n => Math.floor(Math.random() * n);\n  const pick = () => [2, 3, 3, 4, 4, 4][rnd(6)];\n  let t = Date.now() - 6 * 3600 * 1000;\n  const out = [];\n  const make = (st, g, type) => {\n    t += (1 + rnd(4)) * 60000;\n    const scores = type === TYPE.DEL ? ['', '', '', ''] : CRITERIA.map(pick);\n    return {\n      id: newId_(), time: new Date(t), seat: st.seat, name: st.name, anon: st.anon, group: g,\n      scores: scores, total: type === TYPE.DEL ? '' : scores.reduce((a, b) => a + b, 0), type: type\n    };\n  };\n  roster.slice(0, 10).forEach(st => {\n    shuffle_([1, 2, 3, 4, 5, 6, 7]).slice(0, 3 + rnd(3)).forEach(g => out.push(make(st, g, TYPE.NEW)));\n  });\n  const s2 = out.find(e => e.seat === 2);   // 模擬：2 號修改分數\n  if (s2) out.push(make(roster[1], s2.group, TYPE.EDIT));\n  const s5 = out.find(e => e.seat === 5);   // 模擬：5 號撤回評分\n  if (s5) out.push(make(roster[4], s5.group, TYPE.DEL));\n  return out;\n}\n\n/* =====================================================================\n *  工具\n * ===================================================================== */\n/**\n * 讀取指令碼屬性中的 SHEET_ID 與 FOLDER_ID，任一缺少就拋出中文錯誤（前台會以提示框顯示）\n */\nfunction getConfig_() {\n  const props = PropertiesService.getScriptProperties();\n  const sheetId = String(props.getProperty(PROP_KEYS.SHEET_ID) || '').trim();\n  const folderId = String(props.getProperty(PROP_KEYS.FOLDER_ID) || '').trim();\n  const missing = [];\n  if (!sheetId) missing.push(PROP_KEYS.SHEET_ID);\n  if (!folderId) missing.push(PROP_KEYS.FOLDER_ID);\n  if (missing.length) {\n    throw new Error('尚未設定指令碼屬性 ' + missing.join('、') +\n      '，請至「專案設定 → 指令碼屬性」新增（名稱需完全一致、大小寫相同），儲存後重新整理網頁。');\n  }\n  return { SHEET_ID: sheetId, FOLDER_ID: folderId };\n}\n\nlet SS_CACHE_ = null;\nfunction ss_() {\n  if (SS_CACHE_) return SS_CACHE_;\n  const cfg = getConfig_();\n  try {\n    SS_CACHE_ = SpreadsheetApp.openById(cfg.SHEET_ID);\n  } catch (e) {\n    throw new Error('無法開啟指令碼屬性 ' + PROP_KEYS.SHEET_ID + ' 指定的試算表，請確認 ID 正確，且部署者帳號有編輯權限。');\n  }\n  return SS_CACHE_;\n}\n\nlet FOLDER_CACHE_ = null;\nfunction folder_() {\n  if (FOLDER_CACHE_) return FOLDER_CACHE_;\n  const cfg = getConfig_();\n  try {\n    FOLDER_CACHE_ = DriveApp.getFolderById(cfg.FOLDER_ID);\n    FOLDER_CACHE_.getName();\n  } catch (e) {\n    throw new Error('無法開啟指令碼屬性 ' + PROP_KEYS.FOLDER_ID + ' 指定的雲端硬碟資料夾，請確認 ID 正確，且部署者帳號有編輯權限。');\n  }\n  return FOLDER_CACHE_;\n}\n\n/** 將「評分紀錄」備份為 CSV，存放在 FOLDER_ID 資料夾（每天一個檔案，當天內容持續更新） */\nfunction backupLogToDrive_() {\n  const values = sheet_(SHEET.LOG).getDataRange().getValues();\n  const csv = '\\uFEFF' + values.map(row => row.map(v => {\n    const t = v instanceof Date ? fmt_(v) : String(v);\n    return /[\",\\n]/.test(t) ? '\"' + t.replace(/\"/g, '\"\"') + '\"' : t;\n  }).join(',')).join('\\n');\n  const name = BACKUP_PREFIX + Utilities.formatDate(new Date(), TZ, 'yyyyMMdd') + '.csv';\n  const folder = folder_();\n  const files = folder.getFilesByName(name);\n  if (files.hasNext()) files.next().setContent(csv);\n  else folder.createFile(name, csv, MimeType.CSV);\n  return name;\n}\n\n/** 備份失敗不影響評分寫入，只記錄在執行紀錄 */\nfunction safeBackup_() {\n  try { return backupLogToDrive_(); } catch (e) { console.warn('備份失敗：' + e.message); return ''; }\n}\nfunction sheet_(name) { return findSheet_(ss_(), name); }\nfunction fmt_(d, p) { return d instanceof Date ? Utilities.formatDate(d, TZ, p || 'yyyy/MM/dd HH:mm:ss') : String(d || ''); }\nfunction newId_() { return 'R' + Utilities.formatDate(new Date(), TZ, 'yyMMddHHmmss') + '-' + Utilities.getUuid().slice(0, 4).toUpperCase(); }\n\nfunction newAnon_(used) {\n  let c;\n  do {\n    c = 'R-';\n    for (let i = 0; i \u003c 4; i++) c += ANON_CHARS.charAt(Math.floor(Math.random() * ANON_CHARS.length));\n  } while (used.has(c));\n  used.add(c);\n  return c;\n}\n\nfunction shuffle_(arr) {\n  for (let i = arr.length - 1; i > 0; i--) {\n    const j = Math.floor(Math.random() * (i + 1));\n    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;\n  }\n  return arr;\n}\n\nfunction styleHeader_(sh, n) {\n  sh.getRange(1, 1, 1, n).setBackground('#1e40af').setFontColor('#ffffff').setFontWeight('bold').setHorizontalAlignment('center');\n  sh.setFrozenRows(1);\n}\n\nfunction styleMainRow_(sh, r) {\n  sh.getRange(r, 1).setNumberFormat('00').setFontWeight('bold').setHorizontalAlignment('center');\n  sh.getRange(r, COL_KIND).setFontColor('#9ca3af');\n}\n", "secureIndex": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-TW\">\n\u003chead>\n    \u003cbase target=\"_top\">\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>圓規畫圓表現任務同儕評分系統\u003c/title>\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003cstyle>\n        body { font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif; }\n        .radio-card { transition: all 0.25s ease-in-out; }\n        .highlight-green { color: #059669; background-color: #d1fae5; padding: 0.1rem 0.25rem; border-radius: 0.25rem; font-weight: 700; }\n        .highlight-orange { color: #d97706; background-color: #fef3c7; padding: 0.1rem 0.25rem; border-radius: 0.25rem; font-weight: 700; }\n        .highlight-red { color: #e11d48; background-color: #ffe4e6; padding: 0.1rem 0.25rem; border-radius: 0.25rem; font-weight: 700; }\n        .spinner { width: 2.5rem; height: 2.5rem; border: 4px solid #bfdbfe; border-top-color: #2563eb; border-radius: 9999px; animation: spin 0.8s linear infinite; }\n        @keyframes spin { to { transform: rotate(360deg); } }\n        input[type=number]::-webkit-inner-spin-button { opacity: 0.4; }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"bg-blue-50 py-8 px-4 md:px-8\">\n\n    \u003c!-- 連線模式標示 -->\n    \u003cdiv id=\"modeBadge\" class=\"fixed top-3 right-3 z-40 text-xs font-bold px-3 py-1.5 rounded-full shadow-md\">\u003c/div>\n\n    \u003cdiv class=\"max-w-5xl mx-auto bg-transparent\">\n\n        \u003c!-- 頂部標題區 (活力藍色漸層) -->\n        \u003cdiv class=\"bg-gradient-to-r from-blue-700 to-blue-400 rounded-t-2xl p-8 shadow-lg text-white text-center\">\n            \u003ch1 class=\"text-3xl md:text-4xl font-extrabold mb-2 tracking-wide\">圓規畫圓表現任務 ‧ 同儕評分系統\u003c/h1>\n            \u003cp class=\"text-blue-100 font-medium\">國小三年級數學｜請點選各面向中最符合小組表現的敘述，系統將自動計分。\u003c/p>\n        \u003c/div>\n\n        \u003c!-- 評分表單區 -->\n        \u003cform id=\"gradingForm\" onsubmit=\"event.preventDefault()\" class=\"bg-white rounded-b-2xl shadow-xl p-6 md:p-10 space-y-8\">\n\n            \u003c!-- 基本資料區塊 -->\n            \u003cdiv class=\"bg-blue-50/60 p-6 rounded-xl border border-blue-200 shadow-sm space-y-4\">\n                \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-6\">\n                    \u003cdiv>\n                        \u003clabel for=\"raterSeat\" class=\"block text-sm font-bold text-blue-900 mb-2\">評分者座號 \u003cspan class=\"text-red-500\">*\u003c/span>\u003c/label>\n                        \u003cinput type=\"number\" id=\"raterSeat\" required min=\"1\" placeholder=\"例如: 5\"\n                            class=\"w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow text-gray-800 font-medium\">\n                        \u003cp class=\"text-xs text-blue-700 mt-1.5\">輸入後按 Enter 或點其他地方，會要求輸入身份碼\u003c/p>\n                    \u003c/div>\n                    \u003cdiv>\n                        \u003clabel for=\"raterName\" class=\"block text-sm font-bold text-blue-900 mb-2\">評分同學姓名 \u003cspan class=\"text-red-500\">*\u003c/span>\u003c/label>\n                        \u003cinput type=\"text\" id=\"raterName\" required readonly placeholder=\"驗證身份後自動帶入\"\n                            class=\"w-full px-4 py-3 rounded-lg border border-gray-300 bg-gray-100 text-gray-800 font-medium cursor-not-allowed focus:outline-none\">\n                    \u003c/div>\n                    \u003cdiv>\n                        \u003clabel for=\"targetGroup\" class=\"block text-sm font-bold text-blue-900 mb-2\">評核組別 \u003cspan class=\"text-red-500\">*\u003c/span>\u003c/label>\n                        \u003cdiv class=\"relative\">\n                            \u003cselect id=\"targetGroup\" required disabled\n                                class=\"w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-shadow appearance-none bg-white text-gray-800 font-medium cursor-pointer disabled:bg-gray-100 disabled:cursor-not-allowed\">\n                            \u003c/select>\n                            \u003cdiv class=\"pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-blue-500\">\n                                \u003csvg class=\"fill-current h-5 w-5\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 20 20\">\u003cpath d=\"M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z\"/>\u003c/svg>\n                            \u003c/div>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003c!-- 驗證狀態列 -->\n                \u003cdiv id=\"verifyBar\" class=\"hidden flex flex-wrap items-center gap-x-4 gap-y-2 bg-green-50 border border-green-200 rounded-lg px-4 py-3 text-sm\">\n                    \u003cspan class=\"font-bold text-green-700\">✅ 已驗證身份：\u003cspan id=\"verifiedLabel\">\u003c/span>\u003c/span>\n                    \u003cspan class=\"text-gray-600\">看板上你的匿名代碼：\u003cspan id=\"anonLabel\" class=\"font-mono font-bold bg-gray-800 text-white rounded px-2 py-0.5\">\u003c/span>\u003c/span>\n                    \u003cbutton type=\"button\" onclick=\"logout()\" class=\"ml-auto text-blue-700 hover:text-blue-900 font-bold underline underline-offset-2\">切換評分者\u003c/button>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- 評分卡片區（驗證前鎖定） -->\n            \u003cdiv class=\"relative\">\n                \u003cdiv id=\"criteriaContainer\" class=\"space-y-8\">\n                    \u003c!-- JavaScript 將動態生成評分卡片 -->\n                \u003c/div>\n                \u003cdiv id=\"lockOverlay\" class=\"absolute inset-0 bg-white/70 backdrop-blur-[2px] rounded-xl flex items-start justify-center pt-24 z-10\">\n                    \u003cdiv class=\"bg-white border-2 border-blue-200 shadow-lg rounded-xl px-8 py-5 text-center\">\n                        \u003cdiv class=\"text-4xl mb-1\">🔒\u003c/div>\n                        \u003cp class=\"font-extrabold text-blue-900 text-lg\">請先輸入座號並完成身份驗證\u003c/p>\n                        \u003cp class=\"text-sm text-gray-500 mt-1\">驗證成功後即可開始評分\u003c/p>\n                    \u003c/div>\n                \u003c/div>\n            \u003c/div>\n\n            \u003c!-- 底部結果顯示與繳交區 -->\n            \u003cdiv class=\"mt-10 p-6 bg-blue-900 text-white rounded-xl flex flex-col md:flex-row justify-between items-center shadow-inner border-t-4 border-blue-400 gap-6\">\n                \u003cdiv class=\"flex items-center space-x-4\">\n                    \u003cspan class=\"text-2xl font-bold tracking-wider\">小組總評分\u003c/span>\n                    \u003cdiv class=\"flex items-baseline space-x-2\">\n                        \u003cspan id=\"totalScore\" class=\"text-5xl font-extrabold text-yellow-400 inline-block\">0\u003c/span>\n                        \u003cspan class=\"text-xl text-blue-200 font-bold\">/ 16\u003c/span>\n                    \u003c/div>\n                \u003c/div>\n\n                \u003cbutton type=\"button\" id=\"submitBtn\" onclick=\"submitForm()\"\n                    class=\"w-full md:w-auto px-8 py-4 bg-yellow-400 hover:bg-yellow-300 text-blue-900 font-extrabold text-lg rounded-lg shadow-lg transform hover:-translate-y-1 transition-all flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-wait\">\n                    📤 送出評分\n                \u003c/button>\n            \u003c/div>\n        \u003c/form>\n\n        \u003c!-- 我的評分紀錄（驗證後才顯示） -->\n        \u003csection id=\"myRatingsSection\" class=\"hidden mt-8 bg-white rounded-2xl shadow-xl p-6 md:p-8\">\n            \u003ch2 class=\"font-extrabold text-2xl text-blue-900 border-l-4 border-blue-500 pl-3 mb-1\">📝 我的評分紀錄\u003c/h2>\n            \u003cp class=\"text-sm text-gray-500 mb-4 pl-4\">只有你看得到。可以修改或撤回，原始紀錄都會保留在老師的試算表中。\u003c/p>\n            \u003cdiv id=\"myRatings\">\u003c/div>\n        \u003c/section>\n\n        \u003c!-- 即時評分看板（匿名） -->\n        \u003csection class=\"mt-8 bg-white rounded-2xl shadow-xl p-6 md:p-8\">\n            \u003cdiv class=\"flex flex-wrap items-end justify-between gap-3 mb-5\">\n                \u003cdiv>\n                    \u003ch2 class=\"font-extrabold text-2xl text-blue-900 border-l-4 border-blue-500 pl-3\">📊 即時評分看板\u003c/h2>\n                    \u003cp class=\"text-sm text-gray-500 mt-1 pl-4\">所有評分者皆以隨機代碼顯示，不呈現座號與姓名。\u003c/p>\n                \u003c/div>\n                \u003cdiv class=\"flex items-center gap-3 text-sm\">\n                    \u003cspan id=\"boardSummary\" class=\"text-gray-600 font-medium\">\u003c/span>\n                    \u003cspan class=\"text-gray-400\">更新於 \u003cspan id=\"lastUpdated\">—\u003c/span>\u003c/span>\n                    \u003cbutton type=\"button\" onclick=\"refreshLive(true)\" class=\"px-3 py-1.5 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold rounded-lg transition-colors\">🔄 重新整理\u003c/button>\n                \u003c/div>\n            \u003c/div>\n            \u003cdiv id=\"groupStats\" class=\"grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3\">\n                \u003cdiv class=\"col-span-full flex items-center justify-center gap-3 py-10 text-gray-500\">\u003cdiv class=\"spinner\">\u003c/div>載入中…\u003c/div>\n            \u003c/div>\n            \u003ch3 class=\"font-bold text-lg text-blue-900 mt-8 mb-2\">🕒 最新動態\u003c/h3>\n            \u003cul id=\"recentFeed\" class=\"text-sm\">\u003c/ul>\n        \u003c/section>\n    \u003c/div>\n\n    \u003c!-- 身份驗證彈窗 -->\n    \u003cdiv id=\"identityModal\" class=\"fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 px-4\">\n        \u003cdiv class=\"bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 text-center\">\n            \u003cdiv class=\"w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl\">🔐\u003c/div>\n            \u003ch3 class=\"text-2xl font-bold text-gray-800 mb-2\">身份驗證\u003c/h3>\n            \u003cp class=\"text-gray-600 mb-4\">座號 \u003cspan id=\"idSeatLabel\" class=\"font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded\">\u003c/span>，請輸入你的\u003cbr>四個數字身份碼\u003c/p>\n            \u003cinput id=\"idCode\" type=\"password\" inputmode=\"numeric\" maxlength=\"4\" autocomplete=\"off\" placeholder=\"••••\"\n                class=\"w-full text-center text-3xl tracking-[0.6em] font-extrabold px-4 py-3 rounded-lg border-2 border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent\">\n            \u003cp id=\"idError\" class=\"text-red-600 text-sm font-bold min-h-[1.25rem] mt-2\">\u003c/p>\n            \u003cdiv class=\"grid grid-cols-2 gap-3 mt-4\">\n                \u003cbutton type=\"button\" onclick=\"cancelIdentity()\" class=\"py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-lg transition-colors\">取消\u003c/button>\n                \u003cbutton type=\"button\" id=\"idConfirmBtn\" onclick=\"confirmIdentity()\" class=\"py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-colors shadow-md disabled:opacity-60\">確認\u003c/button>\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 確認彈窗（重複評分／撤回） -->\n    \u003cdiv id=\"confirmModal\" class=\"fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-[60] px-4\">\n        \u003cdiv class=\"bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 text-center\">\n            \u003cdiv class=\"w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl\">⚠️\u003c/div>\n            \u003ch3 id=\"confirmTitle\" class=\"text-2xl font-bold text-gray-800 mb-2\">\u003c/h3>\n            \u003cp id=\"confirmMessage\" class=\"text-gray-800 font-bold mb-3\">\u003c/p>\n            \u003cp id=\"confirmDetail\" class=\"text-sm text-gray-600 bg-gray-50 rounded-lg p-3 mb-6 whitespace-pre-line\">\u003c/p>\n            \u003cdiv class=\"grid grid-cols-2 gap-3\">\n                \u003cbutton type=\"button\" onclick=\"closeConfirm(false)\" class=\"py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-lg transition-colors\">取消\u003c/button>\n                \u003cbutton type=\"button\" id=\"confirmOkBtn\" onclick=\"closeConfirm(true)\" class=\"py-3 text-white font-bold rounded-lg transition-colors shadow-md\">確定\u003c/button>\n            \u003c/div>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 送出成功彈窗 -->\n    \u003cdiv id=\"uploadModal\" class=\"fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 px-4\">\n        \u003cdiv class=\"bg-white rounded-2xl shadow-2xl max-w-lg w-full p-8 text-center transform scale-100 transition-transform\">\n            \u003cdiv class=\"w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4\">\n                \u003csvg class=\"w-8 h-8 text-green-500\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"3\" d=\"M5 13l4 4L19 7\">\u003c/path>\u003c/svg>\n            \u003c/div>\n            \u003ch3 id=\"successTitle\" class=\"text-2xl font-bold text-gray-800 mb-2\">評分已成功送出！\u003c/h3>\n            \u003cp class=\"text-gray-600 mb-4\" id=\"successDetail\">\u003c/p>\n            \u003cdiv class=\"bg-yellow-50 border border-yellow-200 rounded-xl p-5 mb-6\">\n                \u003cp class=\"text-yellow-800 font-extrabold\" id=\"successNote\">\u003c/p>\n                \u003cp class=\"text-sm text-gray-600 mt-1\">可以繼續選擇下一個組別評分。\u003c/p>\n            \u003c/div>\n            \u003cbutton type=\"button\" onclick=\"closeModal()\" class=\"block w-full py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-lg transition-colors\">關閉視窗\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 錯誤提示彈窗 -->\n    \u003cdiv id=\"errorModal\" class=\"fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-[70] px-4\">\n        \u003cdiv class=\"bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 text-center transform scale-100 transition-transform\">\n            \u003cdiv class=\"w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4\">\n                \u003csvg class=\"w-8 h-8 text-red-500\" fill=\"none\" stroke=\"currentColor\" viewBox=\"0 0 24 24\">\u003cpath stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"3\" d=\"M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z\">\u003c/path>\u003c/svg>\n            \u003c/div>\n            \u003ch3 id=\"errorTitle\" class=\"text-2xl font-bold text-gray-800 mb-2\">資料不完整\u003c/h3>\n            \u003cp id=\"errorMessage\" class=\"text-gray-600 mb-6 whitespace-pre-line\">\u003c/p>\n            \u003cbutton type=\"button\" onclick=\"closeErrorModal()\" class=\"block w-full py-3 bg-red-500 hover:bg-red-600 text-white font-bold rounded-lg transition-colors shadow-md\">我知道了\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 處理中遮罩 -->\n    \u003cdiv id=\"loadingOverlay\" class=\"fixed inset-0 bg-white/60 hidden flex flex-col items-center justify-center z-[80] gap-3\">\n        \u003cdiv class=\"spinner\">\u003c/div>\n        \u003cp id=\"loadingText\" class=\"font-bold text-blue-900\">處理中…\u003c/p>\n    \u003c/div>\n\n    \u003c!-- 小提示 -->\n    \u003cdiv id=\"toast\" class=\"fixed bottom-6 left-1/2 -translate-x-1/2 z-[90] hidden bg-gray-900 text-white text-sm font-bold px-5 py-3 rounded-full shadow-lg\">\u003c/div>\n\n    \u003cscript>\n        /* =========================================================\n         *  基本設定\n         * ========================================================= */\n        const GROUP_NAMES = ['第一組', '第二組', '第三組', '第四組', '第五組', '第六組', '第七組'];\n        const CRITERIA_SHORT = ['半徑與開口', '圓心與針尖', '握持與順暢', '要素標示'];\n        const MAX_TOTAL = 16;\n\n        // 評量規準資料庫：國小三年級數學「圓規畫圓」表現任務\n        const criteria = [\n            {\n                id: 'c1',\n                name: '一、半徑測量與開口固定',\n                levels: [\n                    { score: 4, title: '優秀', desc: ['針尖對齊直尺 0 刻度。', '筆尖精準張開至指定長度（\u003cspan class=\"highlight-green\">誤差 0 cm\u003c/span>）。', '作圖全程\u003cspan class=\"highlight-green\">開口長度完全無改變\u003c/span>。'] },\n                    { score: 3, title: '良好', desc: ['針尖對齊直尺 0 刻度。', '筆尖張開至指定長度（\u003cspan class=\"highlight-green\">誤差 0.1 cm 內\u003c/span>）。', '作圖過程中開口長度保持穩定。'] },\n                    { score: 2, title: '基礎', desc: ['針尖對齊直尺\u003cspan class=\"highlight-orange\">非 0 刻度\u003c/span>（如刻度 1）。', '開口長度\u003cspan class=\"highlight-orange\">誤差達 0.2~0.5 cm\u003c/span>。', '作圖時開口微幅鬆開改變。'] },\n                    { score: 1, title: '待加強', desc: ['\u003cspan class=\"highlight-red\">未對齊直尺測量\u003c/span>（隨意拉開圓規）。', '開口長度\u003cspan class=\"highlight-red\">誤差大於 0.5 cm\u003c/span>。', '作圖時開口嚴重鬆脫滑移。'] }\n                ]\n            },\n            {\n                id: 'c2',\n                name: '二、圓心定位與針尖固定',\n                levels: [\n                    { score: 4, title: '優秀', desc: ['作圖前先在紙上點出圓心並標記。', '針尖壓住圓心且\u003cspan class=\"highlight-green\">未刺破紙張\u003c/span>。', '畫圓全程\u003cspan class=\"highlight-green\">針尖零位移\u003c/span>。'] },\n                    { score: 3, title: '良好', desc: ['作圖前先在紙上點出圓心並標記。', '針尖壓住圓心。', '畫圓過程中針尖\u003cspan class=\"highlight-orange\">微幅搖晃但未離位\u003c/span>。'] },\n                    { score: 2, title: '基礎', desc: ['作圖前\u003cspan class=\"highlight-orange\">未預先標記圓心\u003c/span>（直接刺入）。', '針尖穿透刺破紙張。', '畫圓時針尖偏移 1~2 次導致圓心不固定。'] },\n                    { score: 1, title: '待加強', desc: ['\u003cspan class=\"highlight-red\">未標記圓心\u003c/span>。', '畫圓時針尖\u003cspan class=\"highlight-red\">持續滑動無法固定\u003c/span>，出現多個刺孔。'] }\n                ]\n            },\n            {\n                id: 'c3',\n                name: '三、圓規握持與作圖順暢度',\n                levels: [\n                    { score: 4, title: '優秀', desc: ['單手僅握持圓規頂端轉軸。', '順暢旋轉\u003cspan class=\"highlight-green\">一次劃出 360 度平滑線條\u003c/span>。', '線條\u003cspan class=\"highlight-green\">首尾精準相接且粗細均勻\u003c/span>。'] },\n                    { score: 3, title: '良好', desc: ['單手握持圓規頂端轉軸。', '旋轉過程\u003cspan class=\"highlight-orange\">停頓 1~2 次\u003c/span>。', '能首尾相接形成封閉圓。'] },\n                    { score: 2, title: '基礎', desc: ['\u003cspan class=\"highlight-orange\">握持圓規兩腳\u003c/span>（非頂端轉軸）。', '重複來回塗畫線條。', '線條出現重疊粗糙，或首尾缺口 &gt; 0.2 cm。'] },\n                    { score: 1, title: '待加強', desc: ['\u003cspan class=\"highlight-red\">雙手拉扯圓規兩腳\u003c/span>作圖。', '畫出線條斷斷續續。', '\u003cspan class=\"highlight-red\">無法形成封閉圓形\u003c/span>。'] }\n                ]\n            },\n            {\n                id: 'c4',\n                name: '四、幾何要素標示與概念連結',\n                levels: [\n                    { score: 4, title: '優秀', desc: ['正確用直尺畫出並標示出圓心、半徑、圓周。', '於半徑旁註明正確公分數。', '能標記並說明\u003cspan class=\"highlight-green\">直徑長度為半徑的 2 倍\u003c/span>。'] },\n                    { score: 3, title: '良好', desc: ['正確用直尺畫出並標示出圓心、半徑、圓周。', '於半徑旁註明正確公分數。', '\u003cspan class=\"highlight-orange\">未延伸說明直徑關係\u003c/span>。'] },\n                    { score: 2, title: '基礎', desc: ['\u003cspan class=\"highlight-orange\">僅標示出圓心與圓周\u003c/span>。', '未用直尺繪製半徑或標示位置偏移。', '\u003cspan class=\"highlight-orange\">混淆半徑與直徑名稱\u003c/span>。'] },\n                    { score: 1, title: '待加強', desc: ['\u003cspan class=\"highlight-red\">無法正確標示\u003c/span>圓心、半徑或圓周等要素。', '幾何概念名稱與位置標示嚴重錯誤。'] }\n                ]\n            }\n        ];\n\n        /* =========================================================\n         *  後端連線：GAS 環境用 google.script.run；本地預覽用模擬資料\n         *  （解決非 GAS 環境 google is not defined 的問題）\n         * ========================================================= */\n        const IS_GAS = (typeof google !== 'undefined') && !!(google.script && google.script.run);\n\n        function callServer(fn, ...args) {\n            return new Promise((resolve, reject) => {\n                if (IS_GAS) {\n                    google.script.run\n                        .withSuccessHandler(resolve)\n                        .withFailureHandler(reject)[fn](...args);\n                } else {\n                    setTimeout(() => {\n                        try { resolve(JSON.parse(JSON.stringify(MockServer[fn](...args)))); }\n                        catch (e) { reject(e); }\n                    }, 350);\n                }\n            });\n        }\n\n        /* 本地預覽用的模擬後端（行為與 code.gs 相同，資料只存在此頁面） */\n        const MockServer = (() => {\n            const TYPE = { NEW: '原始評分', EDIT: '修改分數', DEL: '撤回評分' };\n            const NAMES = ['王小明', '李小華', '張家豪', '陳怡君', '林志明', '黃雅婷', '吳承翰', '劉欣怡', '蔡宗霖', '楊淑芬',\n                '許文傑', '鄭佳穎', '謝明哲', '郭雨涵', '洪子軒', '曾詩涵', '邱冠宇', '廖品妍', '賴俊宏', '周采潔',\n                '徐浩然', '蘇芷晴', '葉柏翰', '莊心妤', '呂宥廷', '江若彤', '何宇翔', '羅思妤', '高翊凱', '潘語彤'];\n            const CH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';\n            const used = new Set();\n            const rnd = n => Math.floor(Math.random() * n);\n            const newAnon = () => { let c; do { c = 'R-' + Array.from({ length: 4 }, () => CH[rnd(CH.length)]).join(''); } while (used.has(c)); used.add(c); return c; };\n            const p2 = n => String(n).padStart(2, '0');\n            const fmt = d => `${d.getFullYear()}/${p2(d.getMonth() + 1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;\n            const fmtShort = d => `${p2(d.getMonth() + 1)}/${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`;\n            const round1 = n => Math.round(n * 10) / 10;\n\n            const roster = NAMES.map((name, i) => ({ seat: i + 1, name, code: '1111', anon: newAnon() }));\n            const log = [];\n            const fails = {};\n\n            let t = Date.now() - 6 * 3600e3;\n            const add = (st, g, type, when) => {\n                if (!when) { t += (1 + rnd(4)) * 60e3; }\n                const scores = type === TYPE.DEL ? [] : [0, 0, 0, 0].map(() => [2, 3, 3, 4, 4, 4][rnd(6)]);\n                const e = { time: when || new Date(t), seat: st.seat, anon: st.anon, group: g, scores, total: scores.reduce((a, b) => a + b, 0), type };\n                log.push(e);\n                return e;\n            };\n            roster.slice(0, 10).forEach(st => [1, 2, 3, 4, 5, 6, 7].sort(() => Math.random() - 0.5).slice(0, 3 + rnd(3)).forEach(g => add(st, g, TYPE.NEW)));\n            add(roster[1], log.find(e => e.seat === 2).group, TYPE.EDIT);\n            add(roster[4], log.find(e => e.seat === 5).group, TYPE.DEL);\n\n            const latest = () => {\n                const m = {};\n                log.forEach(e => { const k = e.seat + '|' + e.group; if (e.type === TYPE.DEL) delete m[k]; else m[k] = e; });\n                return m;\n            };\n            const rated = seat => Object.values(latest()).filter(e => e.seat === seat).sort((a, b) => a.group - b.group).map(e => ({\n                group: e.group, groupName: GROUP_NAMES[e.group - 1], total: e.total, scores: e.scores, time: fmt(e.time), type: e.type,\n                edited: log.filter(x => x.seat === seat && x.group === e.group).length > 1\n            }));\n            const stats = () => {\n                const valid = Object.values(latest());\n                return {\n                    groups: GROUP_NAMES.map((name, i) => {\n                        const list = valid.filter(e => e.group === i + 1);\n                        return {\n                            group: i + 1, name, count: list.length,\n                            avg: list.length ? round1(list.reduce((s, e) => s + e.total, 0) / list.length) : null,\n                            criteria: [0, 1, 2, 3].map(c => list.length ? round1(list.reduce((s, e) => s + e.scores[c], 0) / list.length) : null)\n                        };\n                    }),\n                    recent: log.slice(-12).reverse().map(e => ({ anon: e.anon, groupName: GROUP_NAMES[e.group - 1], total: e.type === TYPE.DEL ? '' : e.total, type: e.type, time: fmtShort(e.time) })),\n                    raterCount: new Set(valid.map(e => e.seat)).size,\n                    ratingCount: valid.length,\n                    maxTotal: MAX_TOTAL,\n                    updatedAt: fmt(new Date()).slice(11)\n                };\n            };\n            const auth = (seat, code) => {\n                seat = Number(seat); code = String(code || '').trim();\n                if (!Number.isInteger(seat) || seat \u003c 1) return { ok: false, message: '座號格式不正確。' };\n                if (!/^\\d{4}$/.test(code)) return { ok: false, message: '身份碼必須是四個數字。' };\n                if ((fails[seat] || 0) >= 5) return { ok: false, locked: true, message: '錯誤次數過多，請 5 分鐘後再試，或請老師協助。' };\n                const st = roster.find(s => s.seat === seat);\n                if (!st) return { ok: false, message: '名單中查無此座號，請確認座號或洽詢老師。' };\n                if (st.code !== code) {\n                    fails[seat] = (fails[seat] || 0) + 1;\n                    const left = 5 - fails[seat];\n                    return { ok: false, locked: left \u003c= 0, message: left > 0 ? `身份碼錯誤，還有 ${left} 次機會。` : '錯誤次數過多，請 5 分鐘後再試，或請老師協助。' };\n                }\n                fails[seat] = 0;\n                return { ok: true, student: st };\n            };\n\n            return {\n                getInitialData() { return { ok: true, created: [], groups: GROUP_NAMES, stats: stats() }; },\n                getLiveStats() { return stats(); },\n                verifyIdentity(seat, code) {\n                    const a = auth(seat, code); if (!a.ok) return a;\n                    return { ok: true, seat: a.student.seat, name: a.student.name, anon: a.student.anon, rated: rated(a.student.seat) };\n                },\n                getMyRatings(seat, code) { const a = auth(seat, code); if (!a.ok) return a; return { ok: true, rated: rated(a.student.seat) }; },\n                submitRating(p) {\n                    const a = auth(p.seat, p.code); if (!a.ok) return a;\n                    const st = a.student, g = Number(p.group);\n                    if (!(g >= 1 && g \u003c= 7)) return { ok: false, message: '請選擇評核組別！' };\n                    const scores = (p.scores || []).map(Number);\n                    if (scores.length !== 4 || scores.some(s => !(s >= 1 && s \u003c= 4))) return { ok: false, message: '還有尚未評分的面向，請確認四個面向都已點選！' };\n                    const prev = latest()[st.seat + '|' + g];\n                    if (prev && !p.confirmRevision) return { ok: false, needConfirm: true, message: '您已經評過分數，請確認是否修改您的評分', previous: { groupName: GROUP_NAMES[g - 1], total: prev.total, time: fmt(prev.time) } };\n                    const hasHistory = log.some(e => e.seat === st.seat && e.group === g);\n                    const e = { time: new Date(), seat: st.seat, anon: st.anon, group: g, scores, total: scores.reduce((x, y) => x + y, 0), type: hasHistory ? TYPE.EDIT : TYPE.NEW };\n                    log.push(e);\n                    return { ok: true, isRevision: hasHistory, groupName: GROUP_NAMES[g - 1], total: e.total, time: fmt(e.time), rated: rated(st.seat), stats: stats() };\n                },\n                deleteRating(seat, code, group) {\n                    const a = auth(seat, code); if (!a.ok) return a;\n                    const st = a.student, g = Number(group);\n                    if (!latest()[st.seat + '|' + g]) return { ok: false, message: '找不到這一組的有效評分，可能已經撤回了。' };\n                    add(st, g, TYPE.DEL, new Date());\n                    return { ok: true, groupName: GROUP_NAMES[g - 1], rated: rated(st.seat), stats: stats() };\n                }\n            };\n        })();\n\n        /* =========================================================\n         *  狀態與 DOM\n         * ========================================================= */\n        const state = { user: null, rated: {}, confirmedGroup: null, busy: false, pendingSeat: null, confirmCb: null };\n\n        const $ = id => document.getElementById(id);\n        const container = $('criteriaContainer');\n        const totalDisplay = $('totalScore');\n        const seatInput = $('raterSeat');\n        const nameInput = $('raterName');\n        const groupSelect = $('targetGroup');\n        const pad2 = n => String(n).padStart(2, '0');\n        const esc = s => String(s == null ? '' : s).replace(/[&\u003c>\"']/g, c => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n\n        /* =========================================================\n         *  渲染評分卡片\n         * ========================================================= */\n        criteria.forEach(item => {\n            const div = document.createElement('div');\n            div.className = 'border-t-2 border-blue-100 pt-6 mt-2 first:mt-0 first:border-0 first:pt-0';\n            const cardsHtml = item.levels.map(level => `\n                \u003cdiv onclick=\"selectScore('${item.id}', ${level.score}, this)\"\n                     class=\"radio-card p-5 border-2 border-gray-200 rounded-xl cursor-pointer hover:border-blue-300 bg-gray-50 flex flex-col h-full group\">\n                    \u003cdiv class=\"flex justify-between items-center mb-3\">\n                        \u003cspan class=\"text-xl font-bold text-gray-800 group-hover:text-blue-700\">${level.title}\u003c/span>\n                        \u003cspan class=\"score-badge bg-gray-200 text-gray-700 group-hover:bg-blue-100 group-hover:text-blue-800 text-sm font-bold px-3 py-1 rounded-full transition-colors\">${level.score} 分\u003c/span>\n                    \u003c/div>\n                    \u003col class=\"text-gray-700 text-sm leading-relaxed list-decimal pl-5 space-y-1\">${level.desc.map(d => `\u003cli>${d}\u003c/li>`).join('')}\u003c/ol>\n                \u003c/div>\n            `).join('');\n            div.innerHTML = `\n                \u003ch3 class=\"font-extrabold text-2xl mb-4 text-blue-900 border-l-4 border-blue-500 pl-3\">${item.name}\u003c/h3>\n                \u003cdiv class=\"grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4\" id=\"${item.id}\" data-score=\"0\">\n                    ${cardsHtml}\n                \u003c/div>\n            `;\n            container.appendChild(div);\n        });\n\n        function resetCardStyle(card) {\n            card.classList.remove('border-blue-500', 'bg-blue-50', 'ring-2', 'ring-blue-400');\n            card.classList.add('border-gray-200', 'bg-gray-50');\n            const badge = card.querySelector('.score-badge');\n            badge.classList.remove('bg-blue-600', 'text-white');\n            badge.classList.add('bg-gray-200', 'text-gray-700', 'group-hover:bg-blue-100', 'group-hover:text-blue-800');\n        }\n\n        // 點選計分邏輯\n        function selectScore(groupId, score, element) {\n            if (!state.user) return;\n            const group = $(groupId);\n            group.querySelectorAll('.radio-card').forEach(resetCardStyle);\n            element.classList.remove('border-gray-200', 'bg-gray-50');\n            element.classList.add('border-blue-500', 'bg-blue-50', 'ring-2', 'ring-blue-400');\n            const activeBadge = element.querySelector('.score-badge');\n            activeBadge.classList.remove('bg-gray-200', 'text-gray-700', 'group-hover:bg-blue-100', 'group-hover:text-blue-800');\n            activeBadge.classList.add('bg-blue-600', 'text-white');\n            group.dataset.score = score;\n            calculateTotal();\n        }\n\n        // 計算總分\n        function calculateTotal() {\n            let total = 0;\n            container.querySelectorAll('[data-score]').forEach(el => { total += parseInt(el.dataset.score, 10); });\n            totalDisplay.style.transition = 'transform 0.1s';\n            totalDisplay.style.transform = 'scale(1.2)';\n            totalDisplay.innerText = total;\n            setTimeout(() => { totalDisplay.style.transform = 'scale(1)'; }, 100);\n        }\n\n        /* =========================================================\n         *  身份驗證\n         * ========================================================= */\n        seatInput.addEventListener('change', onSeatEntered);\n        seatInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); seatInput.blur(); } });\n\n        function onSeatEntered() {\n            const seat = parseInt(seatInput.value, 10);\n            if (!seat || seat \u003c 1) { if (state.user) logout(false); return; }\n            if (state.user && state.user.seat === seat) return;\n            if (state.user) logout(false);\n            seatInput.value = seat;\n            openIdentityModal(seat);\n        }\n\n        function openIdentityModal(seat) {\n            state.pendingSeat = seat;\n            $('idSeatLabel').innerText = pad2(seat);\n            $('idCode').value = '';\n            $('idCode').disabled = false;\n            $('idError').innerText = '';\n            $('identityModal').classList.remove('hidden');\n            setTimeout(() => $('idCode').focus(), 50);\n        }\n\n        $('idCode').addEventListener('input', e => {\n            e.target.value = e.target.value.replace(/\\D/g, '').slice(0, 4);\n            $('idError').innerText = '';\n            if (e.target.value.length === 4) confirmIdentity();\n        });\n        $('idCode').addEventListener('keydown', e => { if (e.key === 'Enter') confirmIdentity(); });\n\n        function confirmIdentity() {\n            const code = $('idCode').value;\n            if (!/^\\d{4}$/.test(code)) { $('idError').innerText = '請輸入四個數字。'; return; }\n            const btn = $('idConfirmBtn');\n            if (btn.disabled) return;\n            btn.disabled = true; btn.innerText = '驗證中…';\n            callServer('verifyIdentity', state.pendingSeat, code)\n                .then(res => {\n                    if (!res.ok) {\n                        $('idError').innerText = res.message;\n                        $('idCode').value = '';\n                        if (res.locked) $('idCode').disabled = true; else $('idCode').focus();\n                        return;\n                    }\n                    $('identityModal').classList.add('hidden');\n                    applyUser(res, code);\n                    showToast(`✅ 驗證成功，歡迎 ${res.name}！`);\n                })\n                .catch(handleServerError)\n                .finally(() => { btn.disabled = false; btn.innerText = '確認'; });\n        }\n\n        function cancelIdentity() {\n            $('identityModal').classList.add('hidden');\n            seatInput.value = '';\n            state.pendingSeat = null;\n        }\n\n        function applyUser(res, code) {\n            state.user = { seat: res.seat, code, name: res.name, anon: res.anon };\n            nameInput.value = res.name;\n            groupSelect.disabled = false;\n            setLocked(false);\n            $('verifiedLabel').innerText = `${pad2(res.seat)} 號 ${res.name}`;\n            $('anonLabel').innerText = res.anon;\n            $('verifyBar').classList.remove('hidden');\n            setRated(res.rated);\n        }\n\n        function logout(clearSeat = true) {\n            state.user = null;\n            state.rated = {};\n            nameInput.value = '';\n            groupSelect.disabled = true;\n            $('verifyBar').classList.add('hidden');\n            $('myRatingsSection').classList.add('hidden');\n            setLocked(true);\n            resetFormAfterSubmit();\n            if (clearSeat) { seatInput.value = ''; seatInput.focus(); }\n        }\n\n        function setLocked(locked) {\n            $('lockOverlay').classList.toggle('hidden', !locked);\n        }\n\n        /* =========================================================\n         *  組別選擇與重複評分提醒\n         * ========================================================= */\n        function renderGroupOptions() {\n            const current = groupSelect.value;\n            groupSelect.innerHTML = '\u003coption value=\"\" disabled>請選擇你要評分的組別 ▼\u003c/option>' +\n                GROUP_NAMES.map((n, i) => {\n                    const r = state.rated[i + 1];\n                    return `\u003coption value=\"${i + 1}\">${n}${r ? `（✔ 已評 ${r.total} 分）` : ''}\u003c/option>`;\n                }).join('');\n            groupSelect.value = current;\n            if (!groupSelect.value) groupSelect.selectedIndex = 0;\n        }\n\n        groupSelect.addEventListener('change', onGroupChange);\n\n        function onGroupChange() {\n            const g = groupSelect.value;\n            state.confirmedGroup = null;\n            const r = state.rated[g];\n            if (g && r) {\n                showConfirm({\n                    title: '重複評分提醒',\n                    message: '您已經評過分數，請確認是否修改您的評分',\n                    detail: `${r.groupName} 目前總分：${r.total} 分（${r.time}）\\n按「確定」後重新評分，原紀錄會保留，並在總表標示「⚠️修改分數」。`,\n                    okText: '確定',\n                    onOk: () => { state.confirmedGroup = g; },\n                    onCancel: () => { groupSelect.selectedIndex = 0; }\n                });\n            }\n        }\n\n        /* =========================================================\n         *  Create / Update：送出評分\n         * ========================================================= */\n        function submitForm() {\n            if (state.busy) return;\n            if (!state.user) { showError('請先輸入座號並完成身份驗證！'); return; }\n            const group = groupSelect.value;\n            if (!seatInput.value.trim() || !nameInput.value.trim() || !group) {\n                showError('請填寫完整的「座號」、「姓名」與「評核組別」！');\n                return;\n            }\n            const scores = criteria.map(c => parseInt($(c.id).dataset.score, 10));\n            if (scores.some(s => !s)) {\n                showError('還有尚未評分的面向，請確認四個面向都已點選！');\n                return;\n            }\n            sendRating(group, scores, state.confirmedGroup === group);\n        }\n\n        function sendRating(group, scores, confirmRevision) {\n            setBusy(true, '正在送出評分…');\n            callServer('submitRating', { seat: state.user.seat, code: state.user.code, group: Number(group), scores, confirmRevision })\n                .then(res => {\n                    if (res.needConfirm) {\n                        showConfirm({\n                            title: '重複評分提醒',\n                            message: res.message,\n                            detail: `${res.previous.groupName} 目前總分：${res.previous.total} 分（${res.previous.time}）\\n按「確定」送出修改，原紀錄會保留。`,\n                            okText: '確定',\n                            onOk: () => sendRating(group, scores, true)\n                        });\n                        return;\n                    }\n                    if (!res.ok) { showError(res.message, '送出失敗'); return; }\n                    setRated(res.rated);\n                    renderLive(res.stats);\n                    showSuccess(res);\n                    resetFormAfterSubmit();\n                })\n                .catch(handleServerError)\n                .finally(() => setBusy(false));\n        }\n\n        // 送出後重置表單（保留已驗證的身份，方便繼續評下一組）\n        function resetFormAfterSubmit() {\n            state.confirmedGroup = null;\n            criteria.forEach(c => {\n                const g = $(c.id);\n                g.dataset.score = '0';\n                g.querySelectorAll('.radio-card').forEach(resetCardStyle);\n            });\n            renderGroupOptions();\n            groupSelect.selectedIndex = 0;\n            calculateTotal();\n        }\n\n        function showSuccess(res) {\n            $('successTitle').innerText = res.isRevision ? '修改後的評分已送出！' : '評分已成功送出！';\n            $('successDetail').innerHTML = `評核組別：\u003cspan class=\"font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded\">${esc(res.groupName)}\u003c/span>　總分：\u003cspan class=\"font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded\">${res.total} / ${MAX_TOTAL}\u003c/span>\u003cbr>\u003cspan class=\"text-sm text-gray-500\">繳交時間：${esc(res.time)}\u003c/span>`;\n            $('successNote').innerText = IS_GAS\n                ? (res.isRevision ? '📢 已記錄到老師的試算表，並標示「⚠️修改分數」。' : '📢 已記錄到老師的試算表。')\n                : '🧪 本地預覽模式：資料只存在這個頁面，重新整理就會消失。';\n            $('uploadModal').classList.remove('hidden');\n        }\n\n        function closeModal() { $('uploadModal').classList.add('hidden'); }\n\n        /* =========================================================\n         *  Read / Update / Delete：我的評分紀錄\n         * ========================================================= */\n        function setRated(list) {\n            state.rated = {};\n            (list || []).forEach(r => { state.rated[r.group] = r; });\n            renderGroupOptions();\n            renderMyRatings();\n        }\n\n        function renderMyRatings() {\n            const sec = $('myRatingsSection');\n            if (!state.user) { sec.classList.add('hidden'); return; }\n            sec.classList.remove('hidden');\n            const list = Object.values(state.rated).sort((a, b) => a.group - b.group);\n            if (!list.length) {\n                $('myRatings').innerHTML = '\u003cp class=\"text-gray-500 bg-gray-50 rounded-lg p-4 text-center\">你還沒有評任何組別，從上方選擇組別開始吧！\u003c/p>';\n                return;\n            }\n            $('myRatings').innerHTML = `\n                \u003cdiv class=\"overflow-x-auto\">\n                \u003ctable class=\"w-full text-sm\">\n                    \u003cthead>\u003ctr class=\"text-left text-blue-900 border-b-2 border-blue-100\">\n                        \u003cth class=\"py-2 pr-3\">組別\u003c/th>\u003cth class=\"py-2 pr-3\">總分\u003c/th>\u003cth class=\"py-2 pr-3 hidden md:table-cell\">分項（${CRITERIA_SHORT.join('／')}）\u003c/th>\n                        \u003cth class=\"py-2 pr-3\">最後繳交時間\u003c/th>\u003cth class=\"py-2 pr-3\">狀態\u003c/th>\u003cth class=\"py-2 text-right\">操作\u003c/th>\n                    \u003c/tr>\u003c/thead>\n                    \u003ctbody>${list.map(r => `\n                        \u003ctr class=\"border-b border-gray-100\">\n                            \u003ctd class=\"py-3 pr-3 font-bold text-gray-800\">${esc(r.groupName)}\u003c/td>\n                            \u003ctd class=\"py-3 pr-3\">\u003cspan class=\"font-extrabold text-blue-700\">${r.total}\u003c/span>\u003cspan class=\"text-gray-400\"> / ${MAX_TOTAL}\u003c/span>\u003c/td>\n                            \u003ctd class=\"py-3 pr-3 text-gray-600 hidden md:table-cell\">${r.scores.join('／')}\u003c/td>\n                            \u003ctd class=\"py-3 pr-3 text-gray-500\">${esc(r.time)}\u003c/td>\n                            \u003ctd class=\"py-3 pr-3\">${r.edited ? '\u003cspan class=\"highlight-orange\">已修改\u003c/span>' : '\u003cspan class=\"highlight-green\">原始\u003c/span>'}\u003c/td>\n                            \u003ctd class=\"py-3 text-right whitespace-nowrap\">\n                                \u003cbutton type=\"button\" onclick=\"editRating(${r.group})\" class=\"px-3 py-1.5 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold rounded-lg\">修改\u003c/button>\n                                \u003cbutton type=\"button\" onclick=\"withdrawRating(${r.group})\" class=\"px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg ml-1\">撤回\u003c/button>\n                            \u003c/td>\n                        \u003c/tr>`).join('')}\n                    \u003c/tbody>\n                \u003c/table>\u003c/div>`;\n        }\n\n        function editRating(g) {\n            groupSelect.value = String(g);\n            onGroupChange();\n            $('criteriaContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });\n        }\n\n        function withdrawRating(g) {\n            const r = state.rated[g];\n            if (!r) return;\n            showConfirm({\n                title: '撤回評分',\n                message: `確定要撤回對「${r.groupName}」的評分嗎？`,\n                detail: '原紀錄會保留，總表會在下一列標示「🗑️撤回評分」。\\n撤回後可以重新評分。',\n                okText: '確定撤回',\n                danger: true,\n                onOk: () => {\n                    setBusy(true, '正在撤回…');\n                    callServer('deleteRating', state.user.seat, state.user.code, g)\n                        .then(res => {\n                            if (!res.ok) { showError(res.message, '撤回失敗'); return; }\n                            setRated(res.rated);\n                            renderLive(res.stats);\n                            if (groupSelect.value === String(g)) resetFormAfterSubmit();\n                            showToast(`🗑️ 已撤回 ${res.groupName} 的評分`);\n                        })\n                        .catch(handleServerError)\n                        .finally(() => setBusy(false));\n                }\n            });\n        }\n\n        /* =========================================================\n         *  Read：即時看板（只顯示匿名代碼）\n         * ========================================================= */\n        function renderLive(stats) {\n            if (!stats) return;\n            const max = stats.maxTotal || MAX_TOTAL;\n            $('groupStats').innerHTML = stats.groups.map(g => {\n                const pct = g.avg == null ? 0 : Math.round(g.avg / max * 100);\n                return `\n                \u003cdiv class=\"rounded-xl border-2 border-blue-100 bg-blue-50/50 p-4\">\n                    \u003cdiv class=\"flex justify-between items-center\">\n                        \u003cspan class=\"font-extrabold text-blue-900\">${esc(g.name)}\u003c/span>\n                        \u003cspan class=\"text-xs font-bold text-blue-700 bg-blue-100 rounded-full px-2 py-0.5\">${g.count} 人評分\u003c/span>\n                    \u003c/div>\n                    \u003cdiv class=\"mt-2 flex items-baseline gap-1\">\n                        \u003cspan class=\"text-3xl font-extrabold ${g.avg == null ? 'text-gray-300' : 'text-blue-700'}\">${g.avg == null ? '—' : g.avg}\u003c/span>\n                        \u003cspan class=\"text-sm text-gray-500 font-bold\">/ ${max}\u003c/span>\n                    \u003c/div>\n                    \u003cdiv class=\"h-2 bg-blue-100 rounded-full mt-2 overflow-hidden\">\n                        \u003cdiv class=\"h-full bg-gradient-to-r from-blue-600 to-blue-400 rounded-full transition-all duration-500\" style=\"width:${pct}%\">\u003c/div>\n                    \u003c/div>\n                    \u003cul class=\"mt-3 space-y-0.5 text-xs text-gray-600\">\n                        ${CRITERIA_SHORT.map((c, i) => `\u003cli class=\"flex justify-between\">\u003cspan>${c}\u003c/span>\u003cspan class=\"font-bold\">${g.criteria[i] == null ? '—' : g.criteria[i]}\u003c/span>\u003c/li>`).join('')}\n                    \u003c/ul>\n                \u003c/div>`;\n            }).join('');\n\n            const tag = type => type === '修改分數' ? '\u003cspan class=\"highlight-orange text-xs\">⚠️修改\u003c/span>'\n                : type === '撤回評分' ? '\u003cspan class=\"highlight-red text-xs\">🗑️撤回\u003c/span>' : '';\n            $('recentFeed').innerHTML = stats.recent.length ? stats.recent.map(r => `\n                \u003cli class=\"flex items-center justify-between gap-3 py-2 border-b border-gray-100\">\n                    \u003cdiv class=\"flex items-center gap-2 flex-wrap\">\n                        \u003cspan class=\"font-mono text-xs font-bold bg-gray-800 text-white rounded px-2 py-0.5\">${esc(r.anon)}\u003c/span>\n                        \u003cspan class=\"text-gray-700\">評了 \u003cb>${esc(r.groupName)}\u003c/b>\u003c/span>${tag(r.type)}\n                    \u003c/div>\n                    \u003cdiv class=\"text-right whitespace-nowrap\">\n                        \u003cspan class=\"font-extrabold text-blue-700\">${r.total === '' ? '' : r.total + ' 分'}\u003c/span>\n                        \u003cspan class=\"text-xs text-gray-400 ml-2\">${esc(r.time)}\u003c/span>\n                    \u003c/div>\n                \u003c/li>`).join('') : '\u003cli class=\"text-gray-400 py-4 text-center\">目前還沒有評分紀錄\u003c/li>';\n\n            $('boardSummary').innerText = `${stats.raterCount} 位同學・${stats.ratingCount} 筆有效評分`;\n            $('lastUpdated').innerText = stats.updatedAt;\n        }\n\n        function refreshLive(manual) {\n            if (!manual && document.hidden) return;\n            callServer('getLiveStats')\n                .then(renderLive)\n                .then(() => { if (manual) showToast('🔄 看板已更新'); })\n                .catch(err => { if (manual) handleServerError(err); });\n        }\n\n        /* =========================================================\n         *  彈窗與提示\n         * ========================================================= */\n        function showConfirm({ title, message, detail = '', okText = '確定', danger = false, onOk, onCancel }) {\n            $('confirmTitle').innerText = title;\n            $('confirmMessage').innerText = message;\n            $('confirmDetail').innerText = detail;\n            $('confirmDetail').classList.toggle('hidden', !detail);\n            const ok = $('confirmOkBtn');\n            ok.innerText = okText;\n            ok.className = 'py-3 text-white font-bold rounded-lg transition-colors shadow-md ' + (danger ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-600 hover:bg-blue-700');\n            state.confirmCb = { onOk, onCancel };\n            $('confirmModal').classList.remove('hidden');\n        }\n\n        function closeConfirm(ok) {\n            $('confirmModal').classList.add('hidden');\n            const cb = state.confirmCb || {};\n            state.confirmCb = null;\n            if (ok && cb.onOk) cb.onOk();\n            if (!ok && cb.onCancel) cb.onCancel();\n        }\n\n        function showError(message, title) {\n            $('errorTitle').innerText = title || '資料不完整';\n            $('errorMessage').innerText = message;\n            $('errorModal').classList.remove('hidden');\n        }\n\n        function closeErrorModal() { $('errorModal').classList.add('hidden'); }\n\n        // 後端錯誤處理：缺少指令碼屬性（SHEET_ID / FOLDER_ID）時顯示設定提示\n        function handleServerError(err) {\n            const msg = String((err && err.message) || err || '未知錯誤').replace(/^(Error|Exception):\\s*/, '');\n            const isConfig = /指令碼屬性|SHEET_ID|FOLDER_ID/.test(msg);\n            showError(isConfig ? msg : '與伺服器連線時發生問題：' + msg + '\\n請稍後再試，或通知老師。',\n                isConfig ? '⚙️ 系統設定未完成' : '系統錯誤');\n        }\n\n        function setBusy(busy, text) {\n            state.busy = busy;\n            $('submitBtn').disabled = busy;\n            $('loadingText').innerText = text || '處理中…';\n            $('loadingOverlay').classList.toggle('hidden', !busy);\n        }\n\n        let toastTimer = null;\n        function showToast(msg) {\n            const t = $('toast');\n            t.innerText = msg;\n            t.classList.remove('hidden');\n            clearTimeout(toastTimer);\n            toastTimer = setTimeout(() => t.classList.add('hidden'), 2600);\n        }\n\n        /* =========================================================\n         *  初始化\n         * ========================================================= */\n        (function init() {\n            const badge = $('modeBadge');\n            if (IS_GAS) {\n                badge.innerText = '🟢 已連線 Google 試算表';\n                badge.className += ' bg-green-100 text-green-800';\n            } else {\n                badge.innerText = '🧪 本地預覽（模擬資料，身份碼 1111）';\n                badge.className += ' bg-yellow-100 text-yellow-800';\n            }\n            renderGroupOptions();\n            setLocked(true);\n            calculateTotal();\n\n            callServer('getInitialData')\n                .then(res => {\n                    renderLive(res.stats);\n                    if (res.created && res.created.length) showToast('🛠️ 已自動建立分頁：' + res.created.join('、'));\n                })\n                .catch(err => {\n                    $('groupStats').innerHTML = '\u003cp class=\"col-span-full text-center text-red-600 font-bold py-10\">⚠️ 無法載入資料，請依提示框完成設定後重新整理網頁。\u003c/p>';\n                    handleServerError(err);\n                });\n\n            setInterval(() => refreshLive(false), 30000);\n        })();\n    \u003c/script>\n\u003c/body>\n\u003c/html>\n"}</script>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // === SVG 圖示元件 (取代 lucide-react 以確保單一檔案執行無誤) ===
        const IconTarget = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const IconBookOpen = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
        const IconBot = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>;
        const IconCpu = ({ className, size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>;

                            {/* Block 2: 開放式表現任務批改 */}
                            <div className={`prompt-block bg-white p-5 rounded-xl cursor-pointer ${activePromptAI === 'block-2' ? 'active' : ''}`} onClick={() => setActivePromptAI('block-2')}>
                            <div className="flex justify-between items-start mb-3">
                                <span className="px-2 py-1 bg-teal-100 text-teal-800 text-xs font-bold rounded">🔷 開放式表現任務批改</span>
                                <button onClick={(e) => handleCopy(e, 'text-block-2')} className={`flex items-center text-xs px-3 py-1.5 rounded-md border shadow-sm transition-colors ${copiedStates['text-block-2'] ? 'bg-green-50 text-green-600 border-green-200' : 'bg-gray-100 hover:bg-teal-50 text-gray-700 hover:text-teal-700 border-gray-200'}`}>
                                {copiedStates['text-block-2'] ? <IconCheckCircle2 className="w-4 h-4 mr-1" /> : <IconCopy className="w-4 h-4 mr-1" />}
                                <span>{copiedStates['text-block-2'] ? '已複製！' : '複製此段'}</span>
                                </button>
                            </div>
                            <div className="mb-3 flex justify-end">
                                <span className="text-xs font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-pink-500 to-purple-600 animate-pulse tracking-wide drop-shadow-sm">
                                ⚠️ 請尊重智慧財產，使用請引註，Prompt 模板來源：優履團隊
                                </span>
                            </div>
                            <div id="text-block-2" className="text-gray-800 leading-relaxed text-sm">
                                <p>你是一位公正且專業的評分專家，會根據以下評量規準評分，提供學生作品的不同面向成績，以及總成績，用表格呈現。</p>
                                <p className="mt-2 font-bold text-indigo-700">並且會在每個面向列出三點做得好的地方，以及三點可以更進一步優化的建議。</p>
                                <p className="mt-2 text-gray-500">評量規準如下：<br/>(請在此處貼上您在「人機共創評量規準」產出的評量規準表)</p>
                            </div>
                            </div>

                            {/* Block 3: 手寫題批改 */}

                            <div className="flex justify-between items-start mb-3">
                                <span className="px-2 py-1 bg-teal-100 text-teal-800 text-xs font-bold rounded">🔷 手寫題批改</span>
                                <button onClick={(e) => handleCopy(e, 'text-block-3')} className={`flex items-center text-xs px-3 py-1.5 rounded-md border shadow-sm transition-colors ${copiedStates['text-block-3'] ? 'bg-green-50 text-green-600 border-green-200' : 'bg-gray-100 hover:bg-teal-50 text-gray-700 hover:text-teal-700 border-gray-200'}`}>
                                {copiedStates['text-block-3'] ? <IconCheckCircle2 className="w-4 h-4 mr-1" /> : <IconCopy className="w-4 h-4 mr-1" />}
                                <span>{copiedStates['text-block-3'] ? '已複製！' : '複製此段'}</span>
                                </button>
                            </div>
                            <div className="mb-3 flex justify-end">
                                <span className="text-xs font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-pink-500 to-purple-600 animate-pulse tracking-wide drop-shadow-sm">
                                ⚠️ 請尊重智慧財產，使用請引註，Prompt 模板來源：優履團隊
                                </span>
                            </div>
                            <div id="text-block-3" className="text-gray-800 leading-relaxed text-sm">
                                <p>你是一位專業的學科手寫題批改與回饋專家，會根據以下評量規準給分，提供學生手寫題的不同面向成績，以及總成績，用表格呈現。</p>
                                <p className="mt-2">並且會在每個面向都舉出正確以及做得好的部分。</p>
                                <div className="mt-3 p-3 bg-red-50 border-l-4 border-red-400 rounded">
                                    <p className="font-bold text-red-800">需要訂正（有錯誤的地方務必標註 ❗️）</p>
                                </div>
                                <div className="mt-2 p-3 bg-green-50 border-l-4 border-green-400 rounded">
                                    <p className="font-bold text-green-800">並提供更進一步優化的建議 ✅，最後加上鼓勵的話。</p>
                                </div>
                                <p className="mt-3 text-gray-500">評量規準如下：<br/>(請在此處貼上您在「人機共創評量規準」產出的手寫題批改規準表)</p>

                            <p className="text-xs text-slate-500 mt-3">送出的分數會寫進示例試算表，可在下方「📊 後台示例」看到評分總表的變化。同一組再評一次，可以體驗「⚠️修改分數」的提醒；在「我的評分紀錄」也能修改或撤回。</p>

                                <span className="px-2 py-1 bg-purple-100 text-purple-800 text-xs font-bold rounded">🔷 部署至 Google Apps Script (GAS)</span>
                                <button onClick={(e) => handleCopy(e, 'text-block-5')} className={`flex items-center text-xs px-3 py-1.5 rounded-md border shadow-sm transition-colors ${copiedStates['text-block-5'] ? 'bg-green-50 text-green-600 border-green-200' : 'bg-gray-100 hover:bg-purple-50 text-gray-700 hover:text-purple-700 border-gray-200'}`}>

                                ⚠️ 請尊重智慧財產，使用請引註，Prompt 模板來源：優履團隊
                                </span>
                            </div>
                            <div id="text-block-5" className="text-gray-800 leading-relaxed text-sm">
                                <p>我要部署到 GAS，請讓所有人繳交的檔案整併在我的 Google Sheet，<span className="highlight-base hl-orange">【第一欄是評分者座號】</span>，還要有繳交的時間標註，<span className="highlight-base hl-orange">【橫軸是第一到第七組】</span>，每個儲存格都是評分同學給的分數。</p>
                                <p className="mt-3 font-bold">我的 Google Sheet ID 是：<br/><span className="highlight-base hl-blue">xxxxxxxxxxxxxx</span></p>
                                <p className="mt-3">請直接將此 ID 寫入程式碼中，不要預留讓我修改的空間。在我的 Google Sheet 上先預先建立幾個模擬的分頁和內容。</p>
                                <p className="mt-2">系統要能「完全自動」建立範本與模擬資料，而不需要手動進去編輯器按「執行」code.gs 裡的程式碼。在網頁載入讀取資料時（getInitialData 函數）加入一個自動偵測機制。只要系統發現 Google Sheet 裡沒有相對應的分頁，請自動觸發建立並填入模擬資料。</p>
                                <p className="mt-3 p-3 bg-red-50 border-l-4 border-red-400 rounded">當使用者填入座號時，會立刻跳出需要他填入<span className="highlight-base hl-red">四個數字身份碼</span>，只有身份碼正確，才讓使用者可以評分。四個數字身份碼請連動 Google Sheet 中的「四個數字身份碼」欄位，模擬資料預設皆為 1111。</p>
                                <p className="mt-3">同一個座號填寫者重複選了同一個組別的評分時，請跳出提醒視窗，『您已經評過分數，請確認是否修改您的評分』。讓使用者按確定按鈕才可以讓他再次提交同一組的評分結果。但是請不要覆寫資料，直接在此座號的該評分組，下一列儲存格標示『⚠️修改分數』。</p>
                                <p className="mt-2 text-indigo-700 font-bold">前台呈現即時數據時，請不要出現任何可以辨別評分者的身份資訊。使用隨機代碼呈現。</p>
