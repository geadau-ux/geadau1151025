<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <title>UNI 教育新浪潮工作坊</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <style>
        :root { color-scheme: light; }
        body { background: #f8fafc; color: #1e293b; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* 貓咪動畫 */
        @keyframes catBlink {
            0%, 96%, 98%, 100% { transform: scaleY(1); }
            97%, 99% { transform: scaleY(0.1); }
        }
        .cat-eyes {
            animation: catBlink 4s infinite;
        }

        @keyframes tailWag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(8deg); }
        }
        .cat-tail {
            animation: tailWag 3s ease-in-out infinite;
        }

        /* 提示詞區塊樣式 */
        .prompt-block {
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
        }
        .prompt-block:hover {
            border-color: #cbd5e1;
            transform: translateX(4px);
        }
        .prompt-block.active {
            border-color: #6366f1;
            background-color: #f8fafc;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transform: translateX(8px);
        }
        .prompt-block::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 0;
            background-color: #6366f1;
            transition: height 0.2s;
            border-radius: 4px;
        }
        .prompt-block.active::before { height: 60%; }

        /* 螢光筆標註樣式 */
        .highlight-base {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            cursor: help;
            border-bottom-width: 2px;
            border-bottom-style: dashed;
            display: inline-block;
            margin: 2px 0;
            transition: background-color 0.2s;
        }
        .hl-yellow { background-color: #fef08a; color: #854d0e; border-bottom-color: #ca8a04; }
        .hl-yellow:hover { background-color: #fde047; }
        .hl-green { background-color: #bbf7d0; color: #166534; border-bottom-color: #16a34a; }
        .hl-green:hover { background-color: #86efac; }
        .hl-blue { background-color: #bfdbfe; color: #1e3a8a; border-bottom-color: #2563eb; }
        .hl-blue:hover { background-color: #93c5fd; }
        .hl-pink { background-color: #fbcfe8; color: #9d174d; border-bottom-color: #db2777; }
        .hl-pink:hover { background-color: #f9a8d4; }
        .hl-purple { background-color: #e9d5ff; color: #581c87; border-bottom-color: #9333ea; }
        .hl-purple:hover { background-color: #d8b4fe; }
        .hl-orange { background-color: #ffedd5; color: #9a3412; border-bottom-color: #ea580c; }
        .hl-orange:hover { background-color: #fed7aa; }
        .hl-teal { background-color: #ccfbf1; color: #0f766e; border-bottom-color: #0d9488; }
        .hl-teal:hover { background-color: #99f6e4; }
        .hl-indigo { background-color: #e0e7ff; color: #3730a3; border-bottom-color: #4f46e5; }
        .hl-indigo:hover { background-color: #c7d2fe; }
        .hl-red { background-color: #fecaca; color: #991b1b; border-bottom-color: #dc2626; }
        .hl-red:hover { background-color: #fca5a5; }

        /* 隱藏捲軸但可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

<script type="application/json" id="deploy-assets">{"codeGs": "/**\n * 📁 code.gs — AI專題報告 ‧ 同儕評分系統（後端）\n *\n * 資安原則：本檔案「不含」任何 Google Sheet ID 或 Drive Folder ID。\n * 兩個 ID 一律從 Script Properties 讀取，屬性名稱固定為：\n *   SHEET_ID   → 評分資料所在的 Google 試算表\n *   FOLDER_ID  → 每次繳交自動備份 CSV 的雲端硬碟資料夾\n * 設定位置：Apps Script 編輯器 → 左側齒輪「專案設定」→ 最下方「指令碼屬性」。\n */\n\n// ==================== 1. 常數設定 ====================\n\n/** Script Properties 名稱：程式中所有讀取／寫入屬性都只能引用這裡，避免名稱不一致。 */\nconst PROP_KEYS = Object.freeze({\n  SHEET_ID: 'SHEET_ID',\n  FOLDER_ID: 'FOLDER_ID'\n});\n\nconst SHEET_NAMES = Object.freeze({\n  SUMMARY: '評分總表',   // 第一欄座號、第二欄繳交時間、橫軸第一～第七組\n  DETAIL: '評分明細',    // 每一次繳交的原始紀錄（CRUD 的資料來源）\n  AUTH: '身份驗證'       // 座號、姓名、四位數字身份碼、匿名代碼\n});\n\nconst GROUP_LABELS = ['第一組', '第二組', '第三組', '第四組', '第五組', '第六組', '第七組'];\nconst GROUP_COUNT = GROUP_LABELS.length;\nconst CRITERIA = ['痛點分析與 AI 解方', '思辨與兩難分析', '視覺化概念整合', '簡報規範與呈現'];\nconst MIN_ITEM_SCORE = 1;\nconst MAX_ITEM_SCORE = 3;\nconst DEFAULT_ID_CODE = '1111';\nconst MOCK_SEAT_COUNT = 30;\nconst MOD_LABEL = '⚠️修改分數';\nconst ORIGINAL_LABEL = '原始';\nconst MAX_VERIFY_FAILS = 5;           // 連續驗證失敗上限\nconst VERIFY_LOCK_SECONDS = 600;      // 超過上限後鎖定 10 分鐘\n\nconst SUMMARY_HEADERS = ['評分者座號', '繳交時間'].concat(GROUP_LABELS);\nconst DETAIL_HEADERS = ['紀錄ID', '繳交時間', '評分者座號', '評分者姓名', '組別']\n  .concat(CRITERIA)\n  .concat(['總分', '狀態', '備份檔ID']);\nconst AUTH_HEADERS = ['座號', '姓名', '四位數字身份碼', '匿名代碼'];\n\n/** 評分明細欄位索引（從 0 開始） */\nconst D = Object.freeze({\n  ID: 0, TIME: 1, SEAT: 2, NAME: 3, GROUP: 4,\n  C_START: 5,\n  TOTAL: 5 + CRITERIA.length,\n  STATUS: 6 + CRITERIA.length,\n  FILE: 7 + CRITERIA.length\n});\n\n// ==================== 2. 網頁入口 ====================\n\nfunction doGet() {\n  return HtmlService.createHtmlOutputFromFile('Index')\n    .setTitle('AI專題報告同儕評分系統')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1.0');\n}\n\n// ==================== 3. 設定讀取（Script Properties） ====================\n\n/** 讀取 SHEET_ID 與 FOLDER_ID；缺少時丟出清楚的中文錯誤，前台會以提示框顯示。 */\nfunction getConfig_() {\n  const props = PropertiesService.getScriptProperties();\n  const sheetId = (props.getProperty(PROP_KEYS.SHEET_ID) || '').trim();\n  const folderId = (props.getProperty(PROP_KEYS.FOLDER_ID) || '').trim();\n\n  const missing = [];\n  if (!sheetId) missing.push(PROP_KEYS.SHEET_ID);\n  if (!folderId) missing.push(PROP_KEYS.FOLDER_ID);\n  if (missing.length) {\n    throw new Error('尚未設定指令碼屬性 ' + missing.join('、') +\n      '，請至 Apps Script「專案設定 → 指令碼屬性」新增（名稱需完全一致、大小寫相同）。');\n  }\n  return { sheetId: sheetId, folderId: folderId };\n}\n\nfunction getSpreadsheet_() {\n  const config = getConfig_();\n  try {\n    return SpreadsheetApp.openById(config.sheetId);\n  } catch (e) {\n    throw new Error('無法開啟 ' + PROP_KEYS.SHEET_ID + ' 指向的試算表，請確認 ID 正確且部署者有編輯權限。（' + e.message + '）');\n  }\n}\n\nfunction getFolder_() {\n  const config = getConfig_();\n  try {\n    return DriveApp.getFolderById(config.folderId);\n  } catch (e) {\n    throw new Error('無法開啟 ' + PROP_KEYS.FOLDER_ID + ' 指向的資料夾，請確認 ID 正確且部署者有編輯權限。（' + e.message + '）');\n  }\n}\n\n// ==================== 4. 前台呼叫的公開函式（CRUD） ====================\n\n/** 【Read】網頁載入時呼叫：檢查設定 → 自動偵測並建立缺少的分頁與模擬資料 → 回傳即時數據 */\nfunction getInitialData() {\n  const ss = getSpreadsheet_();\n  getFolder_(); // 提早檢查 FOLDER_ID 是否有效\n  ensureSheets_(ss);\n  return {\n    groups: GROUP_LABELS,\n    criteria: CRITERIA,\n    stats: buildLiveStats_(ss)\n  };\n}\n\n/** 【Read】前台定時刷新即時數據 */\nfunction getLiveStats() {\n  const ss = getSpreadsheet_();\n  ensureSheets_(ss);\n  return buildLiveStats_(ss);\n}\n\n/** 驗證座號與四位數字身份碼，成功時回傳本人姓名（只回給本人） */\nfunction verifyIdentity(seat, code) {\n  const ss = getSpreadsheet_();\n  ensureSheets_(ss);\n  const person = verifyIdentity_(ss, seat, code);\n  return { ok: true, seat: person.seat, name: person.name };\n}\n\n/**\n * 【Create / Update】送出評分。\n * - 同座號重複評同一組且尚未確認 → 回傳 DUPLICATE，由前台跳出確認視窗。\n * - 確認後不覆寫舊資料，新增一筆「⚠️修改分數」紀錄，並在總表該座號的下一列標示。\n */\nfunction submitScore(payload) {\n  payload = payload || {};\n  const ss = getSpreadsheet_();\n  ensureSheets_(ss);\n  const person = verifyIdentity_(ss, payload.seat, payload.code);\n\n  const group = Number(payload.group);\n  if (!Number.isInteger(group) || group < 1 || group > GROUP_COUNT) {\n    throw new Error('請選擇正確的評核組別。');\n  }\n  const scores = (payload.scores || []).map(Number);\n  if (scores.length !== CRITERIA.length ||\n      scores.some(function (s) { return !Number.isInteger(s) || s < MIN_ITEM_SCORE || s > MAX_ITEM_SCORE; })) {\n    throw new Error('請完成所有評分面向（每項 ' + MIN_ITEM_SCORE + '～' + MAX_ITEM_SCORE + ' 分）。');\n  }\n  const name = person.name || String(payload.name || '').trim().slice(0, 30);\n  if (!name) throw new Error('請輸入評分同學姓名。');\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    const detailSheet = ss.getSheetByName(SHEET_NAMES.DETAIL);\n    const existing = readDetails_(detailSheet).filter(function (r) {\n      return r.seat === person.seat && r.group === group;\n    });\n\n    if (existing.length && payload.confirmed !== true) {\n      return {\n        status: 'DUPLICATE',\n        group: group,\n        groupLabel: GROUP_LABELS[group - 1],\n        previousTotal: existing[existing.length - 1].total\n      };\n    }\n\n    const now = new Date();\n    const total = scores.reduce(function (a, b) { return a + b; }, 0);\n    const isModification = existing.length > 0;\n    const record = {\n      id: newRecordId_(),\n      time: now,\n      seat: person.seat,\n      name: name,\n      group: group,\n      scores: scores,\n      total: total,\n      status: isModification ? MOD_LABEL : ORIGINAL_LABEL\n    };\n\n    let warning = '';\n    let fileId = '';\n    try {\n      fileId = saveBackupCsv_(record);\n    } catch (e) {\n      warning = '評分已寫入試算表，但備份檔未能存入雲端資料夾：' + e.message;\n    }\n\n    detailSheet.appendRow([record.id, record.time, record.seat, record.name, record.group]\n      .concat(record.scores)\n      .concat([record.total, record.status, fileId]));\n    SpreadsheetApp.flush();\n    rebuildSummary_(ss);\n\n    return {\n      status: 'OK',\n      isModification: isModification,\n      groupLabel: GROUP_LABELS[group - 1],\n      total: total,\n      warning: warning,\n      stats: buildLiveStats_(ss)\n    };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/** 【Read】讀取本人的評分紀錄（需身份碼） */\nfunction getMyRecords(seat, code) {\n  const ss = getSpreadsheet_();\n  ensureSheets_(ss);\n  const person = verifyIdentity_(ss, seat, code);\n  return listRecordsOfSeat_(ss, person.seat);\n}\n\n/** 【Delete】刪除本人的一筆紀錄（需身份碼），並將雲端備份檔移到垃圾桶 */\nfunction deleteMyRecord(seat, code, recordId) {\n  const ss = getSpreadsheet_();\n  ensureSheets_(ss);\n  const person = verifyIdentity_(ss, seat, code);\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    const detailSheet = ss.getSheetByName(SHEET_NAMES.DETAIL);\n    const target = readDetails_(detailSheet).filter(function (r) { return r.id === String(recordId); })[0];\n    if (!target) throw new Error('找不到這筆紀錄，可能已被刪除。');\n    if (target.seat !== person.seat) throw new Error('只能刪除自己的評分紀錄。');\n\n    if (target.fileId) {\n      try { DriveApp.getFileById(target.fileId).setTrashed(true); } catch (e) { /* 備份檔不存在時略過 */ }\n    }\n    detailSheet.deleteRow(target.row);\n    SpreadsheetApp.flush();\n    rebuildSummary_(ss);\n\n    return { ok: true, records: listRecordsOfSeat_(ss, person.seat), stats: buildLiveStats_(ss) };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n// ==================== 5. 自動建立分頁與模擬資料 ====================\n\n/** 自動偵測：缺少任何分頁就建立並填入模擬資料（不需手動按「執行」） */\nfunction ensureSheets_(ss) {\n  const allExist = Object.keys(SHEET_NAMES).every(function (k) { return ss.getSheetByName(SHEET_NAMES[k]); });\n  if (allExist) return;\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    let created = false;\n    if (!ss.getSheetByName(SHEET_NAMES.AUTH)) { createAuthSheet_(ss); created = true; }\n    if (!ss.getSheetByName(SHEET_NAMES.DETAIL)) { createDetailSheet_(ss); created = true; }\n    if (!ss.getSheetByName(SHEET_NAMES.SUMMARY)) { createSummarySheet_(ss); created = true; }\n    if (created) {\n      SpreadsheetApp.flush();\n      rebuildSummary_(ss);\n    }\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction createAuthSheet_(ss) {\n  const sheet = ss.insertSheet(SHEET_NAMES.AUTH);\n  styleHeader_(sheet, AUTH_HEADERS);\n  sheet.getRange(2, 3, MOCK_SEAT_COUNT, 1).setNumberFormat('@'); // 身份碼以文字保存，避免開頭 0 消失\n\n  const used = {};\n  const rows = [];\n  for (let seat = 1; seat <= MOCK_SEAT_COUNT; seat++) {\n    rows.push([seat, '同學' + pad2_(seat), DEFAULT_ID_CODE, generateAnonCode_(used)]);\n  }\n  sheet.getRange(2, 1, rows.length, AUTH_HEADERS.length).setValues(rows);\n  sheet.setColumnWidth(3, 130);\n  return sheet;\n}\n\nfunction createDetailSheet_(ss) {\n  const sheet = ss.insertSheet(SHEET_NAMES.DETAIL);\n  styleHeader_(sheet, DETAIL_HEADERS);\n\n  const names = {};\n  const auth = getAuthData_(ss);\n  Object.keys(auth).forEach(function (s) { names[s] = auth[s].name; });\n\n  const now = Date.now();\n  const mock = [\n    // [座號, 組別, 四項分數, 幾分鐘前]\n    [1, 1, [3, 2, 3, 2], 50],\n    [1, 2, [2, 2, 2, 3], 45],\n    [2, 1, [3, 3, 2, 3], 40],\n    [3, 3, [2, 1, 2, 2], 30],\n    [4, 5, [3, 3, 3, 3], 20],\n    [1, 1, [3, 3, 3, 2], 10]   // 座號 1 修改第一組 → 示範「⚠️修改分數」\n  ];\n  const rows = mock.map(function (m, i) {\n    const total = m[2].reduce(function (a, b) { return a + b; }, 0);\n    return ['MOCK' + (i + 1), new Date(now - m[3] * 60000), m[0], names[m[0]] || ('同學' + pad2_(m[0])), m[1]]\n      .concat(m[2])\n      .concat([total, '', '']);\n  });\n  sheet.getRange(2, 1, rows.length, DETAIL_HEADERS.length).setValues(rows);\n  sheet.getRange(2, D.TIME + 1, rows.length, 1).setNumberFormat('yyyy/mm/dd hh:mm:ss');\n  return sheet;\n}\n\nfunction createSummarySheet_(ss) {\n  const sheet = ss.insertSheet(SHEET_NAMES.SUMMARY, 0);\n  styleHeader_(sheet, SUMMARY_HEADERS);\n  sheet.setColumnWidth(1, 100);\n  sheet.setColumnWidth(2, 160);\n  return sheet;\n}\n\nfunction styleHeader_(sheet, headers) {\n  sheet.getRange(1, 1, 1, headers.length)\n    .setValues([headers])\n    .setFontWeight('bold')\n    .setBackground('#1d4ed8')\n    .setFontColor('#ffffff')\n    .setHorizontalAlignment('center');\n  sheet.setFrozenRows(1);\n}\n\n// ==================== 6. 總表重建 ====================\n\n/**\n * 依「評分明細」重建「評分總表」：\n * 第一欄座號、第二欄繳交時間、橫軸第一～第七組。\n * 同一座號重複評同一組時，第二次之後的分數放在該座號的下一列，標示「⚠️修改分數：X」。\n */\nfunction rebuildSummary_(ss) {\n  const detailSheet = ss.getSheetByName(SHEET_NAMES.DETAIL);\n  const summary = ss.getSheetByName(SHEET_NAMES.SUMMARY);\n  const records = readDetails_(detailSheet);\n\n  // 依座號 → 組別 → 時間 分組，同時重新判定每筆紀錄是原始或修改\n  const bySeat = {};\n  records.slice().sort(function (a, b) { return a.time - b.time; }).forEach(function (r) {\n    bySeat[r.seat] = bySeat[r.seat] || {};\n    bySeat[r.seat][r.group] = bySeat[r.seat][r.group] || [];\n    r.status = bySeat[r.seat][r.group].length ? MOD_LABEL : ORIGINAL_LABEL;\n    bySeat[r.seat][r.group].push(r);\n  });\n\n  // 回寫明細的「狀態」欄（刪除紀錄後狀態可能改變）\n  const dataRows = Math.max(detailSheet.getLastRow() - 1, 0);\n  if (dataRows) {\n    const statusRange = detailSheet.getRange(2, D.STATUS + 1, dataRows, 1);\n    const statuses = statusRange.getValues();\n    records.forEach(function (r) { statuses[r.row - 2][0] = r.status; });\n    statusRange.setValues(statuses);\n  }\n\n  const values = [];\n  const notes = [];\n  const backgrounds = [];\n  Object.keys(bySeat).map(Number).sort(function (a, b) { return a - b; }).forEach(function (seat) {\n    const groups = bySeat[seat];\n    const depth = Math.max.apply(null, Object.keys(groups).map(function (g) { return groups[g].length; }));\n    for (let k = 0; k < depth; k++) {\n      const row = [seat, ''];\n      const noteRow = ['', ''];\n      const bgRow = [null, null];\n      let latest = null;\n      for (let g = 1; g <= GROUP_COUNT; g++) {\n        const rec = groups[g] && groups[g][k];\n        if (!rec) { row.push(''); noteRow.push(''); bgRow.push(null); continue; }\n        if (!latest || rec.time > latest) latest = rec.time;\n        row.push(k === 0 ? rec.total : MOD_LABEL + '：' + rec.total);\n        noteRow.push('繳交時間：' + formatTime_(rec.time) + '\\n' +\n          CRITERIA.map(function (c, i) { return c + '：' + rec.scores[i]; }).join('\\n'));\n        bgRow.push(k === 0 ? null : '#fef3c7');\n      }\n      row[1] = latest || '';\n      values.push(row);\n      notes.push(noteRow);\n      backgrounds.push(bgRow);\n    }\n  });\n\n  const lastRow = summary.getLastRow();\n  if (lastRow > 1) {\n    const old = summary.getRange(2, 1, lastRow - 1, SUMMARY_HEADERS.length);\n    old.clearContent();\n    old.clearNote();\n    old.setBackground(null);\n  }\n  if (values.length) {\n    const range = summary.getRange(2, 1, values.length, SUMMARY_HEADERS.length);\n    range.setValues(values);\n    range.setNotes(notes);\n    range.setBackgrounds(backgrounds);\n    range.setHorizontalAlignment('center');\n    summary.getRange(2, 2, values.length, 1).setNumberFormat('yyyy/mm/dd hh:mm:ss');\n  }\n}\n\n// ==================== 7. 即時數據（匿名） ====================\n\n/** 前台即時數據：不含座號與姓名，評分者一律以隨機匿名代碼呈現 */\nfunction buildLiveStats_(ss) {\n  const records = readDetails_(ss.getSheetByName(SHEET_NAMES.DETAIL));\n  const auth = getAuthData_(ss);\n\n  // 每位評分者對每組只採計最新一次分數\n  const latest = {};\n  records.forEach(function (r) {\n    const key = r.seat + '_' + r.group;\n    if (!latest[key] || r.time > latest[key].time) latest[key] = r;\n  });\n\n  const groups = GROUP_LABELS.map(function (label, i) { return { group: i + 1, label: label, count: 0, sum: 0 }; });\n  Object.keys(latest).forEach(function (k) {\n    const r = latest[k];\n    const g = groups[r.group - 1];\n    if (g) { g.count++; g.sum += r.total; }\n  });\n  groups.forEach(function (g) {\n    g.average = g.count ? Math.round(g.sum / g.count * 100) / 100 : 0;\n    delete g.sum;\n  });\n\n  const feed = records.slice()\n    .sort(function (a, b) { return b.time - a.time; })\n    .slice(0, 15)\n    .map(function (r) {\n      return {\n        code: (auth[r.seat] && auth[r.seat].anon) || 'R-????',\n        groupLabel: GROUP_LABELS[r.group - 1] || '',\n        total: r.total,\n        time: formatTime_(r.time, 'MM/dd HH:mm'),\n        isModification: r.status === MOD_LABEL\n      };\n    });\n\n  return {\n    groups: groups,\n    feed: feed,\n    totalSubmissions: records.length,\n    maxTotal: CRITERIA.length * MAX_ITEM_SCORE,\n    updatedAt: formatTime_(new Date(), 'HH:mm:ss')\n  };\n}\n\n// ==================== 8. 資料讀取與驗證工具 ====================\n\n/** 讀取評分明細，回傳物件陣列（含所在列號 row） */\nfunction readDetails_(sheet) {\n  const lastRow = sheet.getLastRow();\n  if (lastRow < 2) return [];\n  const values = sheet.getRange(2, 1, lastRow - 1, DETAIL_HEADERS.length).getValues();\n  const list = [];\n  values.forEach(function (v, i) {\n    if (v[D.ID] === '' || v[D.SEAT] === '') return;\n    const time = v[D.TIME] instanceof Date ? v[D.TIME] : new Date(v[D.TIME]);\n    list.push({\n      row: i + 2,\n      id: String(v[D.ID]),\n      time: time,\n      seat: Number(v[D.SEAT]),\n      name: String(v[D.NAME]),\n      group: Number(v[D.GROUP]),\n      scores: v.slice(D.C_START, D.C_START + CRITERIA.length).map(Number),\n      total: Number(v[D.TOTAL]),\n      status: String(v[D.STATUS] || ''),\n      fileId: String(v[D.FILE] || '')\n    });\n  });\n  return list;\n}\n\n/** 讀取身份驗證分頁；缺匿名代碼的座號會自動補上 */\nfunction getAuthData_(ss) {\n  const sheet = ss.getSheetByName(SHEET_NAMES.AUTH);\n  const map = {};\n  if (!sheet || sheet.getLastRow() < 2) return map;\n\n  const range = sheet.getRange(2, 1, sheet.getLastRow() - 1, AUTH_HEADERS.length);\n  const values = range.getValues();\n  const used = {};\n  values.forEach(function (v) { if (v[3]) used[v[3]] = true; });\n\n  let filled = false;\n  values.forEach(function (v, i) {\n    if (v[0] === '') return;\n    if (!v[3]) { v[3] = generateAnonCode_(used); filled = true; }\n    const seat = Number(v[0]);\n    map[seat] = {\n      seat: seat,\n      row: i + 2,\n      name: String(v[1] || '').trim(),\n      code: normalizeCode_(v[2]),\n      anon: String(v[3])\n    };\n  });\n  if (filled) range.setValues(values);\n  return map;\n}\n\n/** 驗證座號＋身份碼；連續錯誤 5 次鎖定 10 分鐘，防止暴力猜碼 */\nfunction verifyIdentity_(ss, seat, code) {\n  const seatNo = Number(seat);\n  if (!Number.isInteger(seatNo) || seatNo < 1 || seatNo > 999) throw new Error('請輸入正確的座號。');\n  const codeStr = String(code == null ? '' : code).trim();\n  if (!/^\\d{4}$/.test(codeStr)) throw new Error('身份碼必須是四位數字。');\n\n  const cache = CacheService.getScriptCache();\n  const failKey = 'verify_fail_' + seatNo;\n  const fails = Number(cache.get(failKey) || 0);\n  if (fails >= MAX_VERIFY_FAILS) throw new Error('此座號驗證失敗次數過多，請 10 分鐘後再試，或洽老師協助。');\n\n  const person = getAuthData_(ss)[seatNo];\n  if (!person) throw new Error('查無此座號，請確認座號是否正確。');\n  if (person.code !== codeStr) {\n    cache.put(failKey, String(fails + 1), VERIFY_LOCK_SECONDS);\n    throw new Error('身份碼錯誤，請再試一次。（剩餘 ' + (MAX_VERIFY_FAILS - fails - 1) + ' 次機會）');\n  }\n  cache.remove(failKey);\n  return person;\n}\n\nfunction listRecordsOfSeat_(ss, seat) {\n  return readDetails_(ss.getSheetByName(SHEET_NAMES.DETAIL))\n    .filter(function (r) { return r.seat === seat; })\n    .sort(function (a, b) { return b.time - a.time; })\n    .map(function (r) {\n      return {\n        id: r.id,\n        group: r.group,\n        groupLabel: GROUP_LABELS[r.group - 1] || '',\n        scores: r.scores,\n        total: r.total,\n        status: r.status,\n        time: formatTime_(r.time)\n      };\n    });\n}\n\n/** 將評分備份成 CSV 存進 FOLDER_ID 資料夾，回傳檔案 ID */\nfunction saveBackupCsv_(rec) {\n  const folder = getFolder_();\n  const lines = [\n    '﻿評分者座號,評分者姓名,組別,總分,狀態,繳交時間',\n    [pad2_(rec.seat), csvCell_(rec.name), GROUP_LABELS[rec.group - 1], rec.total, rec.status, formatTime_(rec.time)].join(','),\n    '',\n    '面向,分數'\n  ].concat(CRITERIA.map(function (c, i) { return csvCell_(c) + ',' + rec.scores[i]; }));\n  const fileName = pad2_(rec.seat) + '_' + rec.name + '_' + GROUP_LABELS[rec.group - 1] + '_' +\n    formatTime_(rec.time, 'yyyyMMdd_HHmmss') + '.csv';\n  return folder.createFile(fileName, lines.join('\\n'), MimeType.CSV).getId();\n}\n\n// ==================== 9. 小工具 ====================\n\nfunction generateAnonCode_(used) {\n  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';\n  let code;\n  do {\n    code = 'R-';\n    for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));\n  } while (used[code]);\n  used[code] = true;\n  return code;\n}\n\nfunction newRecordId_() {\n  return 'R' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase();\n}\n\nfunction normalizeCode_(v) {\n  const s = String(v == null ? '' : v).trim();\n  return /^\\d{1,4}$/.test(s) ? ('0000' + s).slice(-4) : s;\n}\n\nfunction formatTime_(date, pattern) {\n  return Utilities.formatDate(date, Session.getScriptTimeZone(), pattern || 'yyyy/MM/dd HH:mm:ss');\n}\n\nfunction pad2_(n) {\n  return ('0' + n).slice(-2);\n}\n\nfunction csvCell_(s) {\n  s = String(s);\n  return /[\",\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s;\n}\n", "indexHtml": "<!DOCTYPE html>\n<html lang=\"zh-TW\">\n<head>\n    \u003c!-- 🧑‍💻 Index — AI專題報告 ‧ 同儕評分系統（前台） -->\n    <base target=\"_top\">\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>AI專題報告同儕評分系統\u003c/title>\n    <script src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    <style>\n        body { font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif; }\n        .radio-card { transition: all 0.25s ease-in-out; }\n        .highlight-green { color: #059669; background-color: #d1fae5; padding: 0.1rem 0.25rem; border-radius: 0.25rem; font-weight: 700; }\n        .highlight-orange { color: #d97706; background-color: #fef3c7; padding: 0.1rem 0.25rem; border-radius: 0.25rem; font-weight: 700; }\n        .highlight-red { color: #e11d48; background-color: #ffe4e6; padding: 0.1rem 0.25rem; border-radius: 0.25rem; font-weight: 700; }\n        .bar { transition: width 0.6s ease; }\n        .spinner { border: 3px solid rgba(30,58,138,.2); border-top-color: #1e3a8a; border-radius: 50%; width: 1.1rem; height: 1.1rem; animation: spin .8s linear infinite; display: inline-block; }\n        @keyframes spin { to { transform: rotate(360deg); } }\n    \u003c/style>\n\u003c/head>\n<body class=\"bg-blue-50 py-8 px-4 md:px-8\">\n    <div class=\"max-w-5xl mx-auto\">\n        <div id=\"previewBanner\" class=\"hidden mb-4 rounded-xl bg-amber-100 border border-amber-300 text-amber-900 px-4 py-3 text-sm font-medium\">\n            🧪 本地預覽模式：目前使用模擬測試資料（身份碼皆為 1111），部署到 GAS 後會自動連線到 Google Sheet。\n        \u003c/div>\n\n        <div class=\"bg-gradient-to-r from-blue-700 to-blue-400 rounded-t-2xl p-8 shadow-lg text-white text-center\">\n            <h1 class=\"text-3xl md:text-4xl font-extrabold mb-2 tracking-wide\">AI專題報告 ‧ 同儕評分系統\u003c/h1>\n            <p class=\"text-blue-100 font-medium\">請點選各面向中最符合小組表現的敘述，系統將自動計分。\u003c/p>\n        \u003c/div>\n\n        <form id=\"gradingForm\" class=\"bg-white rounded-b-2xl shadow-xl p-6 md:p-10 space-y-8\" onsubmit=\"return false;\">\n            <div class=\"bg-blue-50/60 p-6 rounded-xl border border-blue-200 grid grid-cols-1 md:grid-cols-3 gap-6 shadow-sm\">\n                <div>\n                    <label for=\"raterSeat\" class=\"block text-sm font-bold text-blue-900 mb-2\">評分者座號 <span class=\"text-red-500\">*\u003c/span>\u003c/label>\n                    <input type=\"number\" id=\"raterSeat\" required min=\"1\" placeholder=\"例如: 5\"\n                        class=\"w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800\">\n                    <p id=\"verifyStatus\" class=\"mt-2 text-sm font-bold text-gray-500\">🔒 輸入座號後需驗證身份碼\u003c/p>\n                \u003c/div>\n                <div>\n                    <label for=\"raterName\" class=\"block text-sm font-bold text-blue-900 mb-2\">評分同學姓名 <span class=\"text-red-500\">*\u003c/span>\u003c/label>\n                    <input type=\"text\" id=\"raterName\" required placeholder=\"驗證後自動帶入\"\n                        class=\"w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800\">\n                \u003c/div>\n                <div>\n                    <label for=\"targetGroup\" class=\"block text-sm font-bold text-blue-900 mb-2\">評核組別 <span class=\"text-red-500\">*\u003c/span>\u003c/label>\n                    <select id=\"targetGroup\" required class=\"w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800 bg-white cursor-pointer\">\n                        <option value=\"\" disabled selected>請選擇組別 ▼\u003c/option>\n                        <option value=\"1\">第一組\u003c/option><option value=\"2\">第二組\u003c/option><option value=\"3\">第三組\u003c/option>\n                        <option value=\"4\">第四組\u003c/option><option value=\"5\">第五組\u003c/option><option value=\"6\">第六組\u003c/option><option value=\"7\">第七組\u003c/option>\n                    \u003c/select>\n                \u003c/div>\n            \u003c/div>\n\n            <div id=\"editingBanner\" class=\"hidden rounded-xl bg-amber-50 border border-amber-300 text-amber-900 px-4 py-3 font-bold flex items-center justify-between gap-4\">\n                <span id=\"editingText\">\u003c/span>\n                <button type=\"button\" onclick=\"resetFormAfterSubmit()\" class=\"text-sm underline\">取消修改\u003c/button>\n            \u003c/div>\n\n            <div id=\"criteriaContainer\" class=\"space-y-8\">\u003c/div>\n\n            <div class=\"mt-10 p-6 bg-blue-900 text-white rounded-xl flex flex-col md:flex-row justify-between items-center shadow-inner border-t-4 border-blue-400 gap-6\">\n                <div class=\"flex items-center space-x-4\">\n                    <span class=\"text-2xl font-bold tracking-wider\">小組總評分\u003c/span>\n                    <div class=\"flex items-baseline space-x-2\">\n                        <span id=\"totalScore\" class=\"text-5xl font-extrabold text-yellow-400\">0\u003c/span>\n                        <span class=\"text-xl text-blue-200 font-bold\">/ 12\u003c/span>\n                    \u003c/div>\n                \u003c/div>\n                <button type=\"button\" id=\"submitBtn\" onclick=\"submitForm()\"\n                    class=\"w-full md:w-auto px-8 py-4 bg-yellow-400 hover:bg-yellow-300 text-blue-900 font-extrabold text-lg rounded-lg shadow-lg transform hover:-translate-y-1 transition-all disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none\">\n                    📤 送出評分\n                \u003c/button>\n            \u003c/div>\n        \u003c/form>\n\n        \u003c!-- 我的評分紀錄（CRUD：讀取／修改／刪除，需身份驗證） -->\n        <section id=\"myRecordsSection\" class=\"hidden mt-8 bg-white rounded-2xl shadow-xl p-6 md:p-8\">\n            <h2 class=\"font-extrabold text-2xl text-blue-900 border-l-4 border-blue-500 pl-3 mb-4\">📋 我的評分紀錄\u003c/h2>\n            <div id=\"myRecords\" class=\"space-y-3\">\u003c/div>\n        \u003c/section>\n\n        \u003c!-- 即時數據（匿名） -->\n        <section class=\"mt-8 bg-white rounded-2xl shadow-xl p-6 md:p-8\">\n            <div class=\"flex flex-wrap items-baseline justify-between gap-2 mb-6\">\n                <h2 class=\"font-extrabold text-2xl text-blue-900 border-l-4 border-blue-500 pl-3\">📊 即時評分數據\u003c/h2>\n                <span class=\"text-sm text-gray-500\">共 <b id=\"totalSubmissions\">0\u003c/b> 筆繳交 ‧ 更新於 <span id=\"updatedAt\">--\u003c/span>\u003c/span>\n            \u003c/div>\n            <div id=\"groupStats\" class=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\u003c/div>\n            <h3 class=\"font-bold text-lg text-blue-900 mt-8 mb-3\">最新繳交動態 <span class=\"text-sm font-medium text-gray-500\">（評分者以隨機代碼顯示）\u003c/span>\u003c/h3>\n            <div class=\"overflow-x-auto\">\n                <table class=\"w-full text-sm text-left\">\n                    <thead class=\"bg-blue-50 text-blue-900\">\n                        <tr><th class=\"px-3 py-2\">匿名代碼\u003c/th><th class=\"px-3 py-2\">組別\u003c/th><th class=\"px-3 py-2\">總分\u003c/th><th class=\"px-3 py-2\">時間\u003c/th><th class=\"px-3 py-2\">狀態\u003c/th>\u003c/tr>\n                    \u003c/thead>\n                    <tbody id=\"feedBody\">\u003c/tbody>\n                \u003c/table>\n            \u003c/div>\n        \u003c/section>\n    \u003c/div>\n\n    \u003c!-- 身份碼驗證視窗 -->\n    <div id=\"idModal\" class=\"fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 px-4\">\n        <div class=\"bg-white rounded-2xl p-8 max-w-sm w-full text-center\">\n            <h3 class=\"text-2xl font-bold mb-2 text-blue-900\">🔐 身份驗證\u003c/h3>\n            <p class=\"text-gray-600 mb-5\">座號 <b id=\"idModalSeat\">\u003c/b>，請輸入四位數字身份碼\u003c/p>\n            <input type=\"password\" id=\"idCodeInput\" inputmode=\"numeric\" maxlength=\"4\" autocomplete=\"off\"\n                class=\"w-full text-center tracking-[0.6em] text-2xl font-bold px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-2\">\n            <p id=\"idModalError\" class=\"text-sm font-bold text-rose-600 min-h-[1.25rem] mb-3\">\u003c/p>\n            <button type=\"button\" id=\"idConfirmBtn\" onclick=\"confirmIdentity()\" class=\"block w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg mb-3\">確認\u003c/button>\n            <button type=\"button\" onclick=\"cancelIdentity()\" class=\"w-full py-3 bg-gray-100 text-gray-700 font-bold rounded-lg\">取消\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 重複評分確認視窗 -->\n    <div id=\"confirmModal\" class=\"fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 px-4\">\n        <div class=\"bg-white rounded-2xl p-8 max-w-md w-full text-center\">\n            <h3 class=\"text-2xl font-bold mb-3 text-amber-600\">⚠️ 重複評分提醒\u003c/h3>\n            <p class=\"text-gray-700 mb-2 font-bold\">您已經評過分數，請確認是否修改您的評分\u003c/p>\n            <p id=\"confirmDetail\" class=\"text-sm text-gray-500 mb-6\">\u003c/p>\n            <button type=\"button\" onclick=\"confirmModification()\" class=\"block w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg mb-3\">確定\u003c/button>\n            <button type=\"button\" onclick=\"closeModal('confirmModal')\" class=\"w-full py-3 bg-gray-100 text-gray-700 font-bold rounded-lg\">取消\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 訊息視窗 -->\n    <div id=\"messageModal\" class=\"fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 px-4\">\n        <div class=\"bg-white rounded-2xl p-8 max-w-lg w-full text-center\">\n            <h3 id=\"messageTitle\" class=\"text-2xl font-bold mb-4\">\u003c/h3>\n            <p id=\"messageBody\" class=\"text-gray-600 mb-6 whitespace-pre-line\">\u003c/p>\n            <button type=\"button\" onclick=\"closeModal('messageModal')\" class=\"w-full py-3 bg-blue-600 text-white font-bold rounded-lg\">關閉\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    <script>\n        // ==================== 評分面向（沿用原本內容） ====================\n        const criteria = [\n            { id: 'c1', name: '1. 痛點分析與 AI 解方', levels: [\n                { score: 3, title: '優', desc: '明確定義<span class=\"highlight-green\">具體產業痛點\u003c/span>，並論證AI如何<span class=\"highlight-green\">觸發解決\u003c/span>。' },\n                { score: 2, title: '可', desc: '提出AI功能，但對<span class=\"highlight-orange\">痛點對應關係闡述較模糊\u003c/span>。' },\n                { score: 1, title: '需加強', desc: '僅能籠統說明，<span class=\"highlight-red\">無法指出對應痛點\u003c/span>。' }\n            ]},\n            { id: 'c2', name: '2. 思辨與兩難分析', levels: [\n                { score: 3, title: '優', desc: '深入解析兩難，提出<span class=\"highlight-green\">具創新性第三方案\u003c/span>。' },\n                { score: 2, title: '可', desc: '能辨識兩難，但<span class=\"highlight-orange\">方案細節不足\u003c/span>。' },\n                { score: 1, title: '需加強', desc: '<span class=\"highlight-red\">無法呈現兩難衝突\u003c/span>。' }\n            ]},\n            { id: 'c3', name: '3. 視覺化概念整合', levels: [\n                { score: 3, title: '優', desc: '原創圖表，<span class=\"highlight-green\">無需解釋即可理解\u003c/span>。' },\n                { score: 2, title: '可', desc: '有圖表，但<span class=\"highlight-orange\">視覺輔助效果有限\u003c/span>。' },\n                { score: 1, title: '需加強', desc: '<span class=\"highlight-red\">未使用視覺化工具\u003c/span>。' }\n            ]},\n            { id: 'c4', name: '4. 簡報規範與呈現', levels: [\n                { score: 3, title: '優', desc: '排版專業，能在<span class=\"highlight-green\">5分鐘內精準完成\u003c/span>。' },\n                { score: 2, title: '可', desc: '必要元素齊全，但<span class=\"highlight-orange\">時間掌控失衡\u003c/span>。' },\n                { score: 1, title: '需加強', desc: '<span class=\"highlight-red\">嚴重偏離規範\u003c/span>。' }\n            ]}\n        ];\n        const GROUP_LABELS = ['第一組', '第二組', '第三組', '第四組', '第五組', '第六組', '第七組'];\n        const CARD_BASE = 'radio-card p-5 border-2 border-gray-200 rounded-xl cursor-pointer bg-gray-50 flex flex-col h-full group';\n        const CARD_ACTIVE = 'radio-card p-5 border-2 border-blue-500 rounded-xl cursor-pointer bg-blue-50 ring-2 ring-blue-400 flex flex-col h-full group';\n        const BADGE_BASE = 'bg-gray-200 text-gray-700 text-sm font-bold px-3 py-1 rounded-full';\n        const BADGE_ACTIVE = 'bg-blue-600 text-white text-sm font-bold px-3 py-1 rounded-full';\n        const REFRESH_MS = 30000;\n\n        // 身份資料只存在記憶體，不寫入瀏覽器儲存空間\n        const state = { verified: false, seat: null, code: null, pendingPayload: null, submitting: false, myRecords: [] };\n\n        // ==================== GAS / 本地預覽 連線切換 ====================\n        // 非 GAS 環境（例如直接用瀏覽器打開檔案）沒有 google 物件，改用模擬資料，避免「google is not defined」。\n        const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;\n\n        function callServer(fnName, ...args) {\n            if (IS_GAS) {\n                return new Promise((resolve, reject) => {\n                    google.script.run\n                        .withSuccessHandler(resolve)\n                        .withFailureHandler(err => reject(err instanceof Error ? err : new Error(String(err && err.message || err))))\n                        [fnName](...args);\n                });\n            }\n            return new Promise((resolve, reject) => {\n                setTimeout(() => {\n                    try { resolve(JSON.parse(JSON.stringify(MockServer[fnName](...args)))); }\n                    catch (e) { reject(e); }\n                }, 250);\n            });\n        }\n\n        // ==================== 本地預覽用的模擬後端 ====================\n        const MockServer = (() => {\n            const MOD = '⚠️修改分數';\n            const pad = n => String(n).padStart(2, '0');\n            const anonChars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';\n            const randAnon = () => 'R-' + Array.from({ length: 4 }, () => anonChars[Math.floor(Math.random() * anonChars.length)]).join('');\n            const auth = {};\n            for (let s = 1; s <= 30; s++) auth[s] = { name: '同學' + pad(s), code: '1111', anon: randAnon() };\n            const now = Date.now();\n            let seq = 0;\n            const mk = (seat, group, scores, minsAgo) => ({ id: 'MOCK' + (++seq), time: now - minsAgo * 60000, seat, group, scores, total: scores.reduce((a, b) => a + b, 0) });\n            let records = [mk(1, 1, [3, 2, 3, 2], 50), mk(1, 2, [2, 2, 2, 3], 45), mk(2, 1, [3, 3, 2, 3], 40), mk(3, 3, [2, 1, 2, 2], 30), mk(4, 5, [3, 3, 3, 3], 20), mk(1, 1, [3, 3, 3, 2], 10)];\n\n            const fmt = (t, short) => {\n                const d = new Date(t), p = n => String(n).padStart(2, '0');\n                const md = `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;\n                return short ? md : `${d.getFullYear()}/${md}:${p(d.getSeconds())}`;\n            };\n            const statusOf = r => records.filter(x => x.seat === r.seat && x.group === r.group && x.time < r.time).length ? MOD : '原始';\n            const verify = (seat, code) => {\n                const p = auth[Number(seat)];\n                if (!/^\\d{4}$/.test(String(code))) throw new Error('身份碼必須是四位數字。');\n                if (!p) throw new Error('查無此座號，請確認座號是否正確。');\n                if (p.code !== String(code)) throw new Error('身份碼錯誤，請再試一次。');\n                return { seat: Number(seat), ...p };\n            };\n            const stats = () => {\n                const latest = {};\n                records.forEach(r => { const k = r.seat + '_' + r.group; if (!latest[k] || r.time > latest[k].time) latest[k] = r; });\n                const groups = GROUP_LABELS.map((label, i) => ({ group: i + 1, label, count: 0, sum: 0 }));\n                Object.values(latest).forEach(r => { groups[r.group - 1].count++; groups[r.group - 1].sum += r.total; });\n                groups.forEach(g => { g.average = g.count ? Math.round(g.sum / g.count * 100) / 100 : 0; delete g.sum; });\n                const feed = [...records].sort((a, b) => b.time - a.time).slice(0, 15).map(r => ({\n                    code: auth[r.seat].anon, groupLabel: GROUP_LABELS[r.group - 1], total: r.total, time: fmt(r.time, true), isModification: statusOf(r) === MOD\n                }));\n                return { groups, feed, totalSubmissions: records.length, maxTotal: 12, updatedAt: new Date().toLocaleTimeString('zh-TW', { hour12: false }) };\n            };\n            const mine = seat => records.filter(r => r.seat === seat).sort((a, b) => b.time - a.time)\n                .map(r => ({ id: r.id, group: r.group, groupLabel: GROUP_LABELS[r.group - 1], scores: r.scores, total: r.total, status: statusOf(r), time: fmt(r.time) }));\n\n            return {\n                getInitialData: () => ({ groups: GROUP_LABELS, stats: stats() }),\n                getLiveStats: () => stats(),\n                verifyIdentity: (seat, code) => { const p = verify(seat, code); return { ok: true, seat: p.seat, name: p.name }; },\n                submitScore: payload => {\n                    const p = verify(payload.seat, payload.code);\n                    const group = Number(payload.group);\n                    const existing = records.filter(r => r.seat === p.seat && r.group === group);\n                    if (existing.length && payload.confirmed !== true) {\n                        return { status: 'DUPLICATE', group, groupLabel: GROUP_LABELS[group - 1], previousTotal: existing[existing.length - 1].total };\n                    }\n                    const rec = mk(p.seat, group, payload.scores.map(Number), 0);\n                    rec.time = Date.now();\n                    records.push(rec);\n                    return { status: 'OK', isModification: existing.length > 0, groupLabel: GROUP_LABELS[group - 1], total: rec.total, warning: '', stats: stats() };\n                },\n                getMyRecords: (seat, code) => mine(verify(seat, code).seat),\n                deleteMyRecord: (seat, code, id) => {\n                    const p = verify(seat, code);\n                    const target = records.find(r => r.id === id);\n                    if (!target) throw new Error('找不到這筆紀錄，可能已被刪除。');\n                    if (target.seat !== p.seat) throw new Error('只能刪除自己的評分紀錄。');\n                    records = records.filter(r => r.id !== id);\n                    return { ok: true, records: mine(p.seat), stats: stats() };\n                }\n            };\n        })();\n\n        // ==================== 畫面：評分卡片 ====================\n        function renderCriteria() {\n            const container = document.getElementById('criteriaContainer');\n            criteria.forEach(item => {\n                const div = document.createElement('div');\n                div.innerHTML = `<h3 class=\"font-extrabold text-2xl mb-4 text-blue-900 border-l-4 border-blue-500 pl-3\">${item.name}\u003c/h3>\n                    <div class=\"grid grid-cols-1 md:grid-cols-3 gap-4\" id=\"${item.id}\" data-score=\"0\">\n                    ${item.levels.map(l => `\n                        <div data-level=\"${l.score}\" onclick=\"selectScore('${item.id}', ${l.score}, this)\" class=\"${CARD_BASE}\">\n                            <div class=\"flex justify-between items-center mb-3\">\n                                <span class=\"text-xl font-bold text-gray-800\">${l.title}\u003c/span>\n                                <span class=\"${BADGE_BASE}\">${l.score} 分\u003c/span>\n                            \u003c/div>\n                            <p class=\"text-gray-700 text-sm\">${l.desc}\u003c/p>\n                        \u003c/div>`).join('')}\u003c/div>`;\n                container.appendChild(div);\n            });\n        }\n\n        function selectScore(groupId, score, el) {\n            const group = document.getElementById(groupId);\n            group.querySelectorAll('.radio-card').forEach(c => {\n                c.className = CARD_BASE;\n                c.querySelector('span:nth-child(2)').className = BADGE_BASE;\n            });\n            if (el) {\n                el.className = CARD_ACTIVE;\n                el.querySelector('span:nth-child(2)').className = BADGE_ACTIVE;\n            }\n            group.dataset.score = score;\n            calculateTotal();\n        }\n\n        function calculateTotal() {\n            let t = 0;\n            criteria.forEach(c => t += parseInt(document.getElementById(c.id).dataset.score, 10));\n            document.getElementById('totalScore').innerText = t;\n        }\n\n        // ==================== 身份驗證 ====================\n        function onSeatChanged() {\n            const seat = document.getElementById('raterSeat').value.trim();\n            if (state.verified && Number(seat) === state.seat) return;\n            clearIdentity();\n            if (!seat) return;\n            document.getElementById('idModalSeat').innerText = seat;\n            document.getElementById('idCodeInput').value = '';\n            document.getElementById('idModalError').innerText = '';\n            openModal('idModal');\n            setTimeout(() => document.getElementById('idCodeInput').focus(), 50);\n        }\n\n        async function confirmIdentity() {\n            const seat = document.getElementById('raterSeat').value.trim();\n            const code = document.getElementById('idCodeInput').value.trim();\n            const errEl = document.getElementById('idModalError');\n            if (!/^\\d{4}$/.test(code)) { errEl.innerText = '請輸入四位數字身份碼'; return; }\n            const btn = document.getElementById('idConfirmBtn');\n            btn.disabled = true; btn.innerHTML = '<span class=\"spinner\">\u003c/span>';\n            try {\n                const res = await callServer('verifyIdentity', seat, code);\n                state.verified = true; state.seat = res.seat; state.code = code;\n                const nameInput = document.getElementById('raterName');\n                if (res.name) { nameInput.value = res.name; nameInput.readOnly = true; nameInput.classList.add('bg-gray-100'); }\n                setVerifyStatus(true);\n                closeModal('idModal');\n                loadMyRecords();\n            } catch (e) {\n                errEl.innerText = e.message;\n            } finally {\n                btn.disabled = false; btn.innerText = '確認';\n            }\n        }\n\n        function cancelIdentity() {\n            closeModal('idModal');\n            document.getElementById('raterSeat').value = '';\n            clearIdentity();\n        }\n\n        function clearIdentity() {\n            state.verified = false; state.seat = null; state.code = null;\n            const nameInput = document.getElementById('raterName');\n            nameInput.value = ''; nameInput.readOnly = false; nameInput.classList.remove('bg-gray-100');\n            setVerifyStatus(false);\n            document.getElementById('myRecordsSection').classList.add('hidden');\n        }\n\n        function setVerifyStatus(ok) {\n            const el = document.getElementById('verifyStatus');\n            el.className = 'mt-2 text-sm font-bold ' + (ok ? 'text-emerald-600' : 'text-gray-500');\n            el.innerText = ok ? '✅ 身份已驗證，可以評分' : '🔒 輸入座號後需驗證身份碼';\n        }\n\n        // ==================== 送出評分（Create / Update） ====================\n        function collectPayload() {\n            const seat = document.getElementById('raterSeat').value.trim();\n            const name = document.getElementById('raterName').value.trim();\n            const group = document.getElementById('targetGroup').value;\n            const scores = criteria.map(c => parseInt(document.getElementById(c.id).dataset.score, 10));\n            if (!seat || !name || !group) { showMessage('⚠️ 資料未完整', '請填寫座號、姓名並選擇評核組別。'); return null; }\n            if (!state.verified || Number(seat) !== state.seat) { onSeatChanged(); return null; }\n            const missing = criteria.filter((c, i) => !scores[i]).map(c => c.name);\n            if (missing.length) { showMessage('⚠️ 尚有面向未評分', missing.join('\\n')); return null; }\n            return { seat: state.seat, code: state.code, name, group: Number(group), scores, confirmed: false };\n        }\n\n        async function submitForm() {\n            if (state.submitting) return;\n            const payload = collectPayload();\n            if (payload) await sendPayload(payload);\n        }\n\n        async function sendPayload(payload) {\n            setSubmitting(true);\n            try {\n                const res = await callServer('submitScore', payload);\n                if (res.status === 'DUPLICATE') {\n                    state.pendingPayload = payload;\n                    document.getElementById('confirmDetail').innerText = `${res.groupLabel} 先前總分：${res.previousTotal} 分 → 本次總分：${payload.scores.reduce((a, b) => a + b, 0)} 分\\n（原紀錄會保留，新分數將標示「⚠️修改分數」）`;\n                    openModal('confirmModal');\n                    return;\n                }\n                showMessage(res.isModification ? '✏️ 已送出修改' : '✅ 評分已送出',\n                    `${res.groupLabel} 總分 ${res.total} 分` + (res.isModification ? '\\n已標示為「⚠️修改分數」，原紀錄保留。' : '') + (res.warning ? '\\n\\n' + res.warning : ''));\n                renderStats(res.stats);\n                resetFormAfterSubmit();\n                loadMyRecords();\n            } catch (e) {\n                showMessage('❌ 送出失敗', e.message);\n            } finally {\n                setSubmitting(false);\n            }\n        }\n\n        function confirmModification() {\n            closeModal('confirmModal');\n            if (!state.pendingPayload) return;\n            const payload = { ...state.pendingPayload, confirmed: true };\n            state.pendingPayload = null;\n            sendPayload(payload);\n        }\n\n        function setSubmitting(on) {\n            state.submitting = on;\n            const btn = document.getElementById('submitBtn');\n            btn.disabled = on;\n            btn.innerHTML = on ? '<span class=\"spinner\">\u003c/span> 送出中…' : '📤 送出評分';\n        }\n\n        /**\n         * 送出成功後重置表單：清空組別與四個面向的選擇、總分歸零、關閉「修改中」提示。\n         * 座號、姓名與身份驗證狀態會保留，方便同一位同學接著評下一組。\n         */\n        function resetFormAfterSubmit() {\n            document.getElementById('targetGroup').value = '';\n            criteria.forEach(c => selectScore(c.id, 0, null));\n            document.getElementById('editingBanner').classList.add('hidden');\n            state.pendingPayload = null;\n            window.scrollTo({ top: 0, behavior: 'smooth' });\n        }\n\n        // ==================== 我的評分紀錄（Read / Update / Delete） ====================\n        async function loadMyRecords() {\n            if (!state.verified) return;\n            try {\n                renderMyRecords(await callServer('getMyRecords', state.seat, state.code));\n            } catch (e) {\n                showMessage('❌ 讀取紀錄失敗', e.message);\n            }\n        }\n\n        function renderMyRecords(list) {\n            const section = document.getElementById('myRecordsSection');\n            const box = document.getElementById('myRecords');\n            section.classList.remove('hidden');\n            if (!list.length) { box.innerHTML = '<p class=\"text-gray-500\">目前還沒有評分紀錄。\u003c/p>'; return; }\n            state.myRecords = list;\n            box.innerHTML = list.map((r, i) => `\n                <div class=\"flex flex-col md:flex-row md:items-center justify-between gap-3 p-4 rounded-xl border ${r.status.includes('修改') ? 'border-amber-300 bg-amber-50' : 'border-gray-200 bg-gray-50'}\">\n                    <div>\n                        <div class=\"font-bold text-blue-900\">${escapeHtml(r.groupLabel)} ‧ 總分 ${r.total} 分 ${r.status.includes('修改') ? '<span class=\"ml-1 text-amber-700 text-sm\">⚠️修改分數\u003c/span>' : ''}\u003c/div>\n                        <div class=\"text-sm text-gray-500\">${escapeHtml(r.time)} ‧ 各面向：${r.scores.join(' / ')}\u003c/div>\n                    \u003c/div>\n                    <div class=\"flex gap-2 shrink-0\">\n                        <button type=\"button\" onclick=\"editRecord(${i})\" class=\"px-4 py-2 bg-blue-600 text-white text-sm font-bold rounded-lg\">修改\u003c/button>\n                        <button type=\"button\" onclick=\"deleteRecord('${escapeHtml(r.id)}')\" class=\"px-4 py-2 bg-rose-100 text-rose-700 text-sm font-bold rounded-lg\">刪除\u003c/button>\n                    \u003c/div>\n                \u003c/div>`).join('');\n        }\n\n        /** 把舊紀錄帶回表單；送出時會觸發重複評分確認，並以「⚠️修改分數」新增一筆 */\n        function editRecord(index) {\n            const r = state.myRecords[index];\n            if (!r) return;\n            document.getElementById('targetGroup').value = String(r.group);\n            criteria.forEach((c, i) => {\n                const card = document.querySelector(`#${c.id} [data-level=\"${r.scores[i]}\"]`);\n                selectScore(c.id, r.scores[i], card);\n            });\n            document.getElementById('editingText').innerText = `✏️ 正在修改 ${r.groupLabel} 的評分（原總分 ${r.total} 分），調整後按「送出評分」`;\n            document.getElementById('editingBanner').classList.remove('hidden');\n            window.scrollTo({ top: 0, behavior: 'smooth' });\n        }\n\n        async function deleteRecord(id) {\n            if (!confirm('確定要刪除這筆評分紀錄嗎？刪除後無法復原。')) return;\n            try {\n                const res = await callServer('deleteMyRecord', state.seat, state.code, id);\n                renderMyRecords(res.records);\n                renderStats(res.stats);\n                showMessage('🗑️ 已刪除', '該筆評分紀錄已刪除。');\n            } catch (e) {\n                showMessage('❌ 刪除失敗', e.message);\n            }\n        }\n\n        // ==================== 即時數據（匿名） ====================\n        function renderStats(stats) {\n            if (!stats) return;\n            document.getElementById('totalSubmissions').innerText = stats.totalSubmissions;\n            document.getElementById('updatedAt').innerText = stats.updatedAt;\n            document.getElementById('groupStats').innerHTML = stats.groups.map(g => {\n                const pct = stats.maxTotal ? Math.round(g.average / stats.maxTotal * 100) : 0;\n                return `<div class=\"p-4 rounded-xl border border-blue-100 bg-blue-50/50\">\n                    <div class=\"flex justify-between items-baseline mb-2\">\n                        <span class=\"font-bold text-blue-900\">${escapeHtml(g.label)}\u003c/span>\n                        <span class=\"text-sm text-gray-600\"><b class=\"text-xl text-blue-700\">${g.average.toFixed(2)}\u003c/b> / ${stats.maxTotal}（${g.count} 人評）\u003c/span>\n                    \u003c/div>\n                    <div class=\"h-3 bg-blue-100 rounded-full overflow-hidden\"><div class=\"bar h-full bg-gradient-to-r from-blue-500 to-yellow-400\" style=\"width:${pct}%\">\u003c/div>\u003c/div>\n                \u003c/div>`;\n            }).join('');\n            document.getElementById('feedBody').innerHTML = stats.feed.length ? stats.feed.map(f => `\n                <tr class=\"border-b border-gray-100\">\n                    <td class=\"px-3 py-2 font-mono font-bold text-blue-800\">${escapeHtml(f.code)}\u003c/td>\n                    <td class=\"px-3 py-2\">${escapeHtml(f.groupLabel)}\u003c/td>\n                    <td class=\"px-3 py-2 font-bold\">${f.total}\u003c/td>\n                    <td class=\"px-3 py-2 text-gray-500\">${escapeHtml(f.time)}\u003c/td>\n                    <td class=\"px-3 py-2\">${f.isModification ? '<span class=\"text-amber-700 font-bold\">⚠️修改分數\u003c/span>' : '<span class=\"text-emerald-700\">已繳交\u003c/span>'}\u003c/td>\n                \u003c/tr>`).join('') : '<tr><td colspan=\"5\" class=\"px-3 py-4 text-gray-500\">尚無資料\u003c/td>\u003c/tr>';\n        }\n\n        async function refreshStats() {\n            try { renderStats(await callServer('getLiveStats')); } catch (e) { /* 背景刷新失敗時靜默 */ }\n        }\n\n        // ==================== 共用工具 ====================\n        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }\n        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }\n        function showMessage(title, body) {\n            document.getElementById('messageTitle').innerText = title;\n            document.getElementById('messageBody').innerText = body;\n            openModal('messageModal');\n        }\n        function escapeHtml(s) {\n            return String(s).replace(/[&<>\"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[ch]));\n        }\n\n        // ==================== 初始化 ====================\n        async function init() {\n            renderCriteria();\n            if (!IS_GAS) document.getElementById('previewBanner').classList.remove('hidden');\n            document.getElementById('raterSeat').addEventListener('change', onSeatChanged);\n            document.getElementById('idCodeInput').addEventListener('keydown', e => { if (e.key === 'Enter') confirmIdentity(); });\n            try {\n                const data = await callServer('getInitialData');\n                renderStats(data.stats);\n                setInterval(refreshStats, REFRESH_MS);\n            } catch (e) {\n                showMessage('⚙️ 系統設定有誤', e.message);\n            }\n        }\n        init();\n    \u003c/script>\n\u003c/body>\n\u003c/html>\n", "img": {"step0": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNTAwIDg0NCIgd2lkdGg9IjE1MDAiIGhlaWdodD0iODQ0IiBmb250LWZhbWlseT0iJ1BpbmdGYW5nIFRDJywnTm90byBTYW5zIFRDJywnTWljcm9zb2Z0IEpoZW5nSGVpJywnSGVpdGkgVEMnLHNhbnMtc2VyaWYiPgogIDxkZWZzPgogICAgPGZpbHRlciBpZD0ic29mdCIgeD0iLTUlIiB5PSItNSUiIHdpZHRoPSIxMTAlIiBoZWlnaHQ9IjExMCUiPgogICAgICA8ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC4wMzUiIG51bU9jdGF2ZXM9IjIiIHNlZWQ9IjQiIHJlc3VsdD0ibiIvPgogICAgICA8ZmVEaXNwbGFjZW1lbnRNYXAgaW49IlNvdXJjZUdyYXBoaWMiIGluMj0ibiIgc2NhbGU9IjMiLz4KICAgIDwvZmlsdGVyPgogICAgPGxpbmVhckdyYWRpZW50IGlkPSJmb2xkZXJHIiB4MT0iMCIgeTE9IjAiIHgyPSIwIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjRjZDNzY4Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjRTNBNTNBIi8+PC9saW5lYXJHcmFkaWVudD4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0ic2hlZXRHIiB4MT0iMCIgeTE9IjAiIHgyPSIwIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjNURCODZBIi8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMkY4RjQ1Ii8+PC9saW5lYXJHcmFkaWVudD4KICAgIDxsaW5lYXJHcmFkaWVudCBpZD0iZG9jRyIgeDE9IjAiIHkxPSIwIiB4Mj0iMCIgeTI9IjEiPjxzdG9wIG9mZnNldD0iMCIgc3RvcC1jb2xvcj0iIzZFOUJFQSIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2                                 <li>按「部署」後要授權：檢閱權限 → 選擇您的帳號。若出現「Google 尚未驗證這個應用程式」，點「進階」→「前往（不安全）」→「允許」。這是您自己寫的程式，可以放心。</li>
                                <li>複製「網頁應用程式」網址，發給學生。</li>
                            </ol>
                            <p className="font-bold text-indigo-700">✨ 第一次打開網址時，系統會自動執行 getInitialData，在試算表建好三個分頁與模擬資料（身份碼預設都是 1111）。</p>
                            <p className="text-sm text-slate-600">之後修改程式碼，要到「部署 → 管理部署作業 → 編輯 ✏️ → 版本選『新版本』→ 部署」，網址不變，學生重新整理就會看到新版。</p>
                            </div>
                        </div>
                        </section>
                    </div>
                    )}


                </main>

                {zoomImg && (
                <div className="fixed inset-0 z-50 bg-slate-900/85 flex items-center justify-center p-4 cursor-zoom-out animate-fade-in" onClick={() => setZoomImg(null)} role="dialog" aria-label={zoomImg.alt}>
                    <img src={zoomImg.src} alt={zoomImg.alt} className="max-w-full max-h-full rounded-xl shadow-2xl bg-white" />
                    <button onClick={() => setZoomImg(null)} className="absolute top-4 right-4 bg-white/90 hover:bg-white text-slate-800 font-bold rounded-full w-10 h-10 text-xl" aria-label="關閉">×</button>
                </div>
                )}

                {/* 頁尾 Footer 區塊 */}
                <footer className="bg-slate-900 text-slate-400 py-10 mt-auto border-t border-slate-800">
                    <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between">
                    <div className="flex items-center mb-6 md:mb-0">
                        <UniLogo className="w-16 h-auto mr-4 opacity-80 hover:opacity-100 transition-opacity" />
                        <div>
                        <h3 className="text-xl font-bold text-slate-200 tracking-widest">UNI 優履團隊</h3>
                        <p className="text-sm mt-1">教育新浪潮工作坊</p>
                        </div>
                    </div>
                    <div className="text-center md:text-right text-sm">
                        <p className="mb-2 text-slate-300 font-medium">請尊重智慧財產，使用請引註</p>
                        <p>Prompt 模板來源：優履團隊</p>
                        <p>陳佩英教授計畫團隊與優履團隊研發設計 © 2026</p>
                    </div>
                    </div>
                </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
