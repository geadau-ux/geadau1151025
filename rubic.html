        body { background: #f8fafc; color: #1e293b; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* 貓咪動畫 */
        @keyframes catBlink {
            0%, 96%, 98%, 100% { transform: scaleY(1); }
            97%, 99% { transform: scaleY(0.1); }
        }
        .cat-eyes {
            animation: catBlink 4s infinite;
        }

        @keyframes tailWag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(8deg); }
        }
        .cat-tail {
            animation: tailWag 3s ease-in-out infinite;
        }

        /* 提示詞區塊樣式 */
        .prompt-block {
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
        }
        .prompt-block:hover {
            border-color: #cbd5e1;
            transform: translateX(4px);
        }
        .prompt-block.active {
            border-color: #6366f1;
            background-color: #f8fafc;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transform: translateX(8px);
        }
        .prompt-block::before {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 0;
            background-color: #6366f1;
            transition: height 0.2s;
            border-radius: 4px;
        }
        .prompt-block.active::before { height: 60%; }

        /* 螢光筆標註樣式 */
        .highlight-base {
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            cursor: help;
            border-bottom-width: 2px;
            border-bottom-style: dashed;
            display: inline-block;
            margin: 2px 0;
            transition: background-color 0.2s;
        }
        .hl-yellow { background-color: #fef08a; color: #854d0e; border-bottom-color: #ca8a04; }
        .hl-yellow:hover { background-color: #fde047; }
        .hl-green { background-color: #bbf7d0; color: #166534; border-bottom-color: #16a34a; }
        .hl-green:hover { background-color: #86efac; }
        .hl-blue { background-color: #bfdbfe; color: #1e3a8a; border-bottom-color: #2563eb; }
        .hl-blue:hover { background-color: #93c5fd; }
        .hl-pink { background-color: #fbcfe8; color: #9d174d; border-bottom-color: #db2777; }
        .hl-pink:hover { background-color: #f9a8d4; }
        .hl-purple { background-color: #e9d5ff; color: #581c87; border-bottom-color: #9333ea; }
        .hl-purple:hover { background-color: #d8b4fe; }
        .hl-orange { background-color: #ffedd5; color: #9a3412; border-bottom-color: #ea580c; }
        .hl-orange:hover { background-color: #fed7aa; }
        .hl-teal { background-color: #ccfbf1; color: #0f766e; border-bottom-color: #0d9488; }
        .hl-teal:hover { background-color: #99f6e4; }
        .hl-indigo { background-color: #e0e7ff; color: #3730a3; border-bottom-color: #4f46e5; }
        .hl-indigo:hover { background-color: #c7d2fe; }
        .hl-red { background-color: #fecaca; color: #991b1b; border-bottom-color: #dc2626; }
        .hl-red:hover { background-color: #fca5a5; }

        /* 隱藏捲軸但可滾動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<script type="application/json" id="deploy-assets">{"codeGs": "/**\n * 📁 code.gs — AI專題報告 ‧ 同儕評分系統（後端）\n *\n * 資安原則：本檔案「不含」任何 Google Sheet ID 或 Drive Folder ID。\n * 兩個 ID 一律從 Script Properties 讀取，屬性名稱固定為：\n *   SHEET_ID   → 評分資料所在的 Google 試算表\n *   FOLDER_ID  → 每次繳交自動備份 CSV 的雲端硬碟資料夾\n * 設定位置：Apps Script 編輯器 → 左側齒輪「專案設定」→ 最下方「指令碼屬性」。\n */\n\n// ==================== 1. 常數設定 ====================\n\n/** Script Properties 名稱：程式中所有讀取／寫入屬性都只能引用這裡，避免名稱不一致。 */\nconst PROP_KEYS = Object.freeze({\n  SHEET_ID: 'SHEET_ID',\n  FOLDER_ID: 'FOLDER_ID'\n});\n\nconst SHEET_NAMES = Object.freeze({\n  SUMMARY: '評分總表',   // 第一欄座號、第二欄繳交時間、橫軸第一～第七組\n  DETAIL: '評分明細',    // 每一次繳交的原始紀錄（CRUD 的資料來源）\n  AUTH: '身份驗證'       // 座號、姓名、四位數字身份碼、匿名代碼\n});\n\nconst GROUP_LABELS = ['第一組', '第二組', '第三組', '第四組', '第五組', '第六組', '第七組'];\nconst GROUP_COUNT = GROUP_LABELS.length;\nconst CRITERIA = ['痛點分析與 AI 解方', '思辨與兩難分析', '視覺化概念整合', '簡報規範與呈現'];\nconst MIN_ITEM_SCORE = 1;\nconst MAX_ITEM_SCORE = 3;\nconst DEFAULT_ID_CODE = '1111';\nconst MOCK_SEAT_COUNT = 30;\nconst MOD_LABEL = '⚠️修改分數';\nconst ORIGINAL_LABEL = '原始';\nconst MAX_VERIFY_FAILS = 5;           // 連續驗證失敗上限\nconst VERIFY_LOCK_SECONDS = 600;      // 超過上限後鎖定 10 分鐘\n\nconst SUMMARY_HEADERS = ['評分者座號', '繳交時間'].concat(GROUP_LABELS);\nconst DETAIL_HEADERS = ['紀錄ID', '繳交時間', '評分者座號', '評分者姓名', '組別']\n  .concat(CRITERIA)\n  .concat(['總分', '狀態', '備份檔ID']);\nconst AUTH_HEADERS = ['座號', '姓名', '四位數字身份碼', '匿名代碼'];\n\n/** 評分明細欄位索引（從 0 開始） */\nconst D = Object.freeze({\n  ID: 0, TIME: 1, SEAT: 2, NAME: 3, GROUP: 4,\n  C_START: 5,\n  TOTAL: 5 + CRITERIA.length,\n  STATUS: 6 + CRITERIA.length,\n  FILE: 7 + CRITERIA.length\n});\n\n// ==================== 2. 網頁入口 ====================\n\nfunction doGet() {\n  return HtmlService.createHtmlOutputFromFile('Index')\n    .setTitle('AI專題報告同儕評分系統')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1.0');\n}\n\n// ==================== 3. 設定讀取（Script Properties） ====================\n\n/** 讀取 SHEET_ID 與 FOLDER_ID；缺少時丟出清楚的中文錯誤，前台會以提示框顯示。 */\nfunction getConfig_() {\n  const props = PropertiesService.getScriptProperties();\n  const sheetId = (props.getProperty(PROP_KEYS.SHEET_ID) || '').trim();\n  const folderId = (props.getProperty(PROP_KEYS.FOLDER_ID) || '').trim();\n\n  const missing = [];\n  if (!sheetId) missing.push(PROP_KEYS.SHEET_ID);\n  if (!folderId) missing.push(PROP_KEYS.FOLDER_ID);\n  if (missing.length) {\n    throw new Error('尚未設定指令碼屬性 ' + missing.join('、') +\n      '，請至 Apps Script「專案設定 → 指令碼屬性」新增（名稱需完全一致、大小寫相同）。');\n  }\n  return { sheetId: sheetId, folderId: folderId };\n}\n\nfunction getSpreadsheet_() {\n  const config = getConfig_();\n  try {\n    return SpreadsheetApp.openById(config.sheetId);\n  } catch (e) {\n    throw new Error('無法開啟 ' + PROP_KEYS.SHEET_ID + ' 指向的試算表，請確認 ID 正確且部署者有編輯權限。（' + e.message + '）');\n  }\n}\n\nfunction getFolder_() {\n  const config = getConfig_();\n  try {\n    return DriveApp.getFolderById(config.folderId);\n  } catch (e) {\n    throw new Error('無法開啟 ' + PROP_KEYS.FOLDER_ID + ' 指向的資料夾，請確認 ID 正確且部署者有編輯權限。（' + e.message + '）');\n  }\n}\n\n// ==================== 4. 前台呼叫的公開函式（CRUD） ====================\n\n/** 【Read】網頁載入時呼叫：檢查設定 → 自動偵測並建立缺少的分頁與模擬資料 → 回傳即時數據 */\nfunction getInitialData() {\n  const ss = getSpreadsheet_();\n  getFolder_(); // 提早檢查 FOLDER_ID 是否有效\n  ensureSheets_(ss);\n  return {\n    groups: GROUP_LABELS,\n    criteria: CRITERIA,\n    stats: buildLiveStats_(ss)\n  };\n}\n\n/** 【Read】前台定時刷新即時數據 */\nfunction getLiveStats() {\n  const ss = getSpreadsheet_();\n  ensureSheets_(ss);\n  return buildLiveStats_(ss);\n}\n\n/** 驗證座號與四位數字身份碼，成功時回傳本人姓名（只回給本人） */\nfunction verifyIdentity(seat, code) {\n  const ss = getSpreadsheet_();\n  ensureSheets_(ss);\n  const person = verifyIdentity_(ss, seat, code);\n  return { ok: true, seat: person.seat, name: person.name };\n}\n\n/**\n * 【Create / Update】送出評分。\n * - 同座號重複評同一組且尚未確認 → 回傳 DUPLICATE，由前台跳出確認視窗。\n * - 確認後不覆寫舊資料，新增一筆「⚠️修改分數」紀錄，並在總表該座號的下一列標示。\n */\nfunction submitScore(payload) {\n  payload = payload || {};\n  const ss = getSpreadsheet_();\n  ensureSheets_(ss);\n  const person = verifyIdentity_(ss, payload.seat, payload.code);\n\n  const group = Number(payload.group);\n  if (!Number.isInteger(group) || group \u003c 1 || group > GROUP_COUNT) {\n    throw new Error('請選擇正確的評核組別。');\n  }\n  const scores = (payload.scores || []).map(Number);\n  if (scores.length !== CRITERIA.length ||\n      scores.some(function (s) { return !Number.isInteger(s) || s \u003c MIN_ITEM_SCORE || s > MAX_ITEM_SCORE; })) {\n    throw new Error('請完成所有評分面向（每項 ' + MIN_ITEM_SCORE + '～' + MAX_ITEM_SCORE + ' 分）。');\n  }\n  const name = person.name || String(payload.name || '').trim().slice(0, 30);\n  if (!name) throw new Error('請輸入評分同學姓名。');\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    const detailSheet = ss.getSheetByName(SHEET_NAMES.DETAIL);\n    const existing = readDetails_(detailSheet).filter(function (r) {\n      return r.seat === person.seat && r.group === group;\n    });\n\n    if (existing.length && payload.confirmed !== true) {\n      return {\n        status: 'DUPLICATE',\n        group: group,\n        groupLabel: GROUP_LABELS[group - 1],\n        previousTotal: existing[existing.length - 1].total\n      };\n    }\n\n    const now = new Date();\n    const total = scores.reduce(function (a, b) { return a + b; }, 0);\n    const isModification = existing.length > 0;\n    const record = {\n      id: newRecordId_(),\n      time: now,\n      seat: person.seat,\n      name: name,\n      group: group,\n      scores: scores,\n      total: total,\n      status: isModification ? MOD_LABEL : ORIGINAL_LABEL\n    };\n\n    let warning = '';\n    let fileId = '';\n    try {\n      fileId = saveBackupCsv_(record);\n    } catch (e) {\n      warning = '評分已寫入試算表，但備份檔未能存入雲端資料夾：' + e.message;\n    }\n\n    detailSheet.appendRow([record.id, record.time, record.seat, record.name, record.group]\n      .concat(record.scores)\n      .concat([record.total, record.status, fileId]));\n    SpreadsheetApp.flush();\n    rebuildSummary_(ss);\n\n    return {\n      status: 'OK',\n      isModification: isModification,\n      groupLabel: GROUP_LABELS[group - 1],\n      total: total,\n      warning: warning,\n      stats: buildLiveStats_(ss)\n    };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/** 【Read】讀取本人的評分紀錄（需身份碼） */\nfunction getMyRecords(seat, code) {\n  const ss = getSpreadsheet_();\n  ensureSheets_(ss);\n  const person = verifyIdentity_(ss, seat, code);\n  return listRecordsOfSeat_(ss, person.seat);\n}\n\n/** 【Delete】刪除本人的一筆紀錄（需身份碼），並將雲端備份檔移到垃圾桶 */\nfunction deleteMyRecord(seat, code, recordId) {\n  const ss = getSpreadsheet_();\n  ensureSheets_(ss);\n  const person = verifyIdentity_(ss, seat, code);\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    const detailSheet = ss.getSheetByName(SHEET_NAMES.DETAIL);\n    const target = readDetails_(detailSheet).filter(function (r) { return r.id === String(recordId); })[0];\n    if (!target) throw new Error('找不到這筆紀錄，可能已被刪除。');\n    if (target.seat !== person.seat) throw new Error('只能刪除自己的評分紀錄。');\n\n    if (target.fileId) {\n      try { DriveApp.getFileById(target.fileId).setTrashed(true); } catch (e) { /* 備份檔不存在時略過 */ }\n    }\n    detailSheet.deleteRow(target.row);\n    SpreadsheetApp.flush();\n    rebuildSummary_(ss);\n\n    return { ok: true, records: listRecordsOfSeat_(ss, person.seat), stats: buildLiveStats_(ss) };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n// ==================== 5. 自動建立分頁與模擬資料 ====================\n\n/** 自動偵測：缺少任何分頁就建立並填入模擬資料（不需手動按「執行」） */\nfunction ensureSheets_(ss) {\n  const allExist = Object.keys(SHEET_NAMES).every(function (k) { return ss.getSheetByName(SHEET_NAMES[k]); });\n  if (allExist) return;\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(20000);\n  try {\n    let created = false;\n    if (!ss.getSheetByName(SHEET_NAMES.AUTH)) { createAuthSheet_(ss); created = true; }\n    if (!ss.getSheetByName(SHEET_NAMES.DETAIL)) { createDetailSheet_(ss); created = true; }\n    if (!ss.getSheetByName(SHEET_NAMES.SUMMARY)) { createSummarySheet_(ss); created = true; }\n    if (created) {\n      SpreadsheetApp.flush();\n      rebuildSummary_(ss);\n    }\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction createAuthSheet_(ss) {\n  const sheet = ss.insertSheet(SHEET_NAMES.AUTH);\n  styleHeader_(sheet, AUTH_HEADERS);\n  sheet.getRange(2, 3, MOCK_SEAT_COUNT, 1).setNumberFormat('@'); // 身份碼以文字保存，避免開頭 0 消失\n\n  const used = {};\n  const rows = [];\n  for (let seat = 1; seat \u003c= MOCK_SEAT_COUNT; seat++) {\n    rows.push([seat, '同學' + pad2_(seat), DEFAULT_ID_CODE, generateAnonCode_(used)]);\n  }\n  sheet.getRange(2, 1, rows.length, AUTH_HEADERS.length).setValues(rows);\n  sheet.setColumnWidth(3, 130);\n  return sheet;\n}\n\nfunction createDetailSheet_(ss) {\n  const sheet = ss.insertSheet(SHEET_NAMES.DETAIL);\n  styleHeader_(sheet, DETAIL_HEADERS);\n\n  const names = {};\n  const auth = getAuthData_(ss);\n  Object.keys(auth).forEach(function (s) { names[s] = auth[s].name; });\n\n  const now = Date.now();\n  const mock = [\n    // [座號, 組別, 四項分數, 幾分鐘前]\n    [1, 1, [3, 2, 3, 2], 50],\n    [1, 2, [2, 2, 2, 3], 45],\n    [2, 1, [3, 3, 2, 3], 40],\n    [3, 3, [2, 1, 2, 2], 30],\n    [4, 5, [3, 3, 3, 3], 20],\n    [1, 1, [3, 3, 3, 2], 10]   // 座號 1 修改第一組 → 示範「⚠️修改分數」\n  ];\n  const rows = mock.map(function (m, i) {\n    const total = m[2].reduce(function (a, b) { return a + b; }, 0);\n    return ['MOCK' + (i + 1), new Date(now - m[3] * 60000), m[0], names[m[0]] || ('同學' + pad2_(m[0])), m[1]]\n      .concat(m[2])\n      .concat([total, '', '']);\n  });\n  sheet.getRange(2, 1, rows.length, DETAIL_HEADERS.length).setValues(rows);\n  sheet.getRange(2, D.TIME + 1, rows.length, 1).setNumberFormat('yyyy/mm/dd hh:mm:ss');\n  return sheet;\n}\n\nfunction createSummarySheet_(ss) {\n  const sheet = ss.insertSheet(SHEET_NAMES.SUMMARY, 0);\n  styleHeader_(sheet, SUMMARY_HEADERS);\n  sheet.setColumnWidth(1, 100);\n  sheet.setColumnWidth(2, 160);\n  return sheet;\n}\n\nfunction styleHeader_(sheet, headers) {\n  sheet.getRange(1, 1, 1, headers.length)\n    .setValues([headers])\n    .setFontWeight('bold')\n    .setBackground('#1d4ed8')\n    .setFontColor('#ffffff')\n    .setHorizontalAlignment('center');\n  sheet.setFrozenRows(1);\n}\n\n// ==================== 6. 總表重建 ====================\n\n/**\n * 依「評分明細」重建「評分總表」：\n * 第一欄座號、第二欄繳交時間、橫軸第一～第七組。\n * 同一座號重複評同一組時，第二次之後的分數放在該座號的下一列，標示「⚠️修改分數：X」。\n */\nfunction rebuildSummary_(ss) {\n  const detailSheet = ss.getSheetByName(SHEET_NAMES.DETAIL);\n  const summary = ss.getSheetByName(SHEET_NAMES.SUMMARY);\n  const records = readDetails_(detailSheet);\n\n  // 依座號 → 組別 → 時間 分組，同時重新判定每筆紀錄是原始或修改\n  const bySeat = {};\n  records.slice().sort(function (a, b) { return a.time - b.time; }).forEach(function (r) {\n    bySeat[r.seat] = bySeat[r.seat] || {};\n    bySeat[r.seat][r.group] = bySeat[r.seat][r.group] || [];\n    r.status = bySeat[r.seat][r.group].length ? MOD_LABEL : ORIGINAL_LABEL;\n    bySeat[r.seat][r.group].push(r);\n  });\n\n  // 回寫明細的「狀態」欄（刪除紀錄後狀態可能改變）\n  const dataRows = Math.max(detailSheet.getLastRow() - 1, 0);\n  if (dataRows) {\n    const statusRange = detailSheet.getRange(2, D.STATUS + 1, dataRows, 1);\n    const statuses = statusRange.getValues();\n    records.forEach(function (r) { statuses[r.row - 2][0] = r.status; });\n    statusRange.setValues(statuses);\n  }\n\n  const values = [];\n  const notes = [];\n  const backgrounds = [];\n  Object.keys(bySeat).map(Number).sort(function (a, b) { return a - b; }).forEach(function (seat) {\n    const groups = bySeat[seat];\n    const depth = Math.max.apply(null, Object.keys(groups).map(function (g) { return groups[g].length; }));\n    for (let k = 0; k \u003c depth; k++) {\n      const row = [seat, ''];\n      const noteRow = ['', ''];\n      const bgRow = [null, null];\n      let latest = null;\n      for (let g = 1; g \u003c= GROUP_COUNT; g++) {\n        const rec = groups[g] && groups[g][k];\n        if (!rec) { row.push(''); noteRow.push(''); bgRow.push(null); continue; }\n        if (!latest || rec.time > latest) latest = rec.time;\n        row.push(k === 0 ? rec.total : MOD_LABEL + '：' + rec.total);\n        noteRow.push('繳交時間：' + formatTime_(rec.time) + '\\n' +\n          CRITERIA.map(function (c, i) { return c + '：' + rec.scores[i]; }).join('\\n'));\n        bgRow.push(k === 0 ? null : '#fef3c7');\n      }\n      row[1] = latest || '';\n      values.push(row);\n      notes.push(noteRow);\n      backgrounds.push(bgRow);\n    }\n  });\n\n  const lastRow = summary.getLastRow();\n  if (lastRow > 1) {\n    const old = summary.getRange(2, 1, lastRow - 1, SUMMARY_HEADERS.length);\n    old.clearContent();\n    old.clearNote();\n    old.setBackground(null);\n  }\n  if (values.length) {\n    const range = summary.getRange(2, 1, values.length, SUMMARY_HEADERS.length);\n    range.setValues(values);\n    range.setNotes(notes);\n    range.setBackgrounds(backgrounds);\n    range.setHorizontalAlignment('center');\n    summary.getRange(2, 2, values.length, 1).setNumberFormat('yyyy/mm/dd hh:mm:ss');\n  }\n}\n\n// ==================== 7. 即時數據（匿名） ====================\n\n/** 前台即時數據：不含座號與姓名，評分者一律以隨機匿名代碼呈現 */\nfunction buildLiveStats_(ss) {\n  const records = readDetails_(ss.getSheetByName(SHEET_NAMES.DETAIL));\n  const auth = getAuthData_(ss);\n\n  // 每位評分者對每組只採計最新一次分數\n  const latest = {};\n  records.forEach(function (r) {\n    const key = r.seat + '_' + r.group;\n    if (!latest[key] || r.time > latest[key].time) latest[key] = r;\n  });\n\n  const groups = GROUP_LABELS.map(function (label, i) { return { group: i + 1, label: label, count: 0, sum: 0 }; });\n  Object.keys(latest).forEach(function (k) {\n    const r = latest[k];\n    const g = groups[r.group - 1];\n    if (g) { g.count++; g.sum += r.total; }\n  });\n  groups.forEach(function (g) {\n    g.average = g.count ? Math.round(g.sum / g.count * 100) / 100 : 0;\n    delete g.sum;\n  });\n\n  const feed = records.slice()\n    .sort(function (a, b) { return b.time - a.time; })\n    .slice(0, 15)\n    .map(function (r) {\n      return {\n        code: (auth[r.seat] && auth[r.seat].anon) || 'R-????',\n        groupLabel: GROUP_LABELS[r.group - 1] || '',\n        total: r.total,\n        time: formatTime_(r.time, 'MM/dd HH:mm'),\n        isModification: r.status === MOD_LABEL\n      };\n    });\n\n  return {\n    groups: groups,\n    feed: feed,\n    totalSubmissions: records.length,\n    maxTotal: CRITERIA.length * MAX_ITEM_SCORE,\n    updatedAt: formatTime_(new Date(), 'HH:mm:ss')\n  };\n}\n\n// ==================== 8. 資料讀取與驗證工具 ====================\n\n/** 讀取評分明細，回傳物件陣列（含所在列號 row） */\nfunction readDetails_(sheet) {\n  const lastRow = sheet.getLastRow();\n  if (lastRow \u003c 2) return [];\n  const values = sheet.getRange(2, 1, lastRow - 1, DETAIL_HEADERS.length).getValues();\n  const list = [];\n  values.forEach(function (v, i) {\n    if (v[D.ID] === '' || v[D.SEAT] === '') return;\n    const time = v[D.TIME] instanceof Date ? v[D.TIME] : new Date(v[D.TIME]);\n    list.push({\n      row: i + 2,\n      id: String(v[D.ID]),\n      time: time,\n      seat: Number(v[D.SEAT]),\n      name: String(v[D.NAME]),\n      group: Number(v[D.GROUP]),\n      scores: v.slice(D.C_START, D.C_START + CRITERIA.length).map(Number),\n      total: Number(v[D.TOTAL]),\n      status: String(v[D.STATUS] || ''),\n      fileId: String(v[D.FILE] || '')\n    });\n  });\n  return list;\n}\n\n/** 讀取身份驗證分頁；缺匿名代碼的座號會自動補上 */\nfunction getAuthData_(ss) {\n  const sheet = ss.getSheetByName(SHEET_NAMES.AUTH);\n  const map = {};\n  if (!sheet || sheet.getLastRow() \u003c 2) return map;\n\n  const range = sheet.getRange(2, 1, sheet.getLastRow() - 1, AUTH_HEADERS.length);\n  const values = range.getValues();\n  const used = {};\n  values.forEach(function (v) { if (v[3]) used[v[3]] = true; });\n\n  let filled = false;\n  values.forEach(function (v, i) {\n    if (v[0] === '') return;\n    if (!v[3]) { v[3] = generateAnonCode_(used); filled = true; }\n    const seat = Number(v[0]);\n    map[seat] = {\n      seat: seat,\n      row: i + 2,\n      name: String(v[1] || '').trim(),\n      code: normalizeCode_(v[2]),\n      anon: String(v[3])\n    };\n  });\n  if (filled) range.setValues(values);\n  return map;\n}\n\n/** 驗證座號＋身份碼；連續錯誤 5 次鎖定 10 分鐘，防止暴力猜碼 */\nfunction verifyIdentity_(ss, seat, code) {\n  const seatNo = Number(seat);\n  if (!Number.isInteger(seatNo) || seatNo \u003c 1 || seatNo > 999) throw new Error('請輸入正確的座號。');\n  const codeStr = String(code == null ? '' : code).trim();\n  if (!/^\\d{4}$/.test(codeStr)) throw new Error('身份碼必須是四位數字。');\n\n  const cache = CacheService.getScriptCache();\n  const failKey = 'verify_fail_' + seatNo;\n  const fails = Number(cache.get(failKey) || 0);\n  if (fails >= MAX_VERIFY_FAILS) throw new Error('此座號驗證失敗次數過多，請 10 分鐘後再試，或洽老師協助。');\n\n  const person = getAuthData_(ss)[seatNo];\n  if (!person) throw new Error('查無此座號，請確認座號是否正確。');\n  if (person.code !== codeStr) {\n    cache.put(failKey, String(fails + 1), VERIFY_LOCK_SECONDS);\n    throw new Error('身份碼錯誤，請再試一次。（剩餘 ' + (MAX_VERIFY_FAILS - fails - 1) + ' 次機會）');\n  }\n  cache.remove(failKey);\n  return person;\n}\n\nfunction listRecordsOfSeat_(ss, seat) {\n  return readDetails_(ss.getSheetByName(SHEET_NAMES.DETAIL))\n    .filter(function (r) { return r.seat === seat; })\n    .sort(function (a, b) { return b.time - a.time; })\n    .map(function (r) {\n      return {\n        id: r.id,\n        group: r.group,\n        groupLabel: GROUP_LABELS[r.group - 1] || '',\n        scores: r.scores,\n        total: r.total,\n        status: r.status,\n        time: formatTime_(r.time)\n      };\n    });\n}\n\n/** 將評分備份成 CSV 存進 FOLDER_ID 資料夾，回傳檔案 ID */\nfunction saveBackupCsv_(rec) {\n  const folder = getFolder_();\n  const lines = [\n    '﻿評分者座號,評分者姓名,組別,總分,狀態,繳交時間',\n    [pad2_(rec.seat), csvCell_(rec.name), GROUP_LABELS[rec.group - 1], rec.total, rec.status, formatTime_(rec.time)].join(','),\n    '',\n    '面向,分數'\n  ].concat(CRITERIA.map(function (c, i) { return csvCell_(c) + ',' + rec.scores[i]; }));\n  const fileName = pad2_(rec.seat) + '_' + rec.name + '_' + GROUP_LABELS[rec.group - 1] + '_' +\n    formatTime_(rec.time, 'yyyyMMdd_HHmmss') + '.csv';\n  return folder.createFile(fileName, lines.join('\\n'), MimeType.CSV).getId();\n}\n\n// ==================== 9. 小工具 ====================\n\nfunction generateAnonCode_(used) {\n  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';\n  let code;\n  do {\n    code = 'R-';\n    for (let i = 0; i \u003c 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));\n  } while (used[code]);\n  used[code] = true;\n  return code;\n}\n\nfunction newRecordId_() {\n  return 'R' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase();\n}\n\nfunction normalizeCode_(v) {\n  const s = String(v == null ? '' : v).trim();\n  return /^\\d{1,4}$/.test(s) ? ('0000' + s).slice(-4) : s;\n}\n\nfunction formatTime_(date, pattern) {\n  return Utilities.formatDate(date, Session.getScriptTimeZone(), pattern || 'yyyy/MM/dd HH:mm:ss');\n}\n\nfunction pad2_(n) {\n  return ('0' + n).slice(-2);\n}\n\nfunction csvCell_(s) {\n  s = String(s);\n  return /[\",\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s;\n}\n", "indexHtml": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-TW\">\n\u003chead>\n    \u003c!-- 🧑‍💻 Index — AI專題報告 ‧ 同儕評分系統（前台） -->\n    \u003cbase target=\"_top\">\n    \u003cmeta charset=\"UTF-8\">\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    \u003ctitle>AI專題報告同儕評分系統\u003c/title>\n    \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n    \u003cstyle>\n        body { font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif; }\n        .radio-card { transition: all 0.25s ease-in-out; }\n        .highlight-green { color: #059669; background-color: #d1fae5; padding: 0.1rem 0.25rem; border-radius: 0.25rem; font-weight: 700; }\n        .highlight-orange { color: #d97706; background-color: #fef3c7; padding: 0.1rem 0.25rem; border-radius: 0.25rem; font-weight: 700; }\n        .highlight-red { color: #e11d48; background-color: #ffe4e6; padding: 0.1rem 0.25rem; border-radius: 0.25rem; font-weight: 700; }\n        .bar { transition: width 0.6s ease; }\n        .spinner { border: 3px solid rgba(30,58,138,.2); border-top-color: #1e3a8a; border-radius: 50%; width: 1.1rem; height: 1.1rem; animation: spin .8s linear infinite; display: inline-block; }\n        @keyframes spin { to { transform: rotate(360deg); } }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"bg-blue-50 py-8 px-4 md:px-8\">\n    \u003cdiv class=\"max-w-5xl mx-auto\">\n        \u003cdiv id=\"previewBanner\" class=\"hidden mb-4 rounded-xl bg-amber-100 border border-amber-300 text-amber-900 px-4 py-3 text-sm font-medium\">\n            🧪 本地預覽模式：目前使用模擬測試資料（身份碼皆為 1111），部署到 GAS 後會自動連線到 Google Sheet。\n        \u003c/div>\n\n        \u003cdiv class=\"bg-gradient-to-r from-blue-700 to-blue-400 rounded-t-2xl p-8 shadow-lg text-white text-center\">\n            \u003ch1 class=\"text-3xl md:text-4xl font-extrabold mb-2 tracking-wide\">AI專題報告 ‧ 同儕評分系統\u003c/h1>\n            \u003cp class=\"text-blue-100 font-medium\">請點選各面向中最符合小組表現的敘述，系統將自動計分。\u003c/p>\n        \u003c/div>\n\n        \u003cform id=\"gradingForm\" class=\"bg-white rounded-b-2xl shadow-xl p-6 md:p-10 space-y-8\" onsubmit=\"return false;\">\n            \u003cdiv class=\"bg-blue-50/60 p-6 rounded-xl border border-blue-200 grid grid-cols-1 md:grid-cols-3 gap-6 shadow-sm\">\n                \u003cdiv>\n                    \u003clabel for=\"raterSeat\" class=\"block text-sm font-bold text-blue-900 mb-2\">評分者座號 \u003cspan class=\"text-red-500\">*\u003c/span>\u003c/label>\n                    \u003cinput type=\"number\" id=\"raterSeat\" required min=\"1\" placeholder=\"例如: 5\"\n                        class=\"w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800\">\n                    \u003cp id=\"verifyStatus\" class=\"mt-2 text-sm font-bold text-gray-500\">🔒 輸入座號後需驗證身份碼\u003c/p>\n                \u003c/div>\n                \u003cdiv>\n                    \u003clabel for=\"raterName\" class=\"block text-sm font-bold text-blue-900 mb-2\">評分同學姓名 \u003cspan class=\"text-red-500\">*\u003c/span>\u003c/label>\n                    \u003cinput type=\"text\" id=\"raterName\" required placeholder=\"驗證後自動帶入\"\n                        class=\"w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800\">\n                \u003c/div>\n                \u003cdiv>\n                    \u003clabel for=\"targetGroup\" class=\"block text-sm font-bold text-blue-900 mb-2\">評核組別 \u003cspan class=\"text-red-500\">*\u003c/span>\u003c/label>\n                    \u003cselect id=\"targetGroup\" required class=\"w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium text-gray-800 bg-white cursor-pointer\">\n                        \u003coption value=\"\" disabled selected>請選擇組別 ▼\u003c/option>\n                        \u003coption value=\"1\">第一組\u003c/option>\u003coption value=\"2\">第二組\u003c/option>\u003coption value=\"3\">第三組\u003c/option>\n                        \u003coption value=\"4\">第四組\u003c/option>\u003coption value=\"5\">第五組\u003c/option>\u003coption value=\"6\">第六組\u003c/option>\u003coption value=\"7\">第七組\u003c/option>\n                    \u003c/select>\n                \u003c/div>\n            \u003c/div>\n\n            \u003cdiv id=\"editingBanner\" class=\"hidden rounded-xl bg-amber-50 border border-amber-300 text-amber-900 px-4 py-3 font-bold flex items-center justify-between gap-4\">\n                \u003cspan id=\"editingText\">\u003c/span>\n                \u003cbutton type=\"button\" onclick=\"resetFormAfterSubmit()\" class=\"text-sm underline\">取消修改\u003c/button>\n            \u003c/div>\n\n            \u003cdiv id=\"criteriaContainer\" class=\"space-y-8\">\u003c/div>\n\n            \u003cdiv class=\"mt-10 p-6 bg-blue-900 text-white rounded-xl flex flex-col md:flex-row justify-between items-center shadow-inner border-t-4 border-blue-400 gap-6\">\n                \u003cdiv class=\"flex items-center space-x-4\">\n                    \u003cspan class=\"text-2xl font-bold tracking-wider\">小組總評分\u003c/span>\n                    \u003cdiv class=\"flex items-baseline space-x-2\">\n                        \u003cspan id=\"totalScore\" class=\"text-5xl font-extrabold text-yellow-400\">0\u003c/span>\n                        \u003cspan class=\"text-xl text-blue-200 font-bold\">/ 12\u003c/span>\n                    \u003c/div>\n                \u003c/div>\n                \u003cbutton type=\"button\" id=\"submitBtn\" onclick=\"submitForm()\"\n                    class=\"w-full md:w-auto px-8 py-4 bg-yellow-400 hover:bg-yellow-300 text-blue-900 font-extrabold text-lg rounded-lg shadow-lg transform hover:-translate-y-1 transition-all disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none\">\n                    📤 送出評分\n                \u003c/button>\n            \u003c/div>\n        \u003c/form>\n\n        \u003c!-- 我的評分紀錄（CRUD：讀取／修改／刪除，需身份驗證） -->\n        \u003csection id=\"myRecordsSection\" class=\"hidden mt-8 bg-white rounded-2xl shadow-xl p-6 md:p-8\">\n            \u003ch2 class=\"font-extrabold text-2xl text-blue-900 border-l-4 border-blue-500 pl-3 mb-4\">📋 我的評分紀錄\u003c/h2>\n            \u003cdiv id=\"myRecords\" class=\"space-y-3\">\u003c/div>\n        \u003c/section>\n\n        \u003c!-- 即時數據（匿名） -->\n        \u003csection class=\"mt-8 bg-white rounded-2xl shadow-xl p-6 md:p-8\">\n            \u003cdiv class=\"flex flex-wrap items-baseline justify-between gap-2 mb-6\">\n                \u003ch2 class=\"font-extrabold text-2xl text-blue-900 border-l-4 border-blue-500 pl-3\">📊 即時評分數據\u003c/h2>\n                \u003cspan class=\"text-sm text-gray-500\">共 \u003cb id=\"totalSubmissions\">0\u003c/b> 筆繳交 ‧ 更新於 \u003cspan id=\"updatedAt\">--\u003c/span>\u003c/span>\n            \u003c/div>\n            \u003cdiv id=\"groupStats\" class=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\u003c/div>\n            \u003ch3 class=\"font-bold text-lg text-blue-900 mt-8 mb-3\">最新繳交動態 \u003cspan class=\"text-sm font-medium text-gray-500\">（評分者以隨機代碼顯示）\u003c/span>\u003c/h3>\n            \u003cdiv class=\"overflow-x-auto\">\n                \u003ctable class=\"w-full text-sm text-left\">\n                    \u003cthead class=\"bg-blue-50 text-blue-900\">\n                        \u003ctr>\u003cth class=\"px-3 py-2\">匿名代碼\u003c/th>\u003cth class=\"px-3 py-2\">組別\u003c/th>\u003cth class=\"px-3 py-2\">總分\u003c/th>\u003cth class=\"px-3 py-2\">時間\u003c/th>\u003cth class=\"px-3 py-2\">狀態\u003c/th>\u003c/tr>\n                    \u003c/thead>\n                    \u003ctbody id=\"feedBody\">\u003c/tbody>\n                \u003c/table>\n            \u003c/div>\n        \u003c/section>\n    \u003c/div>\n\n    \u003c!-- 身份碼驗證視窗 -->\n    \u003cdiv id=\"idModal\" class=\"fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 px-4\">\n        \u003cdiv class=\"bg-white rounded-2xl p-8 max-w-sm w-full text-center\">\n            \u003ch3 class=\"text-2xl font-bold mb-2 text-blue-900\">🔐 身份驗證\u003c/h3>\n            \u003cp class=\"text-gray-600 mb-5\">座號 \u003cb id=\"idModalSeat\">\u003c/b>，請輸入四位數字身份碼\u003c/p>\n            \u003cinput type=\"password\" id=\"idCodeInput\" inputmode=\"numeric\" maxlength=\"4\" autocomplete=\"off\"\n                class=\"w-full text-center tracking-[0.6em] text-2xl font-bold px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-2\">\n            \u003cp id=\"idModalError\" class=\"text-sm font-bold text-rose-600 min-h-[1.25rem] mb-3\">\u003c/p>\n            \u003cbutton type=\"button\" id=\"idConfirmBtn\" onclick=\"confirmIdentity()\" class=\"block w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg mb-3\">確認\u003c/button>\n            \u003cbutton type=\"button\" onclick=\"cancelIdentity()\" class=\"w-full py-3 bg-gray-100 text-gray-700 font-bold rounded-lg\">取消\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 重複評分確認視窗 -->\n    \u003cdiv id=\"confirmModal\" class=\"fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 px-4\">\n        \u003cdiv class=\"bg-white rounded-2xl p-8 max-w-md w-full text-center\">\n            \u003ch3 class=\"text-2xl font-bold mb-3 text-amber-600\">⚠️ 重複評分提醒\u003c/h3>\n            \u003cp class=\"text-gray-700 mb-2 font-bold\">您已經評過分數，請確認是否修改您的評分\u003c/p>\n            \u003cp id=\"confirmDetail\" class=\"text-sm text-gray-500 mb-6\">\u003c/p>\n            \u003cbutton type=\"button\" onclick=\"confirmModification()\" class=\"block w-full py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg mb-3\">確定\u003c/button>\n            \u003cbutton type=\"button\" onclick=\"closeModal('confirmModal')\" class=\"w-full py-3 bg-gray-100 text-gray-700 font-bold rounded-lg\">取消\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003c!-- 訊息視窗 -->\n    \u003cdiv id=\"messageModal\" class=\"fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 px-4\">\n        \u003cdiv class=\"bg-white rounded-2xl p-8 max-w-lg w-full text-center\">\n            \u003ch3 id=\"messageTitle\" class=\"text-2xl font-bold mb-4\">\u003c/h3>\n            \u003cp id=\"messageBody\" class=\"text-gray-600 mb-6 whitespace-pre-line\">\u003c/p>\n            \u003cbutton type=\"button\" onclick=\"closeModal('messageModal')\" class=\"w-full py-3 bg-blue-600 text-white font-bold rounded-lg\">關閉\u003c/button>\n        \u003c/div>\n    \u003c/div>\n\n    \u003cscript>\n        // ==================== 評分面向（沿用原本內容） ====================\n        const criteria = [\n            { id: 'c1', name: '1. 痛點分析與 AI 解方', levels: [\n                { score: 3, title: '優', desc: '明確定義\u003cspan class=\"highlight-green\">具體產業痛點\u003c/span>，並論證AI如何\u003cspan class=\"highlight-green\">觸發解決\u003c/span>。' },\n                { score: 2, title: '可', desc: '提出AI功能，但對\u003cspan class=\"highlight-orange\">痛點對應關係闡述較模糊\u003c/span>。' },\n                { score: 1, title: '需加強', desc: '僅能籠統說明，\u003cspan class=\"highlight-red\">無法指出對應痛點\u003c/span>。' }\n            ]},\n            { id: 'c2', name: '2. 思辨與兩難分析', levels: [\n                { score: 3, title: '優', desc: '深入解析兩難，提出\u003cspan class=\"highlight-green\">具創新性第三方案\u003c/span>。' },\n                { score: 2, title: '可', desc: '能辨識兩難，但\u003cspan class=\"highlight-orange\">方案細節不足\u003c/span>。' },\n                { score: 1, title: '需加強', desc: '\u003cspan class=\"highlight-red\">無法呈現兩難衝突\u003c/span>。' }\n            ]},\n            { id: 'c3', name: '3. 視覺化概念整合', levels: [\n                { score: 3, title: '優', desc: '原創圖表，\u003cspan class=\"highlight-green\">無需解釋即可理解\u003c/span>。' },\n                { score: 2, title: '可', desc: '有圖表，但\u003cspan class=\"highlight-orange\">視覺輔助效果有限\u003c/span>。' },\n                { score: 1, title: '需加強', desc: '\u003cspan class=\"highlight-red\">未使用視覺化工具\u003c/span>。' }\n            ]},\n            { id: 'c4', name: '4. 簡報規範與呈現', levels: [\n                { score: 3, title: '優', desc: '排版專業，能在\u003cspan class=\"highlight-green\">5分鐘內精準完成\u003c/span>。' },\n                { score: 2, title: '可', desc: '必要元素齊全，但\u003cspan class=\"highlight-orange\">時間掌控失衡\u003c/span>。' },\n                { score: 1, title: '需加強', desc: '\u003cspan class=\"highlight-red\">嚴重偏離規範\u003c/span>。' }\n            ]}\n        ];\n        const GROUP_LABELS = ['第一組', '第二組', '第三組', '第四組', '第五組', '第六組', '第七組'];\n        const CARD_BASE = 'radio-card p-5 border-2 border-gray-200 rounded-xl cursor-pointer bg-gray-50 flex flex-col h-full group';\n        const CARD_ACTIVE = 'radio-card p-5 border-2 border-blue-500 rounded-xl cursor-pointer bg-blue-50 ring-2 ring-blue-400 flex flex-col h-full group';\n        const BADGE_BASE = 'bg-gray-200 text-gray-700 text-sm font-bold px-3 py-1 rounded-full';\n        const BADGE_ACTIVE = 'bg-blue-600 text-white text-sm font-bold px-3 py-1 rounded-full';\n        const REFRESH_MS = 30000;\n\n        // 身份資料只存在記憶體，不寫入瀏覽器儲存空間\n        const state = { verified: false, seat: null, code: null, pendingPayload: null, submitting: false, myRecords: [] };\n\n        // ==================== GAS / 本地預覽 連線切換 ====================\n        // 非 GAS 環境（例如直接用瀏覽器打開檔案）沒有 google 物件，改用模擬資料，避免「google is not defined」。\n        const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;\n\n        function callServer(fnName, ...args) {\n            if (IS_GAS) {\n                return new Promise((resolve, reject) => {\n                    google.script.run\n                        .withSuccessHandler(resolve)\n                        .withFailureHandler(err => reject(err instanceof Error ? err : new Error(String(err && err.message || err))))\n                        [fnName](...args);\n                });\n            }\n            return new Promise((resolve, reject) => {\n                setTimeout(() => {\n                    try { resolve(JSON.parse(JSON.stringify(MockServer[fnName](...args)))); }\n                    catch (e) { reject(e); }\n                }, 250);\n            });\n        }\n\n        // ==================== 本地預覽用的模擬後端 ====================\n        const MockServer = (() => {\n            const MOD = '⚠️修改分數';\n            const pad = n => String(n).padStart(2, '0');\n            const anonChars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';\n            const randAnon = () => 'R-' + Array.from({ length: 4 }, () => anonChars[Math.floor(Math.random() * anonChars.length)]).join('');\n            const auth = {};\n            for (let s = 1; s \u003c= 30; s++) auth[s] = { name: '同學' + pad(s), code: '1111', anon: randAnon() };\n            const now = Date.now();\n            let seq = 0;\n            const mk = (seat, group, scores, minsAgo) => ({ id: 'MOCK' + (++seq), time: now - minsAgo * 60000, seat, group, scores, total: scores.reduce((a, b) => a + b, 0) });\n            let records = [mk(1, 1, [3, 2, 3, 2], 50), mk(1, 2, [2, 2, 2, 3], 45), mk(2, 1, [3, 3, 2, 3], 40), mk(3, 3, [2, 1, 2, 2], 30), mk(4, 5, [3, 3, 3, 3], 20), mk(1, 1, [3, 3, 3, 2], 10)];\n\n            const fmt = (t, short) => {\n                const d = new Date(t), p = n => String(n).padStart(2, '0');\n                const md = `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;\n                return short ? md : `${d.getFullYear()}/${md}:${p(d.getSeconds())}`;\n            };\n            const statusOf = r => records.filter(x => x.seat === r.seat && x.group === r.group && x.time \u003c r.time).length ? MOD : '原始';\n            const verify = (seat, code) => {\n                const p = auth[Number(seat)];\n                if (!/^\\d{4}$/.test(String(code))) throw new Error('身份碼必須是四位數字。');\n                if (!p) throw new Error('查無此座號，請確認座號是否正確。');\n                if (p.code !== String(code)) throw new Error('身份碼錯誤，請再試一次。');\n                return { seat: Number(seat), ...p };\n            };\n            const stats = () => {\n                const latest = {};\n                records.forEach(r => { const k = r.seat + '_' + r.group; if (!latest[k] || r.time > latest[k].time) latest[k] = r; });\n                const groups = GROUP_LABELS.map((label, i) => ({ group: i + 1, label, count: 0, sum: 0 }));\n                Object.values(latest).forEach(r => { groups[r.group - 1].count++; groups[r.group - 1].sum += r.total; });\n                groups.forEach(g => { g.average = g.count ? Math.round(g.sum / g.count * 100) / 100 : 0; delete g.sum; });\n                const feed = [...records].sort((a, b) => b.time - a.time).slice(0, 15).map(r => ({\n                    code: auth[r.seat].anon, groupLabel: GROUP_LABELS[r.group - 1], total: r.total, time: fmt(r.time, true), isModification: statusOf(r) === MOD\n                }));\n                return { groups, feed, totalSubmissions: records.length, maxTotal: 12, updatedAt: new Date().toLocaleTimeString('zh-TW', { hour12: false }) };\n            };\n            const mine = seat => records.filter(r => r.seat === seat).sort((a, b) => b.time - a.time)\n                .map(r => ({ id: r.id, group: r.group, groupLabel: GROUP_LABELS[r.group - 1], scores: r.scores, total: r.total, status: statusOf(r), time: fmt(r.time) }));\n\n            return {\n                getInitialData: () => ({ groups: GROUP_LABELS, stats: stats() }),\n                getLiveStats: () => stats(),\n                verifyIdentity: (seat, code) => { const p = verify(seat, code); return { ok: true, seat: p.seat, name: p.name }; },\n                submitScore: payload => {\n                    const p = verify(payload.seat, payload.code);\n                    const group = Number(payload.group);\n                    const existing = records.filter(r => r.seat === p.seat && r.group === group);\n                    if (existing.length && payload.confirmed !== true) {\n                        return { status: 'DUPLICATE', group, groupLabel: GROUP_LABELS[group - 1], previousTotal: existing[existing.length - 1].total };\n                    }\n                    const rec = mk(p.seat, group, payload.scores.map(Number), 0);\n                    rec.time = Date.now();\n                    records.push(rec);\n                    return { status: 'OK', isModification: existing.length > 0, groupLabel: GROUP_LABELS[group - 1], total: rec.total, warning: '', stats: stats() };\n                },\n                getMyRecords: (seat, code) => mine(verify(seat, code).seat),\n                deleteMyRecord: (seat, code, id) => {\n                    const p = verify(seat, code);\n                    const target = records.find(r => r.id === id);\n                    if (!target) throw new Error('找不到這筆紀錄，可能已被刪除。');\n                    if (target.seat !== p.seat) throw new Error('只能刪除自己的評分紀錄。');\n                    records = records.filter(r => r.id !== id);\n                    return { ok: true, records: mine(p.seat), stats: stats() };\n                }\n            };\n        })();\n\n        // ==================== 畫面：評分卡片 ====================\n        function renderCriteria() {\n            const container = document.getElementById('criteriaContainer');\n            criteria.forEach(item => {\n                const div = document.createElement('div');\n                div.innerHTML = `\u003ch3 class=\"font-extrabold text-2xl mb-4 text-blue-900 border-l-4 border-blue-500 pl-3\">${item.name}\u003c/h3>\n                    \u003cdiv class=\"grid grid-cols-1 md:grid-cols-3 gap-4\" id=\"${item.id}\" data-score=\"0\">\n                    ${item.levels.map(l => `\n                        \u003cdiv data-level=\"${l.score}\" onclick=\"selectScore('${item.id}', ${l.score}, this)\" class=\"${CARD_BASE}\">\n                            \u003cdiv class=\"flex justify-between items-center mb-3\">\n                                \u003cspan class=\"text-xl font-bold text-gray-800\">${l.title}\u003c/span>\n                                \u003cspan class=\"${BADGE_BASE}\">${l.score} 分\u003c/span>\n                            \u003c/div>\n                            \u003cp class=\"text-gray-700 text-sm\">${l.desc}\u003c/p>\n                        \u003c/div>`).join('')}\u003c/div>`;\n                container.appendChild(div);\n            });\n        }\n\n        function selectScore(groupId, score, el) {\n            const group = document.getElementById(groupId);\n            group.querySelectorAll('.radio-card').forEach(c => {\n                c.className = CARD_BASE;\n                c.querySelector('span:nth-child(2)').className = BADGE_BASE;\n            });\n            if (el) {\n                el.className = CARD_ACTIVE;\n                el.querySelector('span:nth-child(2)').className = BADGE_ACTIVE;\n            }\n            group.dataset.score = score;\n            calculateTotal();\n        }\n\n        function calculateTotal() {\n            let t = 0;\n            criteria.forEach(c => t += parseInt(document.getElementById(c.id).dataset.score, 10));\n            document.getElementById('totalScore').innerText = t;\n        }\n\n        // ==================== 身份驗證 ====================\n        function onSeatChanged() {\n            const seat = document.getElementById('raterSeat').value.trim();\n            if (state.verified && Number(seat) === state.seat) return;\n            clearIdentity();\n            if (!seat) return;\n            document.getElementById('idModalSeat').innerText = seat;\n            document.getElementById('idCodeInput').value = '';\n            document.getElementById('idModalError').innerText = '';\n            openModal('idModal');\n            setTimeout(() => document.getElementById('idCodeInput').focus(), 50);\n        }\n\n        async function confirmIdentity() {\n            const seat = document.getElementById('raterSeat').value.trim();\n            const code = document.getElementById('idCodeInput').value.trim();\n            const errEl = document.getElementById('idModalError');\n            if (!/^\\d{4}$/.test(code)) { errEl.innerText = '請輸入四位數字身份碼'; return; }\n            const btn = document.getElementById('idConfirmBtn');\n            btn.disabled = true; btn.innerHTML = '\u003cspan class=\"spinner\">\u003c/span>';\n            try {\n                const res = await callServer('verifyIdentity', seat, code);\n                state.verified = true; state.seat = res.seat; state.code = code;\n                const nameInput = document.getElementById('raterName');\n                if (res.name) { nameInput.value = res.name; nameInput.readOnly = true; nameInput.classList.add('bg-gray-100'); }\n                setVerifyStatus(true);\n                closeModal('idModal');\n                loadMyRecords();\n            } catch (e) {\n                errEl.innerText = e.message;\n            } finally {\n                btn.disabled = false; btn.innerText = '確認';\n            }\n        }\n\n        function cancelIdentity() {\n            closeModal('idModal');\n            document.getElementById('raterSeat').value = '';\n            clearIdentity();\n        }\n\n        function clearIdentity() {\n            state.verified = false; state.seat = null; state.code = null;\n            const nameInput = document.getElementById('raterName');\n            nameInput.value = ''; nameInput.readOnly = false; nameInput.classList.remove('bg-gray-100');\n            setVerifyStatus(false);\n            document.getElementById('myRecordsSection').classList.add('hidden');\n        }\n\n        function setVerifyStatus(ok) {\n            const el = document.getElementById('verifyStatus');\n            el.className = 'mt-2 text-sm font-bold ' + (ok ? 'text-emerald-600' : 'text-gray-500');\n            el.innerText = ok ? '✅ 身份已驗證，可以評分' : '🔒 輸入座號後需驗證身份碼';\n        }\n\n        // ==================== 送出評分（Create / Update） ====================\n        function collectPayload() {\n            const seat = document.getElementById('raterSeat').value.trim();\n            const name = document.getElementById('raterName').value.trim();\n            const group = document.getElementById('targetGroup').value;\n            const scores = criteria.map(c => parseInt(document.getElementById(c.id).dataset.score, 10));\n            if (!seat || !name || !group) { showMessage('⚠️ 資料未完整', '請填寫座號、姓名並選擇評核組別。'); return null; }\n            if (!state.verified || Number(seat) !== state.seat) { onSeatChanged(); return null; }\n            const missing = criteria.filter((c, i) => !scores[i]).map(c => c.name);\n            if (missing.length) { showMessage('⚠️ 尚有面向未評分', missing.join('\\n')); return null; }\n            return { seat: state.seat, code: state.code, name, group: Number(group), scores, confirmed: false };\n        }\n\n        async function submitForm() {\n            if (state.submitting) return;\n            const payload = collectPayload();\n            if (payload) await sendPayload(payload);\n        }\n\n        async function sendPayload(payload) {\n            setSubmitting(true);\n            try {\n                const res = await callServer('submitScore', payload);\n                if (res.status === 'DUPLICATE') {\n                    state.pendingPayload = payload;\n                    document.getElementById('confirmDetail').innerText = `${res.groupLabel} 先前總分：${res.previousTotal} 分 → 本次總分：${payload.scores.reduce((a, b) => a + b, 0)} 分\\n（原紀錄會保留，新分數將標示「⚠️修改分數」）`;\n                    openModal('confirmModal');\n                    return;\n                }\n                showMessage(res.isModification ? '✏️ 已送出修改' : '✅ 評分已送出',\n                    `${res.groupLabel} 總分 ${res.total} 分` + (res.isModification ? '\\n已標示為「⚠️修改分數」，原紀錄保留。' : '') + (res.warning ? '\\n\\n' + res.warning : ''));\n                renderStats(res.stats);\n                resetFormAfterSubmit();\n                loadMyRecords();\n            } catch (e) {\n                showMessage('❌ 送出失敗', e.message);\n            } finally {\n                setSubmitting(false);\n            }\n        }\n\n        function confirmModification() {\n            closeModal('confirmModal');\n            if (!state.pendingPayload) return;\n            const payload = { ...state.pendingPayload, confirmed: true };\n            state.pendingPayload = null;\n            sendPayload(payload);\n        }\n\n        function setSubmitting(on) {\n            state.submitting = on;\n            const btn = document.getElementById('submitBtn');\n            btn.disabled = on;\n            btn.innerHTML = on ? '\u003cspan class=\"spinner\">\u003c/span> 送出中…' : '📤 送出評分';\n        }\n\n        /**\n         * 送出成功後重置表單：清空組別與四個面向的選擇、總分歸零、關閉「修改中」提示。\n         * 座號、姓名與身份驗證狀態會保留，方便同一位同學接著評下一組。\n         */\n        function resetFormAfterSubmit() {\n            document.getElementById('targetGroup').value = '';\n            criteria.forEach(c => selectScore(c.id, 0, null));\n            document.getElementById('editingBanner').classList.add('hidden');\n            state.pendingPayload = null;\n            window.scrollTo({ top: 0, behavior: 'smooth' });\n        }\n\n        // ==================== 我的評分紀錄（Read / Update / Delete） ====================\n        async function loadMyRecords() {\n            if (!state.verified) return;\n            try {\n                renderMyRecords(await callServer('getMyRecords', state.seat, state.code));\n            } catch (e) {\n                showMessage('❌ 讀取紀錄失敗', e.message);\n            }\n        }\n\n        function renderMyRecords(list) {\n            const section = document.getElementById('myRecordsSection');\n            const box = document.getElementById('myRecords');\n            section.classList.remove('hidden');\n            if (!list.length) { box.innerHTML = '\u003cp class=\"text-gray-500\">目前還沒有評分紀錄。\u003c/p>'; return; }\n            state.myRecords = list;\n            box.innerHTML = list.map((r, i) => `\n                \u003cdiv class=\"flex flex-col md:flex-row md:items-center justify-between gap-3 p-4 rounded-xl border ${r.status.includes('修改') ? 'border-amber-300 bg-amber-50' : 'border-gray-200 bg-gray-50'}\">\n                    \u003cdiv>\n                        \u003cdiv class=\"font-bold text-blue-900\">${escapeHtml(r.groupLabel)} ‧ 總分 ${r.total} 分 ${r.status.includes('修改') ? '\u003cspan class=\"ml-1 text-amber-700 text-sm\">⚠️修改分數\u003c/span>' : ''}\u003c/div>\n                        \u003cdiv class=\"text-sm text-gray-500\">${escapeHtml(r.time)} ‧ 各面向：${r.scores.join(' / ')}\u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"flex gap-2 shrink-0\">\n                        \u003cbutton type=\"button\" onclick=\"editRecord(${i})\" class=\"px-4 py-2 bg-blue-600 text-white text-sm font-bold rounded-lg\">修改\u003c/button>\n                        \u003cbutton type=\"button\" onclick=\"deleteRecord('${escapeHtml(r.id)}')\" class=\"px-4 py-2 bg-rose-100 text-rose-700 text-sm font-bold rounded-lg\">刪除\u003c/button>\n                    \u003c/div>\n                \u003c/div>`).join('');\n        }\n\n        /** 把舊紀錄帶回表單；送出時會觸發重複評分確認，並以「⚠️修改分數」新增一筆 */\n        function editRecord(index) {\n            const r = state.myRecords[index];\n            if (!r) return;\n            document.getElementById('targetGroup').value = String(r.group);\n            criteria.forEach((c, i) => {\n                const card = document.querySelector(`#${c.id} [data-level=\"${r.scores[i]}\"]`);\n                selectScore(c.id, r.scores[i], card);\n            });\n            document.getElementById('editingText').innerText = `✏️ 正在修改 ${r.groupLabel} 的評分（原總分 ${r.total} 分），調整後按「送出評分」`;\n            document.getElementById('editingBanner').classList.remove('hidden');\n            window.scrollTo({ top: 0, behavior: 'smooth' });\n        }\n\n        async function deleteRecord(id) {\n            if (!confirm('確定要刪除這筆評分紀錄嗎？刪除後無法復原。')) return;\n            try {\n                const res = await callServer('deleteMyRecord', state.seat, state.code, id);\n                renderMyRecords(res.records);\n                renderStats(res.stats);\n                showMessage('🗑️ 已刪除', '該筆評分紀錄已刪除。');\n            } catch (e) {\n                showMessage('❌ 刪除失敗', e.message);\n            }\n        }\n\n        // ==================== 即時數據（匿名） ====================\n        function renderStats(stats) {\n            if (!stats) return;\n            document.getElementById('totalSubmissions').innerText = stats.totalSubmissions;\n            document.getElementById('updatedAt').innerText = stats.updatedAt;\n            document.getElementById('groupStats').innerHTML = stats.groups.map(g => {\n                const pct = stats.maxTotal ? Math.round(g.average / stats.maxTotal * 100) : 0;\n                return `\u003cdiv class=\"p-4 rounded-xl border border-blue-100 bg-blue-50/50\">\n                    \u003cdiv class=\"flex justify-between items-baseline mb-2\">\n                        \u003cspan class=\"font-bold text-blue-900\">${escapeHtml(g.label)}\u003c/span>\n                        \u003cspan class=\"text-sm text-gray-600\">\u003cb class=\"text-xl text-blue-700\">${g.average.toFixed(2)}\u003c/b> / ${stats.maxTotal}（${g.count} 人評）\u003c/span>\n                    \u003c/div>\n                    \u003cdiv class=\"h-3 bg-blue-100 rounded-full overflow-hidden\">\u003cdiv class=\"bar h-full bg-gradient-to-r from-blue-500 to-yellow-400\" style=\"width:${pct}%\">\u003c/div>\u003c/div>\n                \u003c/div>`;\n            }).join('');\n            document.getElementById('feedBody').innerHTML = stats.feed.length ? stats.feed.map(f => `\n                \u003ctr class=\"border-b border-gray-100\">\n                    \u003ctd class=\"px-3 py-2 font-mono font-bold text-blue-800\">${escapeHtml(f.code)}\u003c/td>\n                    \u003ctd class=\"px-3 py-2\">${escapeHtml(f.groupLabel)}\u003c/td>\n                    \u003ctd class=\"px-3 py-2 font-bold\">${f.total}\u003c/td>\n                    \u003ctd class=\"px-3 py-2 text-gray-500\">${escapeHtml(f.time)}\u003c/td>\n                    \u003ctd class=\"px-3 py-2\">${f.isModification ? '\u003cspan class=\"text-amber-700 font-bold\">⚠️修改分數\u003c/span>' : '\u003cspan class=\"text-emerald-700\">已繳交\u003c/span>'}\u003c/td>\n                \u003c/tr>`).join('') : '\u003ctr>\u003ctd colspan=\"5\" class=\"px-3 py-4 text-gray-500\">尚無資料\u003c/td>\u003c/tr>';\n        }\n\n        async function refreshStats() {\n            try { renderStats(await callServer('getLiveStats')); } catch (e) { /* 背景刷新失敗時靜默 */ }\n        }\n\n        // ==================== 共用工具 ====================\n        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }\n        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }\n        function showMessage(title, body) {\n            document.getElementById('messageTitle').innerText = title;\n            document.getElementById('messageBody').innerText = body;\n            openModal('messageModal');\n        }\n        function escapeHtml(s) {\n            return String(s).replace(/[&\u003c>\"']/g, ch => ({ '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[ch]));\n        }\n\n        // ==================== 初始化 ====================\n        async function init() {\n            renderCriteria();\n            if (!IS_GAS) document.getElementById('previewBanner').classList.remove('hidden');\n            document.getElementById('raterSeat').addEventListener('change', onSeatChanged);\n            document.getElementById('idCodeInput').addEventListener('keydown', e => { if (e.key === 'Enter') confirmIdentity(); });\n            try {\n                const data = await callServer('getInitialData');\n                renderStats(data.stats);\n                setInterval(refreshStats, REFRESH_MS);\n            } catch (e) {\n                showMessage('⚙️ 系統設定有誤', e.message);\n            }\n        }\n        init();\n    \u003c/script>\n\u003c/body>\n\u003c/html>\n", "img": {"step0": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNTAwIDg0NCIgd2lkdGg9IjE1MDAiIGhlaWdodD0iODQ0IiBmb250LWZhbWlseT0iJ1BpbmdGYW5nIFRDJywnTm90byBTYW5zIFRDJywnTWljcm9zb2Z0IEpoZW5nSGVpJywnSGVpdGkgVEMnLHNhbnMtc2VyaWYiPgogIDxkZWZzPgogICAgPGZpbHRlciBpZD0ic29mdCIgeD0iLTUlIiB5PSItNSUiIHdpZHRoPSIxMTAlIiBoZWlnaHQ9IjExMCUiPgogICAgICA8ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxO ss=\"bubble\">\u003cp>這份作答展現了非常敏銳的幾何直覺與清晰的運算能力。以下依據「國小五年級幾何推理與面積計算評量規準（Rubric）」進行詳細評分與回饋：\u003c/p>\n\u003chr>\n\u003cp>📊 手寫題評分總表\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>批改面向\u003c/th>\u003cth>題分\u003c/th>\u003cth>得分\u003c/th>\u003cth>評量結果說明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>一、幾何推理與概念說明\u003c/strong>\u003c/td>\u003ctd>3.0 分\u003c/td>\u003ctd>\u003cstrong>1.5 分\u003c/strong>\u003c/td>\u003ctd>寫出「同底同高」且看出灰白面積平分關係，但未完整說明「底長總和相等」之幾何算理。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>二、算式列式與計算結果\u003c/strong>\u003c/td>\u003ctd>2.0 分\u003c/td>\u003ctd>\u003cstrong>2.0 分\u003c/strong>\u003c/td>\u003ctd>列式 270÷2=135 正確，數值運算精確無誤。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>三、立場表達與答句完整性\u003c/strong>\u003c/td>\u003ctd>1.0 分\u003c/td>\u003ctd>\u003cstrong>0.5 分\u003c/strong>\u003c/td>\u003ctd>答句數值與單位標示完整，但完全未以文字回應是否同意小黑的說法。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>總分\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>6.0 分\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>4.0 分\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>幾何直覺優異，運算精準；若補足文字推理細節與審題回應，將更臻完美！\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003chr>\n\u003cp>📝 各面向詳細診斷與回饋\u003c/p>\n\u003cp>一、幾何推理與概念說明（得分：1.5 / 3.0 分）\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>做得好的部分\u003c/strong>：\u003cul>\n\u003cli>能敏銳看出整體圖形中「灰色＋白色＝270」 [Source: 1: 🧲截圖 2026-07-11 21.35.17.png] ，並理解灰色與白色面積相等（各占一半） [Source: 1: 🧲截圖 2026-07-11 21.35.17.png] 。\u003cbr>• 能掌握平行線間「等高」的重要幾何性質，寫出「因為 同底同高」 [Source: 1: 🧲截圖 2026-07-11 21.35.17.png] 。\u003cbr>• \u003cstrong>需要訂正（❗️）\u003c/strong>：\u003c/li>\n\u003cli>❗️ \u003cstrong>名詞筆誤\u003c/strong>：題目中的三角形為「灰色」與「白色」，第二行寫成了「\u003cstrong>黑色\u003c/strong>＝白色」 [Source: 1: 🧲截圖 2026-07-11 21.35.17.png] ，應訂正為「灰色＝白色」。\u003cbr>• ❗️ \u003cstrong>缺少底長總和的說明\u003c/strong>：只寫「同底同高」 [Source: 1: 🧲截圖 2026-07-11 21.35.17.png] ，容易讓人誤以為是「單一個三角形與單一個三角形同底」，未清楚交代「\u003cstrong>2 個灰色三角形的底長總和＝3 個白色三角形的底長總和＝平行四邊形的底長\u003c/strong>」。\u003cbr>• \u003cstrong>進一步優化建議（✅）\u003c/strong>：\u003c/li>\n\u003cli>✅ 建議在說明中加入幾何特徵的完整敘述，例如：「因為灰色三角形與白色三角形夾在平行線之間，\u003cstrong>高都相同\u003c/strong>；且\u003cstrong>灰色三角形的底長加起來，剛好等於白色三角形的底長總和\u003c/strong>（皆等於平行四邊形的底），所以灰色面積和與白色面積和相等，各占平行四邊形面積的一半。」\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>二、算式列式與計算結果（得分：2.0 / 2.0 分）\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>做得好的部分\u003c/strong>：\u003cul>\n\u003cli>正確將「灰色面積占平行四邊形一半」的算理轉化為除法算式，寫出主算式 270÷2 [Source: 1: 🧲截圖 2026-07-11 21.35.17.png] 。\u003cbr>• 四則運算計算正確，精準得出結果 135 [Source: 1: 🧲截圖 2026-07-11 21.35.17.png] ，解題歷程乾淨俐落。\u003cbr>• \u003cstrong>需要訂正（❗️）\u003c/strong>：\u003c/li>\n\u003cli>本面向表現完美，無需要訂正之處！\u003cbr>• \u003cstrong>進一步優化建議（✅）\u003c/strong>：\u003c/li>\n\u003cli>✅ 繼續保持清晰簡潔的列式習慣。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>三、立場表達與答句完整性（得分：0.5 / 1.0 分）\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>做得好的部分\u003c/strong>：\u003cul>\n\u003cli>答句完整寫出數值與正確的面積單位「A: 135 cm²」 [Source: 1: 🧲截圖 2026-07-11 21.35.17.png] ，單位使用標準且精確。\u003cbr>• \u003cstrong>需要訂正（❗️）\u003c/strong>：\u003c/li>\n\u003cli>❗️ \u003cstrong>漏答題目第一問（立場未宣告）\u003c/strong>：題目詢問「你同意小黑的說法，還是你可以算出答案？請說明理由」，作答中直接進行計算與答題，\u003cstrong>完全漏寫了立場判定\u003c/strong>（未說明「不同意小黑」或「可以算出答案」）。\u003cbr>• \u003cstrong>進一步優化建議（✅）\u003c/strong>：\u003c/li>\n\u003cli>✅ 解題時建議養成「按題目提問逐一回答」的習慣，在解題開頭或答句加上一句：「\u003cstrong>我不同意小黑的說法，我可以算出答案\u003c/strong>」，確保審題與立場宣告滴水不漏。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>🌟 教師鼓勵的話\u003c/p>\n\u003cp>你非常聰明，一眼就抓住了圖形「同底同高」以及「灰色占一半」的關鍵核心，計算也非常準確！只要在文字表達上把觀察到的「底長總和相等」寫得更完整，並記得回應題目提出的問題（表達立場），你的數學論述能力一定會更上一層樓，非常值得期待！加油！\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"msg user\">\u003cdiv class=\"who\">老師\u003c/div>\u003cdiv class=\"bubble\">\u003cp>請評分\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"msg model\">\u003cdiv class=\"who\">Gemini Notebook\u003c/div>\u003cdiv class=\"bubble\">\u003cp>針對您所選取的 4 份學生手寫題作答截圖，以下依據「國小五年級幾何推理與面積計算評量規準（Rubric）」進行逐份客觀評分、詳細診斷、訂正標註（❗️）、優化建議（✅）與溫暖鼓勵。\u003c/p>\n\u003chr>\n\u003cp>📑 學生作答一（檔案：🧲截圖 2026 135，但包含多餘且錯誤的連續相除運算 [Source: 3: 🧲截圖 2026-07-11 21.37.26.png] 。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>三、立場表達與答句完整性\u003c/strong>\u003c/td>\u003ctd>1.0 分\u003c/td>\u003ctd>\u003cstrong>0.0 分\u003c/strong>\u003c/td>\u003ctd>表達「我不能算出來」，立場錯誤，且未給出正確答句與單位 [Source: 3: 🧲截圖 2026-07-11 21.37.26.png] 。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>總分\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>6.0 分\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>1.0 分\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>作圖嘗試非常積極，需掌握整體面積分割關係！\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>📝 各面向診斷與回饋\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>一、幾何推理與概念說明\u003c/strong>\u003cul>\n\u003cli>\u003cstrong>做得好的部分\u003c/strong>：學生在圖形上積極嘗試分割與標示數值，展現了探索解題的意願 [Source: 3: 🧲截圖 2026-07-11 21.37.26.png] 。\u003cbr>• \u003cstrong>需要訂正（❗️）\u003c/strong>：❗️ \u003cstrong>概念誤區\u003c/strong>：寫出「我不能算出來，可能需要用到比例尺」，誤以為必須量測個別長度或仰賴比例尺 [Source: 3: 🧲截圖 2026-07-11 21.37.26.png] 。\u003cbr>• \u003cstrong>進一步優化建議（✅）\u003c/strong>：這題不需要知道單一底長的公分數，只要發現甲與乙三角形的底加起來正好是底邊，且等高，兩者相加就是平行四邊形的一半。\u003cbr>• \u003cstrong>二、算式列式與計算結果\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>做得好的部分\u003c/strong>：正確寫出了主算式 270÷2=135 [Source: 3: 🧲截圖 2026-07-11 21.37.26.png] 。\u003cbr>• \u003cstrong>需要訂正（❗️）\u003c/strong>：❗️ \u003cstrong>多餘且錯誤的計算\u003c/strong>：後續將 135 又連續除以 2（135÷2=67.5、67.5÷2=33.75），造成結果混亂 [Source: 3: 🧲截圖 2026-07-11 21.37.26.png] 。\u003cbr>• \u003cstrong>進一步優化建議（✅）\u003c/strong>：算到 270÷2=135 時就已經得到甲與乙兩個灰色三角形的總面積了，不需要再往下分割計算。\u003cbr>• \u003cstrong>三、立場表達與答句完整性\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>做得好的部分\u003c/strong>：有以文字表達個人觀點 [Source: 3: 🧲截圖 2026-07-11 21.37.26.png] 。\u003cbr>• \u003cstrong>需要訂正（❗️）\u003c/strong>：❗️ \u003cstrong>立場錯誤與缺漏單位\u003c/strong>：回答「我不能算出來」，未標示最終答案與面積單位 [Source: 3: 🧲截圖 2026-07-11 21.37.26.png] 。\u003cbr>• \u003cstrong>進一步優化建議（✅）\u003c/strong>：建立對幾何特徵的信心，回答「不同意小黑，可以算出答案：135 cm²」。\u003cbr>• \u003cstrong>🌟 鼓勵的話\u003c/strong>：你在考卷上畫了輔助圖形並不斷嘗試計算，這種努力不放棄的解題精神非常值得肯定！其實你的第一步 270÷2=135 i>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>做得好的部分\u003c/strong>：有注意到題目給予的平行四邊形面積數值 270 [Source: 4: 🧲截圖 2026-07-11 21.37.47.png] 。\u003cbr>• \u003cstrong>需要訂正（❗️）\u003c/strong>：❗️ \u003cstrong>未進行數值計算\u003c/strong>：停留在「270−x=y」的符號假設，沒有算出具體答案 135 [Source: 4: 🧲截圖 2026-07-11 21.37.47.png] 。\u003cbr>• \u003cstrong>進一步優化建議（✅）\u003c/strong>：直接將幾何概念化為算式：270÷2=135。\u003cbr>• \u003cstrong>三、立場表達與答句完整性\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>做得好的部分\u003c/strong>：最後有寫出「兩個面積 =y」的結論形式 [Source: 4: 🧲截圖 2026-07-11 21.37.47.png] 。\u003cbr>• \u003cstrong>需要訂正（❗️）\u003c/strong>：❗️ \u003cstrong>未回答立場與數值\u003c/strong>：未說明是否同意小黑，也沒有給出具體數值與單位 cm² [Source: 4: 🧲截圖 2026-07-11 21.37.47.png] 。\u003cbr>• \u003cstrong>進一步優化建議（✅）\u003c/strong>：作答結尾務必完整寫出：答：不同意小黑，面積為 135 cm²。\u003cbr>• \u003cstrong>🌟 鼓勵的話\u003c/strong>：你非常厲害，已經嘗試運用國中的代數符號與公式來推導題目，思考方式很有深度！只要再把幾何圖形中的「等高」與「底長和」帶入公式中，把數值算出來，你就能成為幾何推理高手！\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\u003c/div>\u003c/div>\n\u003cdiv class=\"msg user\">\u003cdiv class=\"who\">老師\u003c/div>\u003cdiv class=\"bubble\">\u003cp>最後要讓學生能更結合這個課程習得的知識、能力、態度，專業的完成這樣的任務，事前的課程需要幫學生搭建哪些鷹架呢（活動、講座、訪談、踏查、影片、資料搜尋......）？ 每個課程環節需要提供怎樣的工作表（檢核表、書面或影片參考資料、自評表、互評表.....）才能協助學生完美達成任務\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"msg model\">\u003cdiv class=\"who\">Gemini Notebook\u003c/div>\u003cdiv class=\"bubble\">\u003cp>為了讓國小五年級學生在面對這類「情境思辨型幾何手寫題」時，能融會貫通\u003cstrong>學科知識\u003c/strong>（底高性質、分配律）、展現\u003cstrong>幾何論證能力\u003c/strong>（空間解構、符號轉換），並建立嚴謹求證的\u003cstrong>學習態度\u003c/strong>（敢於批判反駁、書寫完整規範），我們需要將整體學習歷程化為\u003cstrong>四個漸進式鷹架階段\u003c/strong>。\u003c/p>\n\u003cp>以下為具體課程設計、鷹架活動與各環節應配套的學習工作表架構：\u003c/p>\n\u003chr>\n\u003cp>🧱 階段一：直觀拆解與動手操作（建立知識與空間解構能力）\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>學習核心\u003c/strong>：突破「必須知道每一個三角形底長才能算面積」的思維限制，發現\u003cstrong>等高\u003c/strong>與\u003cstrong>底長總和\u003c/strong>的幾何不變量。\u003cbr>• \u003cstrong>教學鷹架活動\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>GeoGebra 動態幾何拖曳觀察（互動操作／微影片）\u003c/strong>：讓學生在平板上拖動平行四邊形頂邊上的分點，觀察甲、乙兩個三角形的單一底長雖然隨意改變，但「兩者底長相加的長度」和「圖形的高」始終維持不變。\u003cbr>• \u003cstrong>透明片疊合與剪貼拼貼活動（具象操作）\u003c/strong>：提供印有格線的平行四邊形圖形紙，讓學生動手將灰色三角形剪下、拼合，直觀感受「兩個灰色三角形拼起來的面積剛好等於三個白色三角形拼起來的面積，也是整體的一半」。\u003cbr>• \u003cstrong>配套工作表與輔助工具\u003c/strong>：\u003c/li>\n\u003cli>\u003cstrong>【幾何探究操作引導單】\u003c/strong>：引導學生記錄「拖動分點前」與「拖動分點後」甲底、乙底的變化，並填寫思考題：「\u003cem>甲和乙的底個別改變了，但什麼東西是從頭到尾都沒變的？\u003c/em>」\u003cbr>• \u003cstrong>【概念圖解參考卡（Anchor Chart）】\u003c/strong>：圖解呈現「夾在兩平行線之間的垂直距離處處相等（等高）」以及「底長相加＝平行四邊形的底」。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>🧱 階段二：算理推導與乘法分配律橋接（深化算理與符號轉化能力）\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>學習核心\u003c/strong>：將視覺直覺轉化為數學語言，理解為什麼可以用 (底甲​+底乙​)×高÷2 算得總和，並推導出「平行四邊形面積 ÷2」的算理。\u003cbr>• \u003cstrong>教學鷹架活動\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>「算式大解密」小組鋪排討論（小組合作）\u003c/strong>：給予學生字卡（「底甲 × 高 ÷2」、「底乙 × 高 ÷2」、「(底甲 + 底乙)× 高 ÷2」），引導小組利用乘法分配律將分開的算式合併。\u003cbr>• \u003cstrong>逆向追問辯論（微辯論）\u003c/strong>：提問「如果平行四邊形是 270 cm²，我們根本不知道高是多少，真的可以除以 2 嗎？」，引導學生透過公式結構對比： 灰色面積和=(底×高)÷2=270÷2=135\u003cbr>• \u003cstrong>配套工作表與輔助工具\u003c/strong>：\u003c/li>\n\u003cli>\u003cstrong>【算理橋接鷹架工作表】\u003c/strong>：採「填空式／框線式」鷹架，逐步引導文字與代數關係：\u003cul>\n\u003cli>灰色甲面積 ＝（​ × 高）÷2\u003cbr>• 灰色乙面積 ＝（​ × 高）÷2\u003cbr>• 灰色甲＋乙面積 ＝（​+​）× 高 ÷2 ＝ ​ × 高 ÷2\u003cbr>• \u003cstrong>【錯誤診斷範例工作單】\u003c/strong>：提供典型迷思作答（如「過度連續除以 2」或「寫出 x+x=x」），讓小組抓出錯誤並給予修正建議。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>🧱 階段三：批判思辨與立場表達（建立思維態度與論證結構）\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>學習核心\u003c/strong>：面對情境題中的不同觀點（小黑說算不出來），能進行客觀批判並寫出結構嚴謹的「主張—證據—推論（CER 模型）」解答。\u003cbr>• \u003cstrong>教學鷹架活動\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>「法庭詰辯」角色扮演（情境模擬）\u003c/strong>：一位同學扮演小黑（主張算不出來，因為缺少長度數據），其他同學擔任幾何律師，必須提出明確的數學證據（公式、底高總和）進行反駁。\u003cbr>• \u003cstrong>手寫題寫作五步驟示範（教師放聲思考／Think-aloud）\u003c/strong>：示範完整的解題歷程書寫順序：「立場宣告 → 圖形特徵觀察 → 公式算理推導 → 列式運算 → 答句與單位標示」。\u003cbr>• \u003cstrong>配套工作表與輔助工具\u003c/strong>：\u003c/li>\n\u003cli>\u003cstrong>【數學論證寫作範本（CER 學習單）】\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>立場（Claim）\u003c/strong>：我（同意／不同意）小黑的說法，我認為（可以／不可以）算出答案。\u003cbr>• \u003cstrong>證據（Evidence）\u003c/strong>：因為這兩個灰色三角形與平行四邊形 ​，且底長加起來 ​。\u003cbr>• \u003cstrong>推理（Reasoning）\u003c/strong>：根據三角形面積公式，兩灰色三角形面積和剛好等於平行四邊形面積的 ​。\u003cbr>• \u003cstrong>計算與答（Calculation &amp; Answer）\u003c/strong>：算式：​，答：​。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>🧱 階段四：自評、互評與反思精進（促進元認知與專業產出）\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>學習核心\u003c/strong>：依據評量規準（Rubric）客觀審視自己的作答，抓出漏字、漏單位、語意不清之處並即時訂正。\u003cbr>• \u003cstrong>教學鷹架活動\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>小老師互批工作坊\u003c/strong>：發下匿名或同學的真實作答樣卷，讓學生手持規準對照表進行「圈點批改」，標註出「做得好的地方（🌟）」與「需要訂正之處（❗️）」。\u003cbr>• \u003cstrong>對照標竿優化重寫\u003c/strong>：對照標竿解答檢視自己的作品，進行二次修訂（Drafting → Revising）。\u003cbr>• \u003cstrong>配套工作表與輔助工具\u003c/strong>：\u003c/li>\n\u003cli>\u003cstrong>【手寫題 5 點自我檢核表（學生版 Checklist）】\u003c/strong>：\u003cul>\n\u003cli>[ ] \u003cstrong>① 我有回答是否同意小黑嗎？\u003c/strong>（明確寫出「不同意」或「可以算出答案」）\u003cbr>• [ ] \u003cstrong>② 我有說出高是一樣的嗎？\u003c/strong>（指出三角形與平行四邊形等高）\u003cbr>• [ ] \u003cstrong>③ 我有說出底長總和的關係嗎？\u003c/strong>（寫出灰色底長加起來等於平行四邊形的底）\u003cbr>• [ ] \u003cstrong>④ 我的算式只有必要步驟且算對了嗎？\u003c/strong>（列出 270÷2=135，沒有多除或算錯）\u003cbr>• [ ] \u003cstrong>⑤ 我的答句有寫數字並標上正確單位嗎？\u003c/strong>（寫出 cm² 或 平方公分）\u003cbr>• \u003cstrong>【同儕互評回饋單】\u003c/strong>：\u003c/li>\n\u003cli>我最欣賞你寫得清楚的地方是：​。\u003cbr>• 我發現有需要提醒你訂正的符號或漏寫項目（❗️）：​。\u003cbr>• 給你的進一步優化建議（✅）：​。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>💡 總結教學效益\u003c/p>\n\u003cp>透過「\u003cstrong>動態觀察\u003c/strong> → \u003cstrong>算理轉換\u003c/strong> → \u003cstrong>CER論證寫作\u003c/strong> → \u003cstrong>規準自評互評\u003c/strong>」這套完整的鷹架網絡，學生不再只是憑直覺猜測「應該可以」或盲目運算，而是能夠自信地運用幾何語言嚴謹論證，從容展現數學素養與專業作答水準。\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"msg user\">\u003cdiv class=\"who\">老師\u003c/div>\u003cdiv class=\"bubble\">\u003cp>請提供我上面提及的『某工作單/表單/圖卡/日誌/工具』，根據任務學習目標『某某』請提供它的要點標題或提問、學生填答方式...並附上學生空白表單與模擬學生填寫 上面的『某』請都依據我的脈絡協助我書寫\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"msg model\">\u003cdiv class=\"who\">Gemini Notebook\u003c/div>\u003cdiv class=\"bubble\">\u003cp>依據您在前述課程鷹架脈絡中的規劃，針對學生在此次手寫題中最關鍵的「論證結構缺漏」、「幾何特徵未說明」與「立場未表達」等痛點，為您選定並具體開展最核心的學習工具——\u003cstrong>【數學論證寫作範本（CER 學習單）】\u003c/strong>。\u003c/p>\n\u003chr>\n\u003cp>一、工具基本資訊與學習目標對應\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>工具名稱\u003c/strong>：【幾何推理手寫題：CER 數學論證寫作引導工作單】\u003cbr>• \u003cstrong>對應核心學習目標\u003c/strong>：\u003cul>\n\u003cli>\u003cstrong>立場主張（Claim）\u003c/strong>：學生能根據幾何分析結果，明確寫出是否同意小黑說法的立場與決策。\u003cbr>• \u003cstrong>證據觀察（Evidence）\u003c/strong>：學生能觀察並敘述「兩灰色三角形的高相等」且「底長總和等於平行四邊形底長」的幾何特徵。\u003cbr>• \u003cstrong>算理推導（Reasoning）\u003c/strong>：學生能運用三角形與平行四邊形面積公式結構，以分配律說明灰色面積和為整體一半的算理。\u003cbr>• \u003cstrong>運算與規範（Calculation &amp; Answer）\u003c/strong>：學生能列出 270÷2=135 正確算式，並以標準面積單位（cm²）完整作答。\u003cbr>• \u003cstrong>學生填答方式\u003c/strong>：二選一立場勾選、幾何關鍵詞填空、算理公式推導連貫文字書寫、獨立四則算式列式、標準答句標示。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003chr>\n\u003cp>二、學生空白工作表單（Printable Worksheet）\u003c/p>\n\u003cpre>\u003ccode>================================================================================\n【國小五年級數學素養手寫題】幾何推理與論證寫作引導單（CER 模型）\n五年 _____ 班  座號：_____  姓名：_________________  日期：___月___日\n================================================================================\n\n【題目情境】\n平行四邊形面積為 270 cm²。老師問甲、乙這兩個灰色三角形的面積相加是多少平方公分？\n小黑說：「題目沒有給個別三角形的底和高，這題沒辦法算出答案。」\n你同意小黑的說法，還是你可以算出答案？請說明理由並計算。\n\n--------------------------------------------------------------------------------\n步驟一：【主張與立場】（Claim）—— 你對小黑說法的判斷是什麼？\n--------------------------------------------------------------------------------\n請勾選你的立場，並以完整句子寫出你的主張：\n□ 我同意小黑的說法（沒辦法算出答案）\n□ 我不同意小黑的說法（可以算出答案）\n\n我的立場宣告句：\n________________________________________________________________________________\n\n--------------------------------------------------------------------------------\n步驟二：【幾何觀察與證據】（Evidence）—— 你在圖形中看到了哪些不變的幾何事實？\n--------------------------------------------------------------------------------\n【提示：請觀察夾在兩條平行線之間的「高」，以及底邊的長度關係】\n\n1. 高的關係：\n   灰色三角形甲、灰色三角形乙，以及原本的平行四邊形，它們的高有什麼關係？\n   答：它們夾在兩條平行線之間，所以高都___________________________。\n\n2. 底的關係：\n   灰色三角形甲的底 ＋ 灰色三角形乙的底 ＝ _______________________________ 的底。\n\n--------------------------------------------------------------------------------\n步驟三：【算理推導與連結】（Reasoning）—— 為什麼可以這樣算？幾何道理在哪裡？\n--------------------------------------------------------------------------------\n【提示：請運用三角形面積公式（底 × 高 ÷ 2）與乘法分配律說明】\n\n因為：\n灰色面積和 ＝（底甲 × 高 ÷ 2）＋（底乙 × 高 ÷ 2）\n           ＝（底甲 ＋ 底乙）× 高 ÷ 2\n           ＝（_______________________）× 高 ÷ 2\n所以：\n兩個灰色三角形的面積總和，剛好是整個平行四邊形面積的（      ）半，\n只要把平行四邊形的面積除以（      ），就能算出答案。\n\n請將上述道理整理成一段通順的文字說明：\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n\n--------------------------------------------------------------------------------\n步驟四：【算式列式與計算】（Calculation）\n--------------------------------------------------------------------------------\n請依據上述推導出的算理，列出算式並計算出數值：\n\n算式：\n\n--------------------------------------------------------------------------------\n步驟五：【答句與單位】（Answer）\n--------------------------------------------------------------------------------\n答：________________________________________________________\n================================================================================\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003cp>三、模擬學生填寫範例（標竿模範作答）\u003c/p>\n\u003cpre>\u003ccode>================================================================================\n【國小五年級數學素養手寫題】幾何推理與論證寫作引導單（CER 模型）\n五年  3  班  座號： 12   姓名：  林小華        日期： 11 月 8 日\n================================================================================\n\n【題目情境】\n（略）\n\n--------------------------------------------------------------------------------\n步驟一：【主張與立場】（Claim）\n--------------------------------------------------------------------------------\n□ 我同意小黑的說法（沒辦法算出答案）\n☑ 我不同意小黑的說法（可以算出答案）\n\n我的立場宣告句：\n我不同意小黑的說法，我認為這題可以算出答案。\n\n--------------------------------------------------------------------------------\n步驟二：【幾何觀察與證據】（Evidence）\n--------------------------------------------------------------------------------\n1. 高的關係：\n   答：它們夾在兩條平行線之間，所以高都【一樣長（相等）】。\n\n2. 底的關係：\n   灰色三角形甲的底 ＋ 灰色三角形乙的底 ＝ 【平行四邊形】 的底。\n\n--------------------------------------------------------------------------------\n步驟三：【算理推導與連結】（Reasoning）\n--------------------------------------------------------------------------------\n因為：\n灰色面積和 ＝（底甲 × 高 ÷ 2）＋（底乙 × 高 ÷ 2）\n           ＝（底甲 ＋ 底乙）× 高 ÷ 2\n           ＝（【平行四邊形的底】）× 高 ÷ 2\n所以：\n兩個灰色三角形的面積總和，剛好是整個平行四邊形面積的（ 一 ）半，\n只要把平行四邊形的面積除以（  2  ），就能算出答案。\n\n請將上述道理整理成一段通順的文字說明：\n兩個灰色三角形夾在平行線之間，所以高都一樣長；而且甲和乙兩個三角形的底長加起來，\n剛好等於平行四邊形的底長。根據三角形面積公式，把底相加乘以高再除以 2，面積和剛好\n會是平行四邊形面積的一半，因此不需要知道個別的底和高也能算出答案。\n\n--------------------------------------------------------------------------------\n步驟四：【算式列式與計算】（Calculation）\n--------------------------------------------------------------------------------\n算式：\n270 ÷ 2 = 135\n\n--------------------------------------------------------------------------------\n步驟五：【答句與單位】（Answer）\n--------------------------------------------------------------------------------\n答：可以算出答案，灰色三角形面積相加是 135 cm²（或 135 平方公分）。\n================================================================================\n\u003c/code>\u003c/pre>\n\u003chr>\n\u003cp>💡 教師使用建議與導引技巧\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>漸進退場（Scaffolding Fading）\u003c/strong>：初次練習時保留步驟二、三的填空引導；第二次練習同類型題目時，可將填空處撤除，只留下 CER 三大區塊標題，訓練學生自主組織文字的能力。\u003cbr>• \u003cstrong>對接評量規準（Rubric）\u003c/strong>：完成引導單後，直接讓學生拿著評量規準（6 分制）進行\u003cstrong>自評互評\u003c/strong>，學生能一目了然發現自己是否「漏寫立場」或「漏標 cm² 單位」，達成兼顧學科素養與規範的完整作答。\u003c/li>\n\u003c/ul>\u003c/div>\u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>", "sampleCodeGs": "/**\n * 📁 code.gs\n * 國小三年級數學「圓規畫圓」表現任務 ‧ 同儕評分系統（後端）\n *\n * 分頁說明（第一次開啟網頁時自動建立，不需手動執行任何函式）：\n *   使用說明 ── 系統說明\n *   評分總表 ── 第一欄為評分者座號，橫軸為第一組～第七組，儲存格為評分總分\n *               重複評分不覆寫，於該座號下一列標示「⚠️修改分數」\n *   評分紀錄 ── 每一次提交（新增／修改／撤回）的完整明細與時間\n *   學生名單 ── 座號、姓名、四個數字身份碼、匿名代碼\n */\n\n// ╔══════════════════════════════════════════════════════════════════════╗\n// ║ 🔧【更換 Google Sheet 請改這裡】整套系統只有這一個地方需要修改            ║\n// ║                                                                      ║\n// ║  Sheet ID 是試算表網址中 /d/ 與 /edit 之間的那一串文字：                ║\n// ║  https://docs.google.com/spreadsheets/d/【這一段就是 ID】/edit         ║\n// ║                                                                      ║\n// ║  ⚠️ 改完後請重新部署：部署 → 管理部署作業 → ✏️編輯 → 版本選「新版本」→ 部署 ║\n// ║     新的試算表若沒有分頁，第一次開啟網頁時會自動建立範本與模擬資料。        ║\n// ╚══════════════════════════════════════════════════════════════════════╝\nconst SPREADSHEET_ID = '請貼上您的試算表 ID';   // 👈👈👈 只要換掉引號裡的 ID\n// ════════════════════════════════════════════════════════════════════════\n\nconst TZ = 'Asia/Taipei';\n\nconst SHEET = { README: '使用說明', MATRIX: '評分總表', LOG: '評分紀錄', ROSTER: '學生名單' };\nconst SHEET_ORDER = [SHEET.README, SHEET.MATRIX, SHEET.LOG, SHEET.ROSTER];\n\nconst GROUPS = ['第一組', '第二組', '第三組', '第四組', '第五組', '第六組', '第七組'];\nconst CRITERIA = ['半徑測量與開口固定', '圓心定位與針尖固定', '圓規握持與作圖順暢度', '幾何要素標示與概念連結'];\nconst MAX_TOTAL = CRITERIA.length * 4;\n\nconst TYPE = { NEW: '原始評分', EDIT: '修改分數', DEL: '撤回評分' };\nconst ROW_KIND = { MAIN: '原始評分列', REV: '修改紀錄列' };\n\n// 評分總表欄位：A 座號 | B~H 第一~七組 | I 最後繳交時間 | J 列別\nconst MATRIX_HEADER = ['評分者座號'].concat(GROUPS, ['最後繳交時間', '列別']);\nconst COL_TIME = GROUPS.length + 2;\nconst COL_KIND = GROUPS.length + 3;\n\nconst LOG_HEADER = ['紀錄ID', '繳交時間', '評分者座號', '評分者姓名', '匿名代碼', '評核組別']\n  .concat(CRITERIA, ['總分', '紀錄類型']);\nconst ROSTER_HEADER = ['座號', '姓名', '四個數字身份碼', '匿名代碼'];\n\nconst MAX_FAIL = 5;          // 身份碼連續錯誤上限\nconst FAIL_LOCK_SEC = 300;   // 超過上限後鎖定秒數\n\nconst MOCK_NAMES = ['王小明', '李小華', '張家豪', '陳怡君', '林志明', '黃雅婷', '吳承翰', '劉欣怡', '蔡宗霖', '楊淑芬',\n  '許文傑', '鄭佳穎', '謝明哲', '郭雨涵', '洪子軒', '曾詩涵', '邱冠宇', '廖品妍', '賴俊宏', '周采潔',\n  '徐浩然', '蘇芷晴', '葉柏翰', '莊心妤', '呂宥廷', '江若彤', '何宇翔', '羅思妤', '高翊凱', '潘語彤'];\nconst ANON_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';\n\n/* =====================================================================\n *  網頁入口\n * ===================================================================== */\nfunction doGet() {\n  return HtmlService.createHtmlOutputFromFile('Index')\n    .setTitle('圓規畫圓表現任務 ‧ 同儕評分系統')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1.0');\n}\n\n/* =====================================================================\n *  前台呼叫的函式（CRUD）\n * ===================================================================== */\n\n/** Read：網頁載入時呼叫，並自動偵測／建立缺少的分頁與模擬資料 */\nfunction getInitialData() {\n  const created = ensureSetup_();\n  return { ok: true, created: created, groups: GROUPS, stats: buildLiveStats_() };\n}\n\n/** Read：即時看板（完全匿名） */\nfunction getLiveStats() {\n  ensureSetup_();\n  return buildLiveStats_();\n}\n\n/** 驗證座號與四個數字身份碼 */\nfunction verifyIdentity(seat, code) {\n  ensureSetup_();\n  const a = auth_(seat, code);\n  if (!a.ok) return a;\n  return {\n    ok: true,\n    seat: a.student.seat,\n    name: a.student.name,\n    anon: a.student.anon,\n    rated: myRated_(a.student.seat, readLog_())\n  };\n}\n\n/** Read：自己的評分紀錄 */\nfunction getMyRatings(seat, code) {\n  ensureSetup_();\n  const a = auth_(seat, code);\n  if (!a.ok) return a;\n  return { ok: true, rated: myRated_(a.student.seat, readLog_()) };\n}\n\n/** Create / Update：送出評分（重複評分需 confirmRevision = true） */\nfunction submitRating(payload) {\n  ensureSetup_();\n  payload = payload || {};\n  const a = auth_(payload.seat, payload.code);\n  if (!a.ok) return a;\n  const st = a.student;\n\n  const g = Number(payload.group);\n  if (!(g >= 1 && g \u003c= GROUPS.length)) return { ok: false, message: '請選擇評核組別！' };\n\n  const scores = (payload.scores || []).map(Number);\n  if (scores.length !== CRITERIA.length || scores.some(s => !(Number.isInteger(s)
